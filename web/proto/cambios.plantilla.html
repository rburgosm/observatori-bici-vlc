<script>
"use strict";
const C = window.CAMBIOS;   // [{f: "AAAA-MM-DD", t: "datos" | "metode" | "web", va, es}], de docs/cambios.csv
let L = "va", F = "tots";
const T = {
va:{marca:"Observatori de la bici i el patinet de València", nav_obs:"Observatori", nav_inf:"Informe", nav_pla:"El Pla, al dia", nav_met:"Mètode", salta:"Salta al contingut",
  ey:"Registre de canvis", h1:"Què ha canviat",
  sub:"Cada canvi en les dades, en el mètode o en la web, amb la seua data. Quan una xifra canvia per una decisió nostra, ho expliquem ací i en la pàgina de mètode.",
  tipos:{tots:"Tots", datos:"Dades", metode:"Mètode", web:"Web"},
  peu:"Els canvis del codi queden, a més, en l'historial del repositori del projecte.",
  mes:["de gener","de febrer","de març","d'abril","de maig","de juny","de juliol","d'agost","de setembre","d'octubre","de novembre","de desembre"]},
es:{marca:"Observatorio de la bici y el patinete de València", nav_obs:"Observatorio", nav_inf:"Informe", nav_pla:"El Plan, al día", nav_met:"Método", salta:"Salta al contenido",
  ey:"Registro de cambios", h1:"Qué ha cambiado",
  sub:"Cada cambio en los datos, en el método o en la web, con su fecha. Cuando una cifra cambia por una decisión nuestra, lo explicamos aquí y en la página de método.",
  tipos:{tots:"Todos", datos:"Datos", metode:"Método", web:"Web"},
  peu:"Los cambios del código quedan, además, en el historial del repositorio del proyecto.",
  mes:["de enero","de febrero","de marzo","de abril","de mayo","de junio","de julio","de agosto","de septiembre","de octubre","de noviembre","de diciembre"]}};
const fecha = f => { const [y, m, d] = f.split("-").map(Number); return `${d} ${T[L].mes[m - 1]} ${y}`; };
function pintar(){
  const t = T[L];
  document.documentElement.lang = L === "va" ? "ca" : "es";
  document.title = `${t.ey} · ${t.marca}`;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t[el.dataset.t]; });
  document.getElementById("filtros").innerHTML = Object.entries(t.tipos).map(([k, v]) => `<button data-f="${k}" aria-pressed="${F === k}">${v}</button>`).join("");
  document.querySelectorAll("#filtros button").forEach(b => b.onclick = () => { F = b.dataset.f; pintar(); });
  const dias = [...new Set(C.map(c => c.f))].sort().reverse();   // lo más reciente arriba
  document.getElementById("contingut").innerHTML = dias.map(f => { const es = C.filter(c => c.f === f && (F === "tots" || c.t === F));
    return es.length ? `<section class="dia"><h2><time datetime="${f}">${fecha(f)}</time></h2><ul>${es.map(c => `<li><span class="tipo">${t.tipos[c.t]}</span><span>${c[L]}</span></li>`).join("")}</ul></section>` : ""; }).join("");
  ["va", "es"].forEach(l => document.getElementById("l-" + l).setAttribute("aria-pressed", L === l));
}
try { const s = localStorage.getItem("obs-lang"); if (s === "va" || s === "es") L = s; } catch(e){}
["va", "es"].forEach(l => document.getElementById("l-" + l).onclick = () => { L = l; try { localStorage.setItem("obs-lang", l); } catch(e){} pintar(); });
pintar();
</script>
