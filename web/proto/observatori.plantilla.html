<style>
/* Layout: banda de meta arriba, mapa protagonista con ficha lateral, hallazgos y datos debajo. Lenguaje de señalización vial. */
:root{
  --bg:#EEF1F2; --surface:#FFFFFF; --line:#D3D9DC; --ink:#15202B; --ink2:#55626E;
  /* categorías (orden fijo: bici, patinete, choque bici–patinete); validadas con validate_palette.js sobre #EEF1F2:
     el naranja y el aqua no llegan a 3:1 en claro, así que siempre van con leyenda o etiqueta */
  --bici:#2a78d6; --pat:#C94B17; --amb:#14875E; --mix:#8A949D; --meta:#15202B; --warn:#B42318;
  --sel:#b87a00; --street:#C9D0D4; --street2:#AEB7BD; --lane:#9DB8AE; --mapbg:#F7F8F8;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#17212A; --line:#2A3641; --ink:#E7ECEF; --ink2:#9AA7B2;
  --bici:#3987e5; --pat:#d95926; --amb:#199e70; --mix:#6F7B86; --meta:#E7ECEF; --warn:#F97066;
  --sel:#c98500; --street:#26323C; --street2:#34434F; --lane:#4E6A60; --mapbg:#121A21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#17212A; --line:#2A3641; --ink:#E7ECEF; --ink2:#9AA7B2;
  --bici:#3987e5; --pat:#d95926; --amb:#199e70; --mix:#6F7B86; --meta:#E7ECEF; --warn:#F97066;
  --sel:#c98500; --street:#26323C; --street2:#34434F; --lane:#4E6A60; --mapbg:#121A21; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--ink)}   /* sin esto, el azul por defecto del navegador, que en oscuro no se lee bien */
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.01em;text-transform:uppercase}
.senal{width:28px;height:28px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
.senal svg{width:18px;height:18px}
.top nav{margin-left:auto;display:flex;gap:4px}
.top nav button,.seg button{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 10px;cursor:pointer;border-radius:3px}
.top nav button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.proto{font-size:13px;color:var(--ink2);padding-block:8px;border-bottom:1px dashed var(--line)}
/* entradilla de la portada: de qué va y tres accesos con su respuesta (dónde ocurren · qué se hace, en pla.html · ¿funciona?) */
.entrada{padding-block:28px 4px}
.entrada h1{font-size:clamp(22px,2.7vw,31px);font-weight:600;line-height:1.2;max-width:46ch;margin:0 0 18px}
.accesos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:980px){.accesos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.accesos a{display:block;box-sizing:border-box;height:100%;min-height:44px;border-top:4px solid var(--ink);background:var(--surface);padding:10px 14px 12px;color:var(--ink);text-decoration:none}
.accesos .acc-t{display:block;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.15;text-transform:uppercase;letter-spacing:.02em}
.accesos .acc-s{display:block;font-size:15px;line-height:1.4;color:var(--ink2);margin-top:5px}
.accesos .acc-s b{color:var(--ink);font-weight:700}
.accesos .acc-m{display:block;font-size:14px;font-weight:600;margin-top:6px;text-decoration:underline;text-underline-offset:3px}
.accesos a:hover{background:var(--ink);color:var(--bg)}
.accesos a:hover .acc-s,.accesos a:hover .acc-s b{color:var(--bg)}
.accesos a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#donde,#funciona{scroll-margin-top:70px}
/* compartir la ficha */
.compartir{margin:10px 0 0;display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px}
.b-comp{display:inline-flex;align-items:center;gap:6px;min-height:32px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 10px;border-radius:3px;cursor:pointer}
.b-comp:hover{border-color:var(--ink)}
.comp-ok{font-size:13px;color:var(--ink2)}
@media (max-width:640px){.accesos{grid-template-columns:1fr}}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.eyebrow{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
section{padding-block:28px}
.meta{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:center}
.meta h2{font-size:clamp(26px,3.6vw,42px);font-weight:700;line-height:1.08;margin-block:6px 12px;overflow-wrap:break-word}
.meta h2 em{display:block;font-style:normal;font-weight:600;font-size:.56em;line-height:1.2;margin-top:.55em;padding-left:12px;border-left:4px solid var(--ink);color:var(--ink)}
.meta h2 em.alerta{border-left-color:var(--warn)}
.meta h2 em.alerta{color:var(--warn)}
.estado{font-size:17px;max-width:46ch}
.estado b{font-variant-numeric:tabular-nums}
.leyenda{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink2);margin-top:12px}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.nota{font-size:12.5px;color:var(--ink2);max-width:60ch;margin-top:10px}
.control summary{cursor:pointer;font-weight:600;color:var(--ink)}
.control table{border-collapse:collapse;margin-block:6px;font-variant-numeric:tabular-nums}
.control th,.control td{padding:2px 8px 2px 0;text-align:right;border-bottom:1px solid var(--line);vertical-align:bottom}
.control th:first-child,.control td:first-child{text-align:left}
#graf{width:100%;height:auto;display:block}
#graf text{fill:var(--ink2);font-family:var(--display);font-size:13px}
.mapa-sec h2{font-size:28px;font-weight:800;text-transform:uppercase}
.controles{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-block:12px}
.seg{display:flex;gap:0}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg button:last-child{border-radius:0 3px 3px 0}
select,input[type=search]{font:inherit;font-size:14px;border:1.5px solid var(--ink2);background:var(--surface);color:var(--ink);padding:5px 8px;border-radius:3px}
#filtros{display:inline-flex;gap:12px;flex-wrap:wrap;align-items:center}
#filtros[hidden]{display:none!important}
.buscar{position:relative;flex:1 1 220px;max-width:340px}
.buscar input{width:100%;box-sizing:border-box}
#res{position:absolute;top:100%;left:0;right:0;z-index:5;background:var(--surface);border:1px solid var(--line);margin:2px 0 0;padding:0;list-style:none;max-height:260px;overflow:auto}
#res li button{all:unset;display:block;width:100%;box-sizing:border-box;padding:6px 10px;cursor:pointer;font-size:13.5px}
#res li button:hover,#res li button:focus-visible{background:var(--bg)}
#res li a{display:block;padding:6px 10px;font-size:13.5px;color:var(--ink);text-decoration:none}
#res li a:hover,#res li a:focus-visible{background:var(--bg)}
#res li a .ref{color:var(--ink2);font-weight:400}
.mapa-wrap{border:1px solid var(--line);background:var(--surface)}
.expl{font-size:14.5px;color:var(--ink2);max-width:80ch;margin:0 0 10px}
.ques{pointer-events:none}
.selbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);background:var(--bg);font-size:14px}
.selbar .et{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.selbar b{font-family:var(--display);font-size:16px}
.selbar button{background:none;border:0;border-radius:0;padding:0;cursor:pointer;margin-left:auto;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--ink)}
.navlink{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-right:8px}
#mapa{height:540px;background:var(--mapbg);position:relative}
.zoom{position:absolute;right:10px;top:10px;z-index:3;display:flex;flex-direction:column;gap:4px}
.zoom button{width:32px;height:32px;font-size:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;cursor:pointer}
.ficha-wrap{border:1px solid var(--line);border-top:0;background:var(--surface);scroll-margin-top:70px}
.ficha-cab{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:18px 20px 0}
.ficha-wrap.sin .ficha-cab{grid-template-columns:1fr}
#minimapa{height:220px;border:1px solid var(--line);border-radius:4px;background:var(--mapbg);overflow:hidden}
.mm-caja p{margin:4px 0 0}
.ficha{padding:6px 20px 18px;min-width:0}
.plan h5{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 4px}
.ficha .cab{max-width:80ch}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px 28px}
.secs .mini-svg{max-width:320px}
.lista{width:100%;border-collapse:collapse;font-size:13.5px}
.lista td,.lista th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.lista th{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.lista-wrap{overflow-x:auto}
.hb-ley{margin:0 0 6px}
.cab .lugar h4{margin-top:12px}
.resum{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2;margin:2px 0 6px;max-width:40ch}
.br-m{display:inline-block;width:18px;height:8px;background:var(--ink2);border-radius:2px;vertical-align:0}
.ct-m{display:inline-block;width:3px;height:14px;background:var(--ink);border-radius:1px;vertical-align:-3px;margin-left:4px}
details.com{margin-top:14px;border-top:1px solid var(--line);padding-top:8px;font-size:13.5px;color:var(--ink2)}
details.com summary{cursor:pointer;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--ink)}
details.com p{max-width:80ch}
.secs .ancho{grid-column:1/-1}
.plan-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 28px}
.plan{margin:0;padding-left:18px;font-size:14px}.plan li{margin-bottom:8px}
.verd{display:inline-block;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1.5px solid transparent}
.verd.n2{background:var(--ink);color:var(--surface)}.verd.n1{background:var(--ink2);color:var(--surface)}.verd.n0{background:none;color:var(--ink);border-color:var(--line)}
.ficha h3{font-size:22px;font-weight:700;line-height:1.15;margin-block:4px 10px}
.ficha .vac{color:var(--ink2);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-block:10px}
.kv dt{color:var(--ink2)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1.5px solid currentColor}
.mini{width:100%;height:auto;display:block;margin-block:6px}
.mini text{fill:var(--ink2);font-family:var(--display);font-size:12px}
.ficha h4{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:16px 0 6px;border-top:1px solid var(--line);padding-top:10px}
.lead{font-size:15px;margin:6px 0 0}
/* etiqueta y cifra en una línea y la barra debajo, a todo el ancho: en columnas estrechas (la ficha tiene cuatro) la barra
   en medio se quedaba en pocos píxeles. grid-auto-flow:dense sube la cifra al hueco que deja la barra de ancho completo. */
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-auto-flow:dense;gap:2px 10px;align-items:end;font-size:16px}
.hb .tr{grid-column:1 / -1;position:relative;height:12px;background:var(--bg);border-radius:2px;margin:2px 0 12px}
.hb .br{position:absolute;left:0;top:0;bottom:0;background:var(--ink2);border-radius:2px}
.hb .ct{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:1px;box-shadow:0 0 0 2px var(--surface)}
.hb .nv{text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
.hb .nv b{display:block}
.hb .nv small{display:block;font-size:15px;color:var(--ink2);white-space:nowrap}
.ref{font-size:12px;color:var(--ink2);margin-top:4px}
.ley-ap{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin:2px 0 0}
.ley-ap i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.ico{display:inline-block;vertical-align:middle;flex:none}
.pista{background:var(--bg);border-left:3px solid var(--ink);padding:8px 10px;font-size:14px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.mapley{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);padding:8px 12px;border-top:1px solid var(--line)}
.leer-mapa{margin:0;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.leer-mapa summary{cursor:pointer;font-weight:600}
.leer-mapa ul{margin:8px 0 0;padding-left:20px}.leer-mapa li{margin:0 0 6px}.leer-mapa li .ico,.leer-mapa li .dot{margin-right:6px;vertical-align:-2px}
.mapley span{display:inline-flex;align-items:center;gap:6px}
/* actuaciones del Plan («El Pla, al dia»): rombo con el color de su estado; el botón (24 px) es el área de toque */
.c-pla{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.c-pla input{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.pla-m{width:24px;height:24px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.rombo{margin:0 6px 0 3px;flex:none}
.pla-m i,.rombo{display:inline-block;width:11px;height:11px;transform:rotate(45deg);background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--ink)}
.pla-m:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.pla-m[aria-pressed="true"] i{box-shadow:0 0 0 2.5px var(--sel)}
.pla-info{font-size:14px;margin:0;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface)}
.pla-info[hidden]{display:none}
ul.pla-aqui{list-style:none;padding:0;margin:0 0 8px}
ul.pla-aqui li{margin:0 0 6px;font-size:14.5px}
ul.pla-aqui .rombo{width:9px;height:9px;margin:0 8px 0 2px;vertical-align:0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.hall{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.hall article{border-top:4px solid var(--ink);padding-top:12px;min-width:0}
.hall .cifra{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.hall h3{font-size:18px;font-weight:700;margin-block:6px}
.hall p{font-size:14px;color:var(--ink2);margin:0}
.datos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;border-top:1px solid var(--line);padding-top:24px}
.datos h3{font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.datos p,.datos li{font-size:14px;color:var(--ink2)}
.datos ul{padding-left:18px;margin:0}
.etq-prox{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;border:1px dashed var(--ink2);color:var(--ink2);padding:2px 9px;border-radius:999px;margin-top:4px}
.datos a{color:var(--ink);font-weight:600}
.maplibregl-map{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-canvas-container.maplibregl-interactive{cursor:grab}
.maplibregl-canvas-container.maplibregl-interactive:active{cursor:grabbing}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none}
.maplibregl-marker{position:absolute;top:0;left:0;will-change:transform}
@media (max-width:860px){
  .meta{grid-template-columns:1fr;gap:16px}
  #mapa{height:440px}
  .ficha-cab{grid-template-columns:1fr}
  #minimapa{height:200px}
  .hall{grid-template-columns:repeat(2,minmax(0,1fr))}

uso_com:"Comparamos los siniestros con la media de los puntos con un tráfico parecido, con un modelo estadístico (binomial negativa y Bayes empírico) que tiene en cuenta las bicis y los coches que pasan y cuántos cruces de calles hay a 100 m del contador. Claramente por encima de la media de los puntos con un tráfico parecido: probabilidad de más del 95 % contando los siniestros a 75, a 100 y a 150 m (si solo pasa con una distancia, se queda en quizá); quizá: más del 80 % con 100 m; el resto, como la media. Estar por encima de la media no quiere decir ser una anomalía: es de esperar que muchos puntos lo estén. Los puntos de conteo cuentan bicis y, probablemente, también patinetes, sin separarlos. Solo se cuentan los años con datos de todos los contadores del punto.",

hall:[["{var0}","Suben como en toda la ciudad","Entre {a0} y {a1} los siniestros con bici o patinete han pasado de {t0} a {t1}, y todos los de la ciudad, de {c0} a {c1} ({varc}): su parte se queda en el {cuota1}. Una parte de la subida puede venir de cómo se registran, porque lo que más crece en toda la ciudad son los siniestros sin heridos ({varsin}). Con heridos, los siniestros con bici o patinete suben más que el resto: {varbvh} frente a {varresh}. {hvb}"],
["{pat1d} de 10","Cada vez más patinete","En {a1}, {pat1w} de cada diez siniestros con bici o patinete tienen un patinete implicado. En {a0} ya eran {pat0w} de cada diez."],
["{persB}","Los lugares con más siniestros se repiten","Elegimos los {neg} lugares con más siniestros con los datos de {pA} y miramos qué pasa después, en {pB}: suman {persB} siniestros. Es lo que se espera si cada lugar mantuviera su ritmo (entre {persLo} y {persHi}, por azar). Si fueran lugares cualesquiera del mismo barrio, sumarían unos {persLoc}. Que bajen desde {persA} es, sobre todo, porque los elegimos en su peor momento."],

lim:["Los heridos graves solo se pueden comparar desde 2024: el cambio de criterio de la policía empieza en 2023 y no se aplica del todo hasta 2024. Lo explica el propio Plan Director. La categoría «baja gravedad» aún crece mucho en 2025, posiblemente por cambios de clasificación.","El tipo de siniestro solo es fiable desde 2025: se muestra el de {tany}.","{p1txt} el portal anotaba peor dónde ocurría cada siniestro: en {a0} se sitúa en el mapa el {cob0}, y en {a1}, el {cob1}. Las cifras por año se calculan con todos los siniestros, también los que no están en el mapa.","Los puntos de conteo cuentan bicis y, probablemente, también patinetes, sin separarlos (pendiente de confirmar con Movilidad)."],
d3_p:"Cada lugar es un cruce o un tramo de calle de hasta 150 m, y se ordenan por los siniestros de {rang}. En los {uso} puntos de conteo del carril bici, «claramente por encima de la media de los puntos con un tráfico parecido» quiere decir una probabilidad de más del 95 % contando los siniestros a 75, 100 y 150 m. <a href=\"metode.html\">Todo el método →</a>",

pla_diag:(g)=>{ const t=T.es, x=g[0], rk=g.filter(y=>y.rank), nr=g.filter(y=>!y.rank&&y.cifra);
  const parts=rk.map(y=>`el número ${y.rank} ${t.pla_col[y.col]||""} (${t.pla_sin(y.cifra)})`).join(" y ");

<script>
const D = window.OBS;
// un solo formato: miles con punto siempre (1.659), decimales con coma
const fmt = n => Number.isInteger(n) ? (n<0?"−":"")+String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,".") : n.toLocaleString(L==="va"?"ca-ES":"es-ES",{maximumFractionDigits:1});

function el(tag, a, txt){ const e = document.createElementNS(ns, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt!=null) e.textContent = txt; return e; }

// ---------- serie y meta ----------
const S = D.serie.map(r => ({a:r["año"], b:r.b, p:r.p, m:r.a, t:r.b+r.p+r.a}));
// meta del Plan (acción 3.2.2): −50 % en 2030. Año base, alternativa y conclusión: de exportar_web.py (META)
const MT = D.kpi.meta, E0 = MT.esc[0], EALT = MT.esc[1];
const AÑO_BASE = MT["año_base"], AÑO_META = MT["año_meta"];
// periodos de la persistencia (lugares_nudos.py → exportar_web.py): A ordena, B mide
const PER_A = D.kpi.pers.per.A, PER_B = D.kpi.pers.per.B;
const etqPer = (xs, corto) => xs.length === 1 ? String(xs[0]) : `${xs[0]}-${corto ? String(xs[xs.length-1]).slice(2) : xs[xs.length-1]}`;
const Sa = a => S.find(r => r.a === a), ult = S[S.length-1];
const base = E0.base, metaV = E0.meta;
const senda = a => base*Math.pow(.5,(a-AÑO_BASE)/(AÑO_META-AÑO_BASE));   // senda propuesta: misma proporción cada año
const faltaAnual = () => Math.round(100*E0.necesaria);   // bajada anual necesaria desde el año siguiente al último con datos
// ---------- cifras de los textos: {clave} en T se rellena con V (se recalcula al cambiar de idioma) ----------
const NUM = {va:["zero","un","dos","tres","quatre","cinc","sis","set","huit","nou","deu"],es:["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez"]};
let V = {};
function valores(){
  const yr = D.kpi.anys, a0 = yr[0], a1 = yr[yr.length-1], prim = Sa(a0), loc = L==="va"?"ca-ES":"es-ES";
  const mil = fmt;
  const nfDec = new Intl.NumberFormat(loc,{minimumFractionDigits:1,maximumFractionDigits:1});   // uno solo: toLocaleString crea uno en cada llamada
  const pc = x => Math.round(100*x)+" %", dec = x => nfDec.format(x)+" %";
  const llista = xs => xs.length<2 ? xs.join("") : xs.slice(0,-1).join(", ")+(L==="va"?" i ":" y ")+xs[xs.length-1];
  const per = Object.values(D.kpi.per).map(([i,f]) => i===f ? String(i) : `${i}-${String(f).slice(2)}`);
  const pat = r => (r.p+r.m)/r.t, nw = n => NUM[L][n] ?? String(n), v0 = Math.round(100*(ult.t/prim.t-1));
  V = {a0, a1, rang:`${a0}-${a1}`, ab:AÑO_BASE, ameta:AÑO_META, apend:a1+1, aplan:MT["año_plan"], adesde:MT.desde,
       aalt:EALT["año"], metaalt:mil(EALT.meta), nb:mil(base),
       pprev:"un "+pc(Math.abs(MT.previa))+(MT.previa>=0?(L==="va"?" més":" más"):(L==="va"?" menys":" menos")), nany:nw(yr.length), p1:per[0], per:llista(per),
       nA:etqPer(PER_A), nB:etqPer(PER_B), pA:etqPer(PER_A, true), pB:etqPer(PER_B, true), tany:D.kpi.tipo_any,
       t0:mil(prim.t), t1:mil(ult.t), var0:(v0<0?"−":"+")+Math.abs(v0)+" %", varb:"un "+dec(Math.abs(100*(ult.t/base-1)))+(ult.t>=base?(L==="va"?" més":" más"):(L==="va"?" menys":" menos")),
       pat1:pc(pat(ult)), pat1d:Math.round(10*pat(ult)), pat1w:nw(Math.round(10*pat(ult))), pat0w:nw(Math.round(10*pat(prim))),
       falta:faltaAnual()+" %", meta:mil(metaV), neg:D.kpi.n_neg, uso:D.uso.length, pmin:D.kpi.pista.min,
       // persistencia fuera de muestra (lugares_nudos.py): ordenar con {pA}, medir en {pB}; perf = si cada lugar mantuviera su ritmo
       persA:mil(Math.round(D.kpi.pers.ab.A)), persB:mil(Math.round(D.kpi.pers.ab.obs)), persLo:mil(Math.round(D.kpi.pers.ab.perf_lo)),
       persHi:mil(Math.round(D.kpi.pers.ab.perf_hi)), persLoc:mil(Math.round(D.kpi.pers.ab.loc)),
       nop:D.kpi.pl3.no, npl:D.kpi.pl3.lugar, npc:D.kpi.pl3.calle, ptop:D.kpi.pl3.top,   // recuentos del anillo y puestos que publica el Plan, de exportar_web.py (PL3)
       cobp:(()=>{ const v=Object.values(D.kpi.cobd).flatMap(Object.values); return "del "+pc(Math.min(...v))+" al "+pc(Math.max(...v)); })(),   // cobertura por año × tipo de dirección
       cob0:pc(D.kpi.cob_any[a0]), cob1:pc(D.kpi.cob_any[a1]),   // siniestros situados en el mapa, primer y último año (Limitacions)
       ncont:D.kpi.n_contadores, ambsolo:pc(D.kpi.amb_solo), cobt:pc(D.cob.geo/D.cob.total)};
  // meta: comprobación con la media de los años antes del Plan y recuento por vehículo (META de exportar_web.py)
  Object.assign(V, {etqmed:MT.media.etq, nbmed:mil(MT.media.base), metamed:mil(MT.media.meta), nveh:mil(MT.vehiculo.base), metaveh:mil(MT.vehiculo.meta)});
  // series de control: todos los siniestros de la ciudad, con y sin heridos (variación del primer al último año)
  const C = MT.control, n = C.ciudad.length-1, vx = x => { const v = Math.round(100*(x[n]/x[0]-1)); return (v<0?"−":"+")+Math.abs(v)+" %"; };
  const sinH = C.bv_sin.map((v, i) => v + C.resto_sin[i]);   // sin heridos, toda la ciudad
  Object.assign(V, {c0:mil(C.ciudad[0]), c1:mil(C.ciudad[n]), varc:vx(C.ciudad), cuota1:dec(100*C.cuota[n]),
       varsin:vx(sinH), varbvh:vx(C.bv_her), varresh:vx(C.resto_her)});
  // conclusión del titular, calculada en meta.py: pendiente · debajo · compatible · encima (alerta solo si está por encima)
  V.concl = O(T[L].concl[E0.concl]); V.alerta = E0.concl==="encima" ? "alerta" : "";
  V.avismax = MT.max ? O(T[L].avis_max) : "";
  V.partida = O(T[L][MT.max ? "partida_max" : "partida"]);
  V.hvb = ult.a>AÑO_BASE ? O(T[L].hall_vb) : "";
  // accesos de la entradilla: siniestros de los lugares con más siniestros ({a0}-{a1}), tipos que hay entre ellos y el primero
  // con su nombre publicado (como en la ficha); y estado del indicador (sin años después de la base, la base, la meta y el
  // año pendiente; con años, el juicio en tres estados de meta.py)
  const n30 = D.negros.filter(n=>!n.zona), tps = new Set(n30.map(n=>n.tipo)), c1 = n30[0];
  V.cn = mil(D.kpi.conc.n); V.ctip = T[L].ctip[tps.size>1 ? "ambos" : [...tps][0]];
  // en la frase, el nombre como en el informe (nomLugar: «Pg. Alameda × Pl. Zaragoza») y sin la letra de lado del nudo
  // («(S)»: sur, frente al nudo «(N)» del mismo cruce), que solo distingue nudos vecinos; la ficha conserva el nombre congelado
  const nomFrase = u => u.replace(/ \([NSEO]\)$/,"").toLowerCase().replace(/\b(pg|av|c\/|pl|gv)\b\.?\s*/g, m => ({pg:"Pg. ",av:"Av. ","c/":"C/ ",pl:"Pl. ",gv:"Gran Via "}[m.trim().replace(".","")] || m))
    .replace(/ cruce /g, " × ").replace(/(^|[\s×\/-])([a-zà-ú])/g, (m,a,b) => a + b.toUpperCase());
  V.c1nom = nomFrase(L==="es"&&c1.nom_es||c1.nom); V.c1n = mil(c1.n);
  V.jult = ult.a>AÑO_BASE ? T[L].juicio[E0.juicio[ult.a].estado] : "";
  V.fun = O(T[L][ult.a>AÑO_BASE ? "fun_ev" : "fun0"]);
  // «Què s'hi fa?»: recuentos de «El Pla, al dia» (pla.html), de plan_seguimiento.csv vía exportar_web.py (D.pla)
  const PE = D.pla.por_estado;
  V.pn = mil(D.pla.n); V.ph = PE.hecha; V.pm = PE.en_marcha; V.pa = PE.anunciada; V.ps = PE.sin_info;
  // periodos de formato del portal: P1 hasta el mes anterior al primer corte, P2 hasta el anterior al segundo
  const MES = {va:["gener","febrer","març","abril","maig","juny","juliol","agost","setembre","octubre","novembre","desembre"],
               es:["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"]};
  const fin = c => { const [y,m] = c.split("-").map(Number); return m===1 ? [y-1,11] : [y,m-2]; };
  const [y1,m1] = fin(D.kpi.cortes[0]), [y2,m2] = fin(D.kpi.cortes[1]);
  V.p1txt = L==="va" ? `Fins a ${MES.va[m1]} de ${y1}, i en menor mesura fins a ${MES.va[m2]} de ${y2},` : `Hasta ${MES.es[m1]} de ${y1}, y en menor medida hasta ${MES.es[m2]} de ${y2},`;
}
const O = x => typeof x==="string" ? x.replace(/\{(\w+)\}/g, (m,k) => k in V ? V[k] : m) : x;
function grafico(){
  const g = document.getElementById("graf"); [...g.querySelectorAll(":scope > :not(title)")].forEach(n=>n.remove());
  const W=640,H=330,ml=44,mr=12,mt=16,mb=34, años=[];
  for (let a=S[0].a; a<=Math.max(AÑO_META,ult.a); a++) años.push(a);
  const ymax=Math.ceil(Math.max(...S.map(r=>r.t))*1.05/600)*600, x=i=>ml+i*(W-ml-mr)/años.length, bw=(W-ml-mr)/años.length*.62, y=v=>mt+(H-mt-mb)*(1-v/ymax);
  for (let v=0; v<=ymax; v+=600){ g.append(el("line",{x1:ml,x2:W-mr,y1:y(v),y2:y(v),stroke:css("--line"),"stroke-width":1})); g.append(el("text",{x:ml-6,y:y(v)+4,"text-anchor":"end"},fmt(v))); }
  años.forEach((a,i)=>{ g.append(el("text",{x:x(i)+bw/2+ (W-ml-mr)/años.length*.19,y:H-12,"text-anchor":"middle"},a)); });
  const off=(W-ml-mr)/años.length*.19;
  const iA=a=>años.indexOf(a);
  S.forEach(r=>{ const i=iA(r.a); let acc=0; [["b","--bici"],["p","--pat"],["m","--amb"]].forEach(([k,c])=>{ g.append(el("rect",{x:x(i)+off,y:y(acc+r[k]),width:bw,height:y(acc)-y(acc+r[k]),fill:css(c)})); acc+=r[k]; });
    g.append(el("text",{x:x(i)+off+bw/2,y:y(r.t)-6,"text-anchor":"middle","font-weight":"700",style:"fill:var(--ink)"},fmt(r.t))); });
  // senda propuesta (desde el año base, −50 % en 2030): círculos huecos y línea punteada, como en el informe
  const cx=i=>x(i)+off+bw/2, iS=[]; for (let i=iA(AÑO_BASE);i<años.length;i++) iS.push(i);
  // margen del azar (Poisson al 95 %, meta.py) alrededor de la senda de cada año posterior a la base
  iS.slice(1).forEach(i=>{ const [lo,hi]=E0.banda[años[i]];
    g.append(el("rect",{x:cx(i)-bw*.32,width:bw*.64,y:y(hi),height:y(lo)-y(hi),fill:css("--meta"),"fill-opacity":.18})); });
  g.append(el("polyline",{points:iS.map(i=>`${cx(i)},${y(senda(años[i]))}`).join(" "),fill:"none",stroke:css("--meta"),"stroke-width":1.5,"stroke-dasharray":"2 3"}));
  iS.slice(1).forEach(i=>{ const v=senda(años[i]);
    g.append(el("circle",{cx:cx(i),cy:y(v),r:4.5,fill:css("--bg"),stroke:css("--meta"),"stroke-width":1.5}));
    if (años[i]>ult.a && años[i]<AÑO_META) g.append(el("text",{x:cx(i),y:y(E0.banda[años[i]][1])-5,"text-anchor":"middle"},fmt(Math.round(v)))); });
  // último año con datos, si es posterior a la base: la barra real frente a su hueco de la senda (hoy no hay ninguno);
  // en rojo solo si está por encima del margen (juicio de meta.py)
  if (ult.a>AÑO_BASE){ const iu=iA(ult.a), su=Math.round(senda(ult.a)), du=ult.t-su, cj=E0.juicio[ult.a].estado==="encima"?"--warn":"--ink";
    g.append(el("line",{x1:x(iu)+off+bw+3,x2:x(iu)+off+bw+3,y1:y(su),y2:y(ult.t),stroke:css(cj),"stroke-width":2}));
    g.append(el("text",{x:x(iu)+off+bw+7,y:y((su+ult.t)/2)+4,"font-weight":"700",style:`fill:var(${cj})`},(du<0?"−":"+")+fmt(Math.abs(du)))); }
  // año siguiente: pendiente de publicar
  if (ult.a<AÑO_META){ const ip=iA(ult.a+1), [p0,p1]=O(T[L].p26).split(": ");
    g.append(el("text",{x:x(ip)+off+bw/2,y:y(senda(ult.a+1)/2),"text-anchor":"middle"},p0));
    g.append(el("text",{x:x(ip)+off+bw/2,y:y(senda(ult.a+1)/2)+15,"text-anchor":"middle"},p1)); }
  const im=iA(AÑO_META);
  g.append(el("text",{x:x(im)+off+bw/2,y:y(metaV)-25,"text-anchor":"middle","font-weight":"700",style:"fill:var(--ink)"},"Meta"));
  g.append(el("text",{x:x(im)+off+bw/2,y:y(metaV)-9,"text-anchor":"middle","font-weight":"700",style:"fill:var(--ink)"},fmt(metaV)));
}
// textos estado/estado0 (T): J = juicio del último año con datos (meta.py): b observados, d respecto a la base, s senda,
// lo-hi margen, est estado, med comprobación con la media. concl: pendiente · debajo · compatible (dentro del margen del azar) · encima
function estado(){
  // juicio del último año con datos (meta.py); sin años después de la base, la senda y el margen del año siguiente
  const ev = ult.a>AÑO_BASE, a = ev ? ult.a : MT.desde, j = E0.juicio[a], [lo,hi] = E0.banda[a];
  const dv = (ult.t/base-1)*100, d = Math.abs(dv).toFixed(1).replace(".",",")+" %";
  const jm = ev ? MT.media.juicio[a] : null, tj = T[L].juicio;
  const J = {b:fmt(ult.t), d:(dv<0?"−":"+")+d, s:fmt(E0.senda[a]), lo:fmt(lo), hi:fmt(hi), est:ev ? tj[j.estado] : "",
             med:!ev ? "" : jm.estado===j.estado ? O(T[L].med_igual) : T[L].med_dif(tj[jm.estado])};
  document.getElementById("estado").innerHTML = T[L][ev ? "estado" : "estado0"](J);
  // series de control (META.control): siniestros con bici o patinete, con heridos y su parte del total de la ciudad
  const C = MT.control, h = T[L].ctrl_h, dec = x => x.toLocaleString(L==="va"?"ca-ES":"es-ES",{minimumFractionDigits:1,maximumFractionDigits:1})+" %";
  document.getElementById("control").innerHTML = `<tr>${h.map(x=>`<th scope="col">${x}</th>`).join("")}</tr>` +
    C.años.map((y,i)=>`<tr><td>${y}</td><td>${fmt(C.bv[i])}</td><td>${fmt(C.bv_her[i])}</td><td>${dec(100*C.cuota[i])}</td></tr>`).join("");
}

// ---------- filtros: años (de / a), vehículo y gravedad (06/11) ----------
// Todo en el navegador, sobre D.pts (siniestros situados: [11] lugar, [12] Turia) y D.sp (sin punto, solo lo que pide el
// perfil): mapa, leyenda, fichas, minimapa y descarga. Los lugares no cambian (se eligen con todos los siniestros); con un
// filtro, su recuento y su perfil se rehacen con los siniestros que pasan, igual que perfil() de exportar_web.py.
const ANYS = D.kpi.anys, F = {a0:ANYS[0], a1:ANYS[ANYS.length-1], v:"t", g:"t"};
const fAct = ()=>F.a0!==ANYS[0] || F.a1!==ANYS[ANYS.length-1] || F.v!=="t" || F.g!=="t";
const rangF = ()=>F.a0===F.a1 ? String(F.a0) : `${F.a0}-${F.a1}`;
const pasaG = g=>F.g==="t" || (F.g==="0" ? g===0 : F.g==="h" ? g>=1 : g>=3);   // -1 (otra) solo pasa sin filtro de gravedad
const pasa = r=>r.a>=F.a0 && r.a<=F.a1 && (F.v==="t" || r.v===F.v) && pasaG(r.g);
const pasaP = p=>pasa({a:p[2],v:p[3],g:p[4]});
// con quién (contrario() de scripts/lugares.py), franja horaria (FR de exportar_web.py) y factores (bits)
const contrario = u=>{ const us=String(u).split(",").map(x=>x.trim()).filter(Boolean);
  if (us.some(x=>!["BICICLETA","VMP","PEATÓN"].includes(x))) return "m"; if (us.includes("PEATÓN")) return "w"; return us.length>=2 ? "d" : "s"; };
const FRB = [0,7,10,14,17,21,24], FB = [["prio",1,"PRIORIDAD"],["dist",2,"DISTRA"],["via",4,"ESTADO O CONDICI"],["vel",8,"VELOCIDAD"]];
// filas para los filtros: se preparan la primera vez que hacen falta (con un filtro activo); sin filtro, lo exportado tal cual
let FILAS_ = null;
const filasF = ()=>FILAS_ || (FILAS_ = D.pts.map(p=>{ const h=+p[8].slice(11,13), dia=new Date(+p[8].slice(6,10),+p[8].slice(3,5)-1,+p[8].slice(0,2)).getDay();
    return {a:p[2], v:p[3], g:p[4], k:contrario(p[9]), fr:FRB.findIndex((x,i)=>h>=x && h<FRB[i+1]), lab:dia>=1 && dia<=5 ? 1 : 0,
      b:FB.reduce((s,[,bit,txt])=>s+(p[10].includes(txt) ? bit : 0),0), tipo:p[5], cr:p[7]==="c", l:p[11], t:p[12]}; })
  .concat((D.sp||[]).map(r=>({a:r[0], v:r[1], g:r[2], k:r[3], fr:r[4], lab:r[5], b:r[6], tipo:r[7], cr:null, l:-1, t:r[8]}))));
function perfilF(rs){
  const o={n:rs.length, k:{m:0,w:0,d:0,s:0}, f:{prio:0,dist:0,via:0,vel:0}, nf:0, fr:[0,0,0,0,0,0], lab:0, gr:0, fa:0, pm:0, mix:[0,0,0], nu:0};
  const vy3=ANYS.map(()=>[0,0,0]), vy3w=ANYS.map(()=>[0,0,0]), tu={};
  // factores: solo el último año (como el tipo; 07/11/2026): antes de él faltan en uno de cada tres partes
  rs.forEach(r=>{ o.k[r.k]++; if (r.a===D.kpi.tipo_any){ o.nf++; FB.forEach(([c,bit])=>{ if (r.b&bit) o.f[c]++; }); } o.fr[r.fr]++; o.lab+=r.lab;
    if (r.g===3) o.gr++; if (r.g===4) o.fa++; if ((r.b&1) && r.k==="m") o.pm++;
    const j="bpa".indexOf(r.v), ia=ANYS.indexOf(r.a); o.mix[j]++; vy3[ia][j]++;
    // barras corregidas por la cobertura de su año y tipo de dirección (como vy3w); los sin punto no cuentan
    if (r.cr!==null) vy3w[ia][j]+=1/D.kpi.cobd[r.a][r.cr ? "cruce" : "portal"];
    if (r.a===D.kpi.tipo_any && r.tipo){ o.nu++; tu[r.tipo]=(tu[r.tipo]||0)+1; } });
  o.lab = o.n ? Math.round(100*o.lab/o.n)/100 : 0; o.tu = Object.entries(tu).sort((a,b)=>b[1]-a[1]).slice(0,3);
  o.vy3 = vy3; o.vy3w = vy3w.map(v=>v.map(x=>Math.round(10*x)/10)); return o;
}
// un lugar con el filtro (sin filtro, lo exportado tal cual); ntot: todos sus siniestros
function lugF(i){ const n=D.negros[i]; if (!fAct()) return n;
  const rs=filasF().filter(r=>(n.zona ? r.t>0 : r.l===i) && pasa(r)), p=perfilF(rs);
  return Object.assign({}, n, p, {vy3w:n.zona ? undefined : p.vy3w, ntot:n.n, dentro:n.zona ? rs.filter(r=>r.t===2).length : n.dentro}); }
let CIU_F = null;
const ciudadF = ()=>fAct() ? (CIU_F || (CIU_F = perfilF(filasF().filter(pasa)))) : Object.assign({n:D.cob.total}, D.ciudad);
let NEGF = D.negros, escalaF = 1;
const NMAX = Math.max(...D.negros.filter(n=>!n.zona).map(n=>n.n));
// años del filtro (índices en ANYS) para las barras de la ficha
const iAnys = ()=>ANYS.map((a,i)=>[a,i]).filter(([a])=>a>=F.a0 && a<=F.a1).map(([,i])=>i);

// ---------- mapa ----------
// «Todos los siniestros» se agrupa por lugar: muchos caen en el mismo punto (centro del cruce o portal)
let grupos=[], ptGrupo=new Int32Array(D.pts.length).fill(-1);
function agrupar(){
  const idx=new Map();

// ---------- descarga en CSV de lo que se ve (solo campos ya públicos en la web) ----------
// Se descarga un ZIP con el CSV y un LLEGIU-ME / LEEME (fuente, licencia CC BY 4.0, aviso de no reidentificar, formato
// y columnas). No es el dataset versionado (pendiente 74).
// nombres de columna FIJOS, iguales en las dos lenguas y sin ñ ni acentos (revisión de datos del 07/11/2026: antes cambiaban
// con el idioma y un script que leyera el CSV fallaba al cambiar de lengua). Los valores sí van en la lengua de la página.
const CSV_COLS={pts:["fecha_hora","anyo","vehiculo","gravedad","tipo_ultimo_anyo","ubicacion","localizacion","vehiculos_implicados","factores","lat","lon"],
  negros:["orden","lugar","tipo","siniestros_filtro","solo_bici","solo_patinete","bici_y_patinete","siniestros_todos","plan_director","lat","lon","ficha"],
  uso:["punto_conteo","siniestros","media_trafico_parecido","resultado","siniestros_bici","siniestros_patinete","bicis_dia_laborable","anyos","contadores","lat","lon","ficha"]};
// ZIP mínimo sin compresión (método «store», PKWARE APPNOTE): cabecera local, directorio central y fin; CRC-32 y nombres en UTF-8.
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
const crc32=b=>{ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_T[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
function zipStore(ficheros){
  const enc=new TextEncoder(), d=new Date(), partes=[], central=[];
  const hora=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), dia=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  let off=0;
  for (const [n,txt] of ficheros){
    const nb=enc.encode(n), db=enc.encode(txt), crc=crc32(db);
    const loc=new DataView(new ArrayBuffer(30));
    [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,hora,2],[12,dia,2],[14,crc,4],[18,db.length,4],[22,db.length,4],[26,nb.length,2],[28,0,2]]
      .forEach(([o,v,s])=>s===4?loc.setUint32(o,v,true):loc.setUint16(o,v,true));
    const cen=new DataView(new ArrayBuffer(46));
    [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,hora,2],[14,dia,2],[16,crc,4],[20,db.length,4],[24,db.length,4],
     [28,nb.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]].forEach(([o,v,s])=>s===4?cen.setUint32(o,v,true):cen.setUint16(o,v,true));
    partes.push(new Uint8Array(loc.buffer),nb,db); central.push(new Uint8Array(cen.buffer),nb);
    off+=30+nb.length+db.length;
  }
  const tam=central.reduce((s,x)=>s+x.length,0), fin=new DataView(new ArrayBuffer(22));
  [[0,0x06054b50,4],[4,0,2],[6,0,2],[8,ficheros.length,2],[10,ficheros.length,2],[12,tam,4],[16,off,4],[20,0,2]]
    .forEach(([o,v,s])=>s===4?fin.setUint32(o,v,true):fin.setUint16(o,v,true));
  return new Blob([...partes,...central,new Uint8Array(fin.buffer)]);
}
const csvCampo = x=>{ const s=String(x??""); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
function descargarCSV(){

      [p[8].slice(6,10)+"-"+p[8].slice(3,5)+"-"+p[8].slice(0,2)+(p[8].length>10?"T"+p[8].slice(11):""),p[2],t.veh_csv[p[3]],
p[4]>=0?t.gravs[p[4]]:"",p[5],p[6],t.geo[p[7]],p[9],p[10],p[1],p[0]]));

  }
  const filtro = vista==="uso" ? t.csv_uso_nota : fAct() ? t.filtre() : t.csv_sense;
  // CSV estándar (RFC 4180): la cabecera de columnas en la primera línea, coma, comillas dobles, CRLF y UTF-8 con BOM (para
  // que Excel lea los acentos). Sin líneas «# …» delante (07/11/2026: las hojas de cálculo adivinaban el espacio como

  const txt = "﻿"+[CSV_COLS[vista],...filas].map(r=>r.map(csvCampo).join(",")).join("\r\n")+"\r\n";

    t.csv_mes+": "+location.origin+"/dades/", ""].join("\r\n");
