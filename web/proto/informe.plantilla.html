<script>
"use strict";
const R = window.REL;
// años: todos salen de los datos (exportar_web.py). AÑOS, los completos; IU, índice del último; RANG, «primero-último»
const AÑOS = R.anys, IU = AÑOS.length - 1, A0 = AÑOS[0], ULT = AÑOS[IU], RANG = `${A0}-${ULT}`;
const etqA = xs => xs.length > 1 ? `${xs[0]}-${xs[xs.length - 1]}` : `${xs[0]}`;   // periodo: «2022-2023» o «2024»
// uso del carril bici: U0 y UU, primer y último año del panel de puntos de conteo; M1, último año de los conteos manuales
const U0 = R.uso_idx.años[0], UU = R.uso_idx.años[R.uso_idx.años.length - 1], M1 = R.uso_manual[R.uso_manual.length - 1].año;
// únicos años fijos (hechos pasados, no cambian con datos nuevos): heridos graves comparables desde 2024 (cambio de criterio
// en 2023, Orden INT/2223/2014); la Alameda se cuenta desde 2023 (en 2022 el portal situaba peor los siniestros)
const GRAV_COMP = 2024, ALA0 = 2023;
let L = "va";
const fmt = (n, d=0) => Number(n).toLocaleString(L==="va"?"ca-ES":"es-ES", {minimumFractionDigits:d, maximumFractionDigits:d, useGrouping:"always"});

// ---------- cifras derivadas (todas salen de R) ----------
const D_ala_prio = () => R.ala.filter(a => a[3]).length;
const MT = R.meta, E0 = MT.esc[0], B = MT["año_base"], P26 = MT.pendiente;
// AM, año de la meta; TODOS, del primer año al de la meta; EV, ya hay años del Plan con datos; JU, juicio del último (meta.py)
const AM = MT["año_meta"], TODOS = d3.range(A0, AM + 1), EV = ULT > B, JU = EV ? E0.juicio[ULT] : null;
const DASH = [null, null, "0.1 3.4"];   // anillo del Plan: 0 no lo menciona (sin anillo, no se dibuja) · 1 cita el lugar (continuo) · 2 solo su calle (puntos)
const D = (() => {
  // año base, meta y senda: de exportar_web.py (META); B = año base, alt = la alternativa
  const base = E0.base, meta = E0.meta;
  const senda = {}; TODOS.forEach(a => { if (a >= B) senda[a] = base * Math.pow(.5, (a-B)/(MT["año_meta"]-B)); });
  const ala = R.ala.map(([lon,lat,k,prio,v,a]) => ({lon,lat,k,prio,v,a}));
  const cnt = k => ala.filter(d => d.k === k).length;
  const m0 = cnt("m"), pm = ala.filter(d => d.k === "m" && d.prio).length;
  // ejemplos del paso trafico3, elegidos por regla en exportar_web.py (R.dest): x el que más siniestros tiene de los que están
  // como la media; t el «claramente» solo de patinete con más siniestros; b el «claramente» no solo de patinete con menos
  const dest = Object.fromEntries(Object.entries(R.dest).map(([c, o]) => [c, {...R.sc[o.i], nom: o.nom, i: o.i}]));
  // margen del azar del primer año sin datos, comprobación con la media y series de control (scripts/meta.py y META)
  const b26 = E0.banda[MT.desde], EM = MT.media, CT = MT.control, n = CT.años.length - 1, vr = x => (x[n]/x[0] - 1)*100;
  const sinH = CT.bv_sin.map((v, i) => v + CT.resto_sin[i]);
  return {base, meta, senda, s26: E0.senda[MT.desde], b26, alt: MT.esc[1], max: MT.max, ctx: MT.ctx2026,
    em: EM, veh: MT.vehiculo, ct: CT, vCiudad: vr(CT.ciudad), vSinH: vr(sinH), vBvH: vr(CT.bv_her), vRestoH: vr(CT.resto_her), cuota1: CT.cuota[n]*100,
    previa: MT.previa*100, previaAnt: MT.previa_ant*100, ritmo: E0.necesaria*100, anual: E0.senda_anual*100,
    dc10: Math.round(R.vmp[IU]/R.tot[IU]*10), cuota: R.vmp[IU]/R.tot[IU]*100,
    ala, m0, s0: cnt("s"), w0: cnt("w"), d0: cnt("d"), n0: ala.length, pm, pm10: Math.round(pm/m0*10),
    ng0: R.negros[0], nn: R.negros.length, // persistencia fuera de muestra (lugares_nudos.py): ordenar con R.per.A, medir en R.per.B; perf = si cada lugar mantuviera su ritmo
    pA: Math.round(R.pers.ab.A), pB: Math.round(R.pers.ab.obs), pLo: Math.round(R.pers.ab.perf_lo), pHi: Math.round(R.pers.ab.perf_hi), pLoc: Math.round(R.pers.ab.loc),
    estMin: d3.min(R.estab.variantes, v => v.ret), estMax: d3.max(R.estab.variantes, v => v.ret), plNo: R.pl3.no, plL: R.pl3.lugar, plC: R.pl3.calle, plTop: R.pl3.top,   // recuentos del anillo (PL3 de exportar_web.py)
    nc: R.sc.length, nalt: R.sc.filter(d => d.lv === 2).length, nq: R.sc.filter(d => d.lv === 1).length, ncont: R.n_contadores, dest,
    nalt_sv: R.sc.filter(d => d.lv === 2 && d.sv).length,
    ay: R.negros[0].vy.map(v => v[0] + v[1]), pt: D_ala_prio(), tPr: R.turia_pr, cob: R.cob*100,
    destIdx: new Set(Object.values(dest).map(d => d.i))};
})();
const nomLugar = s => s.toLowerCase().replace(/\b(pg|av|c\/|pl|gv)\b\.?\s*/g, m => ({pg:"Pg. ",av:"Av. ","c/":"C/ ",pl:"Pl. ",gv:"Gran Via "}[m.trim().replace(".","")] || m))
  .replace(/ cruce /g, " × ").replace(/(^|[\s×\/-])([a-zà-ú])/g, (m,a,b) => a + b.toUpperCase());

pasos:{
  promesa:d=>`<p>En la taula d'indicadors del Pla Director de Seguretat Viària 2026-2030, l'acció 3.2.2 demana *reduir a la meitat* els sinistres amb ciclistes i patinets per a ${AM}.</p><p>Com en la majoria dels indicadors del Pla, la casella de la línia base està buida, i tampoc diu com es compta ni com es jutja cada any. *La meitat de què?*</p>`,
  partida:d=>`<p>Proposem omplir eixa casella amb *${B}: ${fmt(d.base)} sinistres* amb bici o patinet. És l'últim any abans del Pla, que el mateix Pla ja analitza${d.max?", i el pitjor de la sèrie":""}.</p><p>Si cada any baixara en la mateixa proporció (un ${fmt(d.anual,1)} %), la senda passaria per ${fmt(d.s26)} en ${MT.desde} i arribaria a *${fmt(d.meta)}* en ${AM}. Els cercles buits són eixa senda: és una proposta nostra, no del Pla.</p><p>La franja al voltant de cada cercle és el marge de l'atzar: encara que tot anara segons la senda, cada any variaria. Per a ${MT.desde}, qualsevol xifra entre ${fmt(d.b26[0])} i ${fmt(d.b26[1])} seria compatible amb la senda.</p><p class="aviso">${d.max ? `Compte: ${B} és el pitjor any de la sèrie, i després d'un any així el següent sol baixar encara que no canvie res. Per això ho comprovem també amb la mitjana ${d.em.etq} (meta ${fmt(d.em.meta)}). ` : ""}Cada sinistre compta una sola vegada, també els xocs bici–patinet; comptant per vehicle, com les taules del Pla, la meta seria ${fmt(d.veh.meta)}.</p>`,
  y2025:d=>`<p>Abans del Pla, els sinistres amb bici o patinet pugen: de ${fmt(R.tot[0])} en ${AÑOS[0]} a ${fmt(d.base)} en ${B}, *un ${fmt(d.previa,0)} % més*. Només en ${B}, un ${fmt(d.previaAnt,1)} % més que l'any anterior.</p><p>Però *tots els sinistres de la ciutat pugen igual* (un ${fmt(d.vCiudad,0)} %): la part de la bici i el patinet es queda en el ${fmt(d.cuota1,1)} %. El que més creix són els sinistres sense ferits (un ${fmt(d.vSinH,0)} %), i al juliol de 2024 la Policia Local va crear un nou sistema de dades de sinistres (SIASV). Amb ferits, la bici i el patinet sí que pugen més que la resta: un ${fmt(d.vBvH,0)} %, davant d'un ${fmt(d.vRestoH,0)} %.</p><p>Per a arribar a ${fmt(d.meta)} en ${AM}, cal baixar *un ${fmt(d.ritmo,1)} % cada any* des de ${MT.desde}.${EV ? ` En ${ULT} hi ha hagut *${fmt(JU.obs)} sinistres*: *${T.va.r.jz[JU.estado]}* (la senda en preveu ${fmt(JU.senda)}; hi seria compatible qualsevol xifra entre ${fmt(JU.banda[0])} i ${fmt(JU.banda[1])}).` : P26 ? ` Les dades de ${P26}, el primer any del Pla, *encara no estan publicades*: fins aleshores no es pot dir com va el Pla.` : ""}</p>${EV ? "" : `<p class="aviso">Primeres senyals, pendents de confirmar amb les dades obertes: segons la Policia Local (balanç del Pla Vector, ${d.ctx.fecha}), de gener a maig de 2026 hi hagué uns ${d.ctx.vmp_menos} sinistres amb patinet menys que en el mateix període de 2025. <a href="${d.ctx.url}">Font</a>.</p>`}`,
  quien:d=>`<p>Qui hi ha darrere? Partim cada barra en tres: sinistres amb només bici, amb només patinet i xocs bici–patinet.</p>`,
  quien2:d=>`<p>*La bici es manté*: ${fmt(R.bici[0])} sinistres en ${A0} i ${fmt(R.bici[IU])} en ${ULT}.</p><p>*El patinet passa de ${fmt(R.vmp[0])} a ${fmt(R.vmp[IU])}.* En ${ULT}, *${d.dc10} de cada 10* sinistres amb bici o patinet tenen un patinet implicat.</p><p class="aviso">Ara cada línia compta tots els sinistres del seu vehicle: un xoc bici–patinet compta en les dues, com en el Pla. Sense saber quants patinets circulen, no es pot dir si el risc ha pujat o si n'hi ha més.</p>`,
  donde:d=>`<p>On passen? Cada cercle és un dels *${d.nn} llocs amb més sinistres* entre ${A0} i ${ULT}: una cruïlla, amb 30 m al voltant, o un tram de carrer de 150 m com a màxim. Com més gran, més sinistres, i es reparteix entre només bici, només patinet i xocs bici–patinet.</p><p>Es repeteixen. Si triem els ${d.nn} llocs només amb les dades de ${etqA(R.per.A)}, en ${etqA(R.per.B)} sumen *${fmt(d.pB)} sinistres*: el que s'espera si cada lloc mantinguera el seu ritme (entre ${fmt(d.pLo)} i ${fmt(d.pHi)}, per l'atzar). Llocs qualssevol del mateix barri en sumarien uns ${fmt(d.pLoc)}. Baixen des de ${fmt(d.pA)} perquè els triem en el seu pitjor moment.</p><p>L'anell diu què en diu el Pla: continu, cita el lloc (${d.plL} de ${d.nn}); de punts, només cita el seu carrer (${d.plC}); sense anell, no l'esmenta (${d.plNo}). El Pla només publica els ${d.plTop} encreuaments i carrers amb més sinistres de cada col·lectiu: que no esmente un lloc no vol dir que no el tinga en compte. Demanem la llista completa.</p><p class="aviso">Fora queda el Jardí del Túria, el n.º ${d.tPr} amb bici per al Pla: els seus sinistres no porten una adreça que es puga situar. En 2022 el portal donava menys adreces exactes; per això cada sinistre compta segons com de bé es localitzaven els del seu any i tipus d'adreça.</p>`,
  alameda:d=>`<p>El primer és el *passeig de l'Albereda amb la plaça de Saragossa*: *${d.n0} sinistres* amb bici o patinet en ${RANG}. També és el n.º ${d.ng0.pr} de la llista de cruïlles del Pla.</p><p>Cada punt és un d'eixos sinistres, al voltant del lloc on el va anotar la policia. Molts cauen en el mateix punt perquè s'anoten per la cruïlla.</p>`,
  alameda2:d=>`<p>Amb qui xoquen? *${d.m0} de ${d.n0}* són contra un cotxe, una moto o un altre vehicle de motor.</p><p>Només ${d.s0} són caigudes sense ningú més, i ${d.d0} entre bicis o patinets.</p>`,
  alameda3:d=>`<p>En *${d.pt} dels ${d.n0}* sinistres, l'atestat anota *no respectar la prioritat*: algú no va cedir el pas.</p><p>Segons el Pla, ací ja s'hi va fer una auditoria de seguretat viària (2024) i una reordenació de la cruïlla (2025). En la cruïlla (amb 30 m al voltant, la línia discontínua), els sinistres passen de ${d.ay[AÑOS.indexOf(ALA0)]} en ${ALA0} a ${d.ay[IU]} en ${ULT}. Però en tot el passeig de l'Albereda quasi no canvien (${R.ala_paseo.map((v, i) => `${AÑOS[i]}: ${fmt(v)}`).join("; ")}), i des de mitjan 2024 la policia anota menys sinistres «en la cruïlla» i més per número de portal. A més, un lloc triat per ser el pitjor sol millorar una mica per si sol. Sense un grup de comparació, el canvi no es pot atribuir a l'obra.</p><p class="aviso">La causa s'anota per al sinistre, no per a cada persona: no diu qui no va respectar la prioritat. Comptem des de ${ALA0} perquè en ${ALA0 - 1} el portal situava pitjor els sinistres.</p>`,
  trafico:d=>`<p>Però tenir molts sinistres no sempre vol dir ser més perillós: pot ser que hi passe molta gent. Per a saber-ho cal el trànsit.</p><p>L'Ajuntament té *${d.nc} punts de comptatge* (${d.ncont} comptadors) en el carril bici. Compten bicis i, probablement, també patinets, sense separar-los.</p>`,
  trafico2:d=>`<p>Portem cada punt de comptatge a un gràfic. Cap a la dreta, *la mitjana per al seu trànsit*: els sinistres que té, de mitjana, un punt amb un trànsit semblant i amb tants encreuaments al voltant. Cap amunt, els que ha tingut.</p><p>La franja és la variació habitual entre punts semblants (95 %): uns punts tenen més sinistres i altres menys sense que hi haja res especial. *${d.nalt}* punts estan clarament per damunt de la mitjana dels punts amb un trànsit semblant (plens, foscos): ho estan tant si es compten els sinistres a 75 com a 100 o a 150 m. ${d.nq} potser (plens, grisos); la resta, com la mitjana (buits).</p><p class="aviso">Estar per damunt de la mitjana no és una anomalia: és la part alta de la variació habitual. És una orientació per a mirar-hi, no un rànquing tancat, i només hi entren els sinistres pròxims a un punt de comptatge.</p>`,
  trafico3:d=>`<p>Entre els punts de comptatge, *${d.dest.x.nom}* té molts sinistres (${d.dest.x.N}, el lloc ${d.dest.x.rb} per nombre), però també molt de trànsit: la mitjana per al seu trànsit hi seria uns ${fmt(d.dest.x.mu)}. Està com la mitjana.</p><p>*${d.dest.t.nom}* en té ${d.dest.t.N} on la mitjana seria uns ${fmt(d.dest.t.mu)}. Però si es miren per separat, amb bici n'hi ha ${d.dest.t.b[0]} (la mitjana, ${fmt(d.dest.t.b[1], 1)}) i amb patinet, ${d.dest.t.v[0]} (la mitjana, ${fmt(d.dest.t.v[1], 1)}): l'excés és només de patinet. *${d.dest.b.nom}*, ${d.dest.b.N} on la mitjana seria uns ${fmt(d.dest.b.mu)}: en una llista per nombre de sinistres seria el lloc ${d.dest.b.rb}. Ací passa amb la bici (${d.dest.b.b[0]}, mitjana ${fmt(d.dest.b.b[1], 1)}) i amb el patinet (${d.dest.b.v[0]}, mitjana ${fmt(d.dest.b.v[1], 1)}).</p><p class="aviso">${d.nalt_sv ? `En ${d.nalt_sv} dels ${d.nalt} punts clarament per damunt, l'excés és només de patinet.` : ""} Pot ser que el comptador no compte els patinets: aleshores hi passarien més patinets dels que diu i l'excés seria menor.</p>`,
  falta:d=>`<p>Què falta per a poder seguir el Pla? Primer, *la línia base*. Proposem ${fmt(d.base)}, els sinistres de ${B}, però l'ha de fixar l'Ajuntament.</p>`,
  falta2:d=>`<p>Segon, *la gravetat*. Els sinistres amb ferits greus passen de *${fmt(R.grav[0])} a ${fmt(R.grav[IU])}*, però no perquè siguen més greus.</p><p>Des de ${GRAV_COMP - 1} compta com a greu tot ingrés en l'hospital de més de 24 hores, i el canvi va entrar a poc a poc: durant ${GRAV_COMP - 1} la xifra puja trimestre a trimestre. ${A0} i ${GRAV_COMP - 1} són una transició; els greus només es poden comparar des de ${GRAV_COMP}. I la categoria «baixa gravetat» encara puja molt en 2025: la classificació no està del tot estable.</p><p class="aviso">Tots els sinistres de la ciutat, no sols els de bici o patinet.</p>`,
  falta3:d=>`<p>Tercer, *saber qui passa*. *Fins a ${M1} sabíem quants patinets hi havia. Des d'aleshores, no.* En els conteos manuals del carril bici, els patinets passen del ${fmt(R.uso_manual[0].pat*100)} % (${R.uso_manual[0].año}) al ${fmt(R.uso_manual[R.uso_manual.length-1].pat*100)} % (${M1}).</p><p>Des de ${U0}, els punts de comptatge només donen el total: puja un ${fmt(R.uso_idx.idx[R.uso_idx.idx.length-1] - 100)} % fins a ${UU} (${R.uso_idx.n} comptadors amb dades tots els anys), però no sabem quina part són patinets. Sense això no es pot saber si el patinet té més risc o si només n'hi ha més.</p><p class="aviso">Conteos manuals (fonts externes, com a complement): ${R.uso_manual.map(m => m.año + ", " + m.f).join("; ")}. Total: suma de la IMD dels ${R.uso_idx.n} comptadors del carril bici amb dades tots els anys (Mobilitat).</p>`,
  falta4:d=>`<p>Quart, i el més urgent: *les dades de cada any*. ${EV ? `Les de ${ULT} ja s'han publicat: ${fmt(JU.obs)} sinistres, *${T.va.r.jz[JU.estado]}*. ` : ""}${P26 ? `Les de ${P26}${P26 === MT["año_plan"] ? ", el primer any del Pla," : ""} *encara no estan publicades* en el portal de dades obertes. Sense elles, ningú de fora de l'Ajuntament pot saber si el Pla va al ritme: la senda marca ${fmt(d.s26)} sinistres per a ${P26}, i qualsevol xifra entre ${fmt(d.b26[0])} i ${fmt(d.b26[1])} hi seria compatible. Quan arriben, també caldrà mirar els sinistres amb ferits i la part de la ciutat, per a descartar que una baixada siga només un canvi en com es registren.` : `Cada any ha d'arribar al portal a temps per a seguir la senda.`}</p><p>Per a mesurar el Pla caldria:</p><ol class="pide"><li>una línia base oficial;</li><li>una sèrie de gravetat amb el mateix criteri;</li><li>comptar els patinets a banda de les bicis i publicar les intensitats de trànsit en el portal de dades obertes;</li><li class="clave"><span>publicar cada any els sinistres${P26 ? `, començant per ${P26}` : ""}.</span></li></ol><p class="aviso">El mateix Pla preveu indicadors anuals, una memòria anual i un quadre de comandament (accions 7.1.1 i 7.1.2). El conjunt de dades de ${RANG} ja existeix: només cal continuar-lo.</p>`,
  cruce:d=>`<p>I el teu carrer? En l'observatori pots buscar un carrer o una cruïlla. Els ${d.nn} llocs amb més sinistres i els ${d.nc} punts de comptatge tenen fitxa completa: any a any, amb qui xoquen i què en diu el Pla. Per a la resta, la llista dels seus sinistres.</p><p><a href="observatori.html">Busca el teu encreuament en l'observatori →</a></p>`},

sab:d=>sabHTML([
  ["El que se sosté", [
    [`Hi ha llocs on els sinistres es concentren any rere any: triats amb ${etqA(R.per.A)}, en ${etqA(R.per.B)} en tenen tants com si mantingueren el seu ritme (${fmt(d.pB)}, entre ${fmt(d.pLo)} i ${fmt(d.pHi)}), i molts més que llocs qualssevol (${fmt(d.pLoc)}). La llista quasi no canvia si es mouen els límits de les cruïlles: se'n mantenen entre ${d.estMin} i ${d.estMax} de ${d.nn}.`, "lugares"],
    [`El patinet canvia la composició: els sinistres amb patinet passen de ${fmt(R.vmp[0])} a ${fmt(R.vmp[IU])}, i els de bici, de ${fmt(R.bici[0])} a ${fmt(R.bici[IU])}.`, "uso"],
    [`Abans del Pla, els sinistres amb bici o patinet pugen un ${fmt(d.previa,0)} %, igual que tots els de la ciutat (${fmt(d.vCiudad,0)} %).`, "uso"]]],
  ["El que encara no es pot saber", [
    [EV ? `Si el Pla funciona: de moment, només ${ULT - B === 1 ? "un any" : `${ULT - B} anys`} amb dades del Pla (${ULT}: ${T.va.r.jz[JU.estado]}).` : `Si el Pla funciona: falten les dades de ${P26 || MT.desde}, el primer any del Pla.`, "meta"],
    [`Si el patinet té més risc per viatge que la bici: cap comptador mesura quants patinets circulen.`, "limites"]]],
  ["El que hem descartat", [
    [`Un rànquing de punts negres propis del patinet: amb pocs sinistres per lloc no es detecta cap diferència entre bici i patinet («no detectable» no vol dir «no existeix»).`, "limites"],
    [`Que el patinet tinga més sinistres «amb el mateix ús»: el càlcul estava inflat perquè cada any se situen més sinistres en el mapa.`, "revisiones"],
    [`Que la baixada de l'Albereda amb Saragossa es deba a l'obra: en tot el passeig quasi no canvia, i ha canviat com s'anota l'adreça.`, "lugares"]]]]),

aria:{
  promesa:d=>`Fila de la tabla de indicadores del Plan: reducción del 50 % de los siniestros con ciclistas y patinetes para ${AM}, con la casilla de línea base vacía.`,
  partida:d=>`Barras de siniestros con bici o patinete: ${AÑOS.map((a,i)=>a+", "+fmt(R.tot[i])).join("; ")}. ${B} es la base${d.max?" y el peor año de la serie":""}. Senda propuesta en círculos huecos desde ${MT.desde} hasta ${fmt(d.meta)} en ${AM}.`,
  y2025:d=>`Antes del Plan: de ${fmt(R.tot[0])} siniestros en ${AÑOS[0]} a ${fmt(d.base)} en ${B}, un ${fmt(d.previa,0)} % más. ${EV ? `${ULT}: ${fmt(JU.obs)}, ${T.es.r.jz[JU.estado]}. ` : ""}${P26 ? P26+": pendiente de publicar. " : ""}Para llegar a ${fmt(d.meta)} en ${AM} hay que bajar un ${fmt(d.ritmo,1)} % cada año desde ${MT.desde}.`,
  quien:d=>`Cada barra partida, de abajo arriba, en solo bici, solo patinete y choque bici–patinete. ${ULT}: ${fmt(R.serie[IU].b)}, ${fmt(R.serie[IU].p)} y ${fmt(R.serie[IU].a)}.`,
  quien2:d=>`Líneas: bici de ${fmt(R.bici[0])} a ${fmt(R.bici[IU])}; patinete de ${fmt(R.vmp[0])} a ${fmt(R.vmp[IU])}. ${d.dc10} de cada 10 con patinete en ${ULT}.`,
  donde:d=>`Mapa de València con los ${d.nn} lugares con más siniestros; el primero, Alameda con Zaragoza, ${d.ng0.n}.`,
  alameda:d=>`Zoom al paseo de la Alameda en torno a la plaza de Zaragoza: los ${d.n0} siniestros de ${RANG}, agrupados en torno al punto donde se anotaron, y el cruce con 30 m alrededor en línea discontinua.`,
  alameda2:d=>`Los ${d.n0} siniestros agrupados por con quién: vehículo de motor ${d.m0}, solo ${d.s0}, peatón ${d.w0}, otra bici o patinete ${d.d0}.`,
  alameda3:d=>`En ${d.pt} de los ${d.n0} siniestros consta no respetar la prioridad. Siniestros por año: ${d.ay.join(", ")}.`,
  trafico:d=>`Mapa con los ${d.nc} puntos de conteo del carril bici.`,
  trafico2:d=>`Dispersión: la media para el tráfico frente a los siniestros observados en ${d.nc} puntos de conteo; ${d.nalt} claramente por encima y ${d.nq} quizá.`,
  trafico3:d=>`Destacados: ${d.dest.x.nom} ${d.dest.x.N} frente a una media de ${fmt(d.dest.x.mu)}; ${d.dest.t.nom} ${d.dest.t.N} frente a ${fmt(d.dest.t.mu)}; ${d.dest.b.nom} ${d.dest.b.N} frente a ${fmt(d.dest.b.mu)}.`,
  falta:d=>`La tabla del Plan con la casilla de línea base rellena con nuestra propuesta: ${B}, ${fmt(d.base)} siniestros.`,
  falta2:d=>`Siniestros con heridos graves: ${R.grav.map((v,i)=>AÑOS[i]+", "+fmt(v)).join("; ")}. ${A0} y ${GRAV_COMP - 1} son de transición por el cambio de criterio; comparable desde ${GRAV_COMP}.`,
  falta3:d=>`Carril bici: proporción de patinetes en conteos manuales, ${R.uso_manual.map(m => m.año + " " + fmt(m.pat*100) + " %").join(", ")}; desde ${U0} solo el total de los puntos de conteo (${U0} = 100): ${R.uso_idx.idx.map(fmt).join(", ")}, sin saber qué parte son patinetes.`,
  falta4:d=>`Siniestros con bici o patinete: ${R.tot.map((v,i)=>AÑOS[i]+", "+fmt(v)).join("; ")}.${P26 ? ` ${P26}, pendiente de publicar; senda ${fmt(d.s26)}, compatible entre ${fmt(d.b26[0])} y ${fmt(d.b26[1])}.` : ""}${EV ? ` ${ULT}: ${T.es.r.jz[JU.estado]}.` : ""} Meta ${AM} con base ${B}: ${fmt(d.meta)}.`, cruce:d=>`Mapa de la ciudad con los lugares y los puntos de conteo.`},
tit:{promesa:"La promesa",partida:"El punto de partida",y2025:"Antes del Plan, a más",quien:"Bici, patinete o los dos",quien2:"El patinete crece",donde:"Dónde se acumulan",alameda:"La Alameda con Zaragoza",alameda2:"Con quién chocan",alameda3:"No ceder el paso",trafico:"Cuánta gente pasa",trafico2:"Por encima de la media para el tráfico",trafico3:"Tres puntos que destacan",falta:"Qué falta: la línea base",falta2:"Qué falta: la gravedad",falta3:"Qué falta: saber quién pasa",falta4:"Qué falta: los datos de cada año",cruce:"Tu calle"},
pasos:{
  promesa:d=>`<p>En la tabla de indicadores del Plan Director de Seguridad Vial 2026-2030, la acción 3.2.2 pide *reducir a la mitad* los siniestros con ciclistas y patinetes para ${AM}.</p><p>Como en la mayoría de los indicadores del Plan, la casilla de la línea base está vacía, y tampoco dice cómo se cuenta ni cómo se juzga cada año. *¿La mitad de qué?*</p>`,
  partida:d=>`<p>Proponemos rellenar esa casilla con *${B}: ${fmt(d.base)} siniestros* con bici o patinete. Es el último año antes del Plan, que el propio Plan ya analiza${d.max?", y el peor de la serie":""}.</p><p>Si cada año bajara en la misma proporción (un ${fmt(d.anual,1)} %), la senda pasaría por ${fmt(d.s26)} en ${MT.desde} y llegaría a *${fmt(d.meta)}* en ${AM}. Los círculos huecos son esa senda: es una propuesta nuestra, no del Plan.</p><p>La franja alrededor de cada círculo es el margen del azar: aunque todo fuera según la senda, cada año variaría. Para ${MT.desde}, cualquier cifra entre ${fmt(d.b26[0])} y ${fmt(d.b26[1])} sería compatible con la senda.</p><p class="aviso">${d.max ? `Ojo: ${B} es el peor año de la serie, y después de un año así el siguiente suele bajar aunque no cambie nada. Por eso lo comprobamos también con la media ${d.em.etq} (meta ${fmt(d.em.meta)}). ` : ""}Cada siniestro cuenta una sola vez, también los choques bici–patinete; contando por vehículo, como las tablas del Plan, la meta sería ${fmt(d.veh.meta)}.</p>`,
  y2025:d=>`<p>Antes del Plan, los siniestros con bici o patinete suben: de ${fmt(R.tot[0])} en ${AÑOS[0]} a ${fmt(d.base)} en ${B}, *un ${fmt(d.previa,0)} % más*. Solo en ${B}, un ${fmt(d.previaAnt,1)} % más que el año anterior.</p><p>Pero *todos los siniestros de la ciudad suben igual* (un ${fmt(d.vCiudad,0)} %): la parte de la bici y el patinete se queda en el ${fmt(d.cuota1,1)} %. Lo que más crece son los siniestros sin heridos (un ${fmt(d.vSinH,0)} %), y en julio de 2024 la Policía Local creó un nuevo sistema de datos de siniestros (SIASV). Con heridos, la bici y el patinete sí suben más que el resto: un ${fmt(d.vBvH,0)} %, frente a un ${fmt(d.vRestoH,0)} %.</p><p>Para llegar a ${fmt(d.meta)} en ${AM}, hay que bajar *un ${fmt(d.ritmo,1)} % cada año* desde ${MT.desde}.${EV ? ` En ${ULT} ha habido *${fmt(JU.obs)} siniestros*: *${T.es.r.jz[JU.estado]}* (la senda prevé ${fmt(JU.senda)}; sería compatible cualquier cifra entre ${fmt(JU.banda[0])} y ${fmt(JU.banda[1])}).` : P26 ? ` Los datos de ${P26}, el primer año del Plan, *aún no están publicados*: hasta entonces no se puede decir cómo va el Plan.` : ""}</p>${EV ? "" : `<p class="aviso">Primeras señales, pendientes de confirmar con los datos abiertos: según la Policía Local (balance del Plan Vector, ${d.ctx.fecha}), de enero a mayo de 2026 hubo unos ${d.ctx.vmp_menos} siniestros con patinete menos que en el mismo periodo de 2025. <a href="${d.ctx.url}">Fuente</a>.</p>`}`,
  quien:d=>`<p>¿Quién hay detrás? Partimos cada barra en tres: siniestros con solo bici, con solo patinete y choques bici–patinete.</p>`,
  quien2:d=>`<p>*La bici se mantiene*: ${fmt(R.bici[0])} siniestros en ${A0} y ${fmt(R.bici[IU])} en ${ULT}.</p><p>*El patinete pasa de ${fmt(R.vmp[0])} a ${fmt(R.vmp[IU])}.* En ${ULT}, *${d.dc10} de cada 10* siniestros con bici o patinete tienen un patinete implicado.</p><p class="aviso">Ahora cada línea cuenta todos los siniestros de su vehículo: un choque bici–patinete cuenta en las dos, como en el Plan. Sin saber cuántos patinetes circulan, no se puede decir si el riesgo ha subido o si hay más.</p>`,
  donde:d=>`<p>¿Dónde pasan? Cada círculo es uno de los *${d.nn} lugares con más siniestros* entre ${A0} y ${ULT}: un cruce, con 30 m alrededor, o un tramo de calle de 150 m como máximo. Cuanto más grande, más siniestros, y se reparte entre solo bici, solo patinete y choques bici–patinete.</p><p>Se repiten. Si elegimos los ${d.nn} lugares solo con los datos de ${etqA(R.per.A)}, en ${etqA(R.per.B)} suman *${fmt(d.pB)} siniestros*: lo que se espera si cada lugar mantuviera su ritmo (entre ${fmt(d.pLo)} y ${fmt(d.pHi)}, por azar). Lugares cualesquiera del mismo barrio sumarían unos ${fmt(d.pLoc)}. Bajan desde ${fmt(d.pA)} porque los elegimos en su peor momento.</p><p>El anillo dice qué dice el Plan: continuo, cita el lugar (${d.plL} de ${d.nn}); de puntos, solo cita su calle (${d.plC}); sin anillo, no lo menciona (${d.plNo}). El Plan solo publica los ${d.plTop} cruces y calles con más siniestros de cada colectivo: que no mencione un lugar no quiere decir que no lo tenga en cuenta. Pedimos la lista completa.</p><p class="aviso">Fuera queda el Jardín del Turia, el n.º ${d.tPr} con bici para el Plan: sus siniestros no llevan una dirección que se pueda situar. En 2022 el portal daba menos direcciones exactas; por eso cada siniestro cuenta según lo bien que se localizaban los de su año y tipo de dirección.</p>`,
  alameda:d=>`<p>El primero es el *paseo de la Alameda con la plaza de Zaragoza*: *${d.n0} siniestros* con bici o patinete en ${RANG}. También es el n.º ${d.ng0.pr} de la lista de cruces del Plan.</p><p>Cada punto es uno de esos siniestros, en torno al lugar donde lo anotó la policía. Muchos caen en el mismo punto porque se anotan por el cruce.</p>`,
  alameda2:d=>`<p>¿Con quién chocan? *${d.m0} de ${d.n0}* son contra un coche, una moto u otro vehículo de motor.</p><p>Solo ${d.s0} son caídas sin nadie más, y ${d.d0} entre bicis o patinetes.</p>`,
  alameda3:d=>`<p>En *${d.pt} de los ${d.n0}* siniestros, el atestado anota *no respetar la prioridad*: alguien no cedió el paso.</p><p>Según el Plan, aquí ya se hizo una auditoría de seguridad vial (2024) y una reordenación del cruce (2025). En el cruce (con 30 m alrededor, la línea discontinua), los siniestros pasan de ${d.ay[AÑOS.indexOf(ALA0)]} en ${ALA0} a ${d.ay[IU]} en ${ULT}. Pero en todo el paseo de la Alameda apenas cambian (${R.ala_paseo.map((v, i) => `${AÑOS[i]}: ${fmt(v)}`).join("; ")}), y desde mediados de 2024 la policía anota menos siniestros «en el cruce» y más por número de portal. Además, un lugar elegido por ser el peor suele mejorar algo por sí solo. Sin un grupo de comparación, el cambio no se puede atribuir a la obra.</p><p class="aviso">La causa se anota para el siniestro, no para cada persona: no dice quién no respetó la prioridad. Contamos desde ${ALA0} porque en ${ALA0 - 1} el portal situaba peor los siniestros.</p>`,
  trafico:d=>`<p>Pero tener muchos siniestros no siempre significa ser más peligroso: puede que pase mucha gente. Para saberlo hace falta el tráfico.</p><p>El Ayuntamiento tiene *${d.nc} puntos de conteo* (${d.ncont} contadores) en el carril bici. Cuentan bicis y, probablemente, también patinetes, sin separarlos.</p>`,
  trafico2:d=>`<p>Llevamos cada punto de conteo a un gráfico. Hacia la derecha, *la media para su tráfico*: los siniestros que tiene, de media, un punto con un tráfico parecido y con tantos cruces alrededor. Hacia arriba, los que ha tenido.</p><p>La franja es la variación habitual entre puntos parecidos (95 %): unos puntos tienen más siniestros y otros menos sin que haya nada especial. *${d.nalt}* puntos están claramente por encima de la media de los puntos con un tráfico parecido (llenos, oscuros): lo están tanto si se cuentan los siniestros a 75 como a 100 o a 150 m. ${d.nq}, quizá (llenos, grises); el resto, como la media (huecos).</p><p class="aviso">Estar por encima de la media no es una anomalía: es la parte alta de la variación habitual. Es una orientación para mirar, no un ranking cerrado, y solo entran los siniestros cercanos a un punto de conteo.</p>`,
  trafico3:d=>`<p>Entre los puntos de conteo, *${d.dest.x.nom}* tiene muchos siniestros (${d.dest.x.N}, el puesto ${d.dest.x.rb} por número), pero también mucho tráfico: la media para su tráfico serían unos ${fmt(d.dest.x.mu)}. Está como la media.</p><p>*${d.dest.t.nom}* tiene ${d.dest.t.N} donde la media serían unos ${fmt(d.dest.t.mu)}. Pero si se miran por separado, con bici hay ${d.dest.t.b[0]} (la media, ${fmt(d.dest.t.b[1], 1)}) y con patinete, ${d.dest.t.v[0]} (la media, ${fmt(d.dest.t.v[1], 1)}): el exceso es solo de patinete. *${d.dest.b.nom}*, ${d.dest.b.N} donde la media serían unos ${fmt(d.dest.b.mu)}: en una lista por número de siniestros sería el puesto ${d.dest.b.rb}. Aquí pasa con la bici (${d.dest.b.b[0]}, media ${fmt(d.dest.b.b[1], 1)}) y con el patinete (${d.dest.b.v[0]}, media ${fmt(d.dest.b.v[1], 1)}).</p><p class="aviso">${d.nalt_sv ? `En ${d.nalt_sv} de los ${d.nalt} puntos claramente por encima, el exceso es solo de patinete.` : ""} Puede que el contador no cuente los patinetes: entonces pasarían más patinetes de los que dice y el exceso sería menor.</p>`,
  falta:d=>`<p>¿Qué falta para poder seguir el Plan? Primero, *la línea base*. Proponemos ${fmt(d.base)}, los siniestros de ${B}, pero debe fijarla el Ayuntamiento.</p>`,
  falta2:d=>`<p>Segundo, *la gravedad*. Los siniestros con heridos graves pasan de *${fmt(R.grav[0])} a ${fmt(R.grav[IU])}*, pero no porque sean más graves.</p><p>Desde ${GRAV_COMP - 1} cuenta como grave todo ingreso en el hospital de más de 24 horas, y el cambio entró poco a poco: durante ${GRAV_COMP - 1} la cifra sube trimestre a trimestre. ${A0} y ${GRAV_COMP - 1} son una transición; los graves solo se pueden comparar desde ${GRAV_COMP}. Y la categoría «baja gravedad» aún sube mucho en 2025: la clasificación no está del todo estable.</p><p class="aviso">Todos los siniestros de la ciudad, no solo los de bici o patinete.</p>`,
  falta3:d=>`<p>Tercero, *saber quién pasa*. *Hasta ${M1} sabíamos cuántos patinetes había. Desde entonces, no.* En los conteos manuales del carril bici, los patinetes pasan del ${fmt(R.uso_manual[0].pat*100)} % (${R.uso_manual[0].año}) al ${fmt(R.uso_manual[R.uso_manual.length-1].pat*100)} % (${M1}).</p><p>Desde ${U0}, los puntos de conteo solo dan el total: sube un ${fmt(R.uso_idx.idx[R.uso_idx.idx.length-1] - 100)} % hasta ${UU} (${R.uso_idx.n} contadores con datos todos los años), pero no sabemos qué parte son patinetes. Sin eso no se puede saber si el patinete tiene más riesgo o si solo hay más.</p><p class="aviso">Conteos manuales (fuentes externas, como complemento): ${R.uso_manual.map(m => m.año + ", " + m.f).join("; ")}. Total: suma de la IMD de los ${R.uso_idx.n} contadores del carril bici con datos todos los años (Movilidad).</p>`,

// ---------- colores concretos (d3 no interpola var()) ----------
let P = {};
function leerTokens(){ const cs = getComputedStyle(document.documentElement);

// ---------- geometría por tamaño (no cambia entre estados) ----------
function geom(W, H, ley){
  const F = {l: 46, r: W - 14, t: 46, b: H - ley - 30};
  const G = {W, H, F};
  const feat = {type:"MultiLineString", coordinates:R.mapa.princ};
  // encuadre: la caja del núcleo urbano (el exportador recorta vías y carril bici a ese núcleo), con margen
  G.proj = d3.geoMercator().fitExtent([[16, 16], [W - 16, H - ley - 16]], {type: "MultiPoint", coordinates: R.nucleo_bb});
  G.cont = R.sc.map(d => G.proj([d.lon, d.lat]));
  G.neg = R.negros.map(n => G.proj([n.lon, n.lat]));
  // siniestros del primer lugar: los que comparten coordenada se empaquetan (d3.packSiblings) alrededor de ella
  const grupos = d3.group(D.ala.map((d, i) => ({i, d})), x => x.d.lon + "," + x.d.lat);
  G.ala = []; G.alaOff = [];
  for (const [, xs] of grupos){ const cs = xs.map(() => ({r: 4.6})); d3.packSiblings(cs);
    xs.forEach((x, j) => { G.ala[x.i] = G.proj([x.d.lon, x.d.lat]); G.alaOff[x.i] = [cs[j].x, cs[j].y]; }); }
  const vista = (bb, m) => { const [[x0, y0], [x1, y1]] = bb, w = W, h = H - ley;
    const k = Math.min(w*(1 - 2*m)/(x1 - x0), h*(1 - 2*m)/(y1 - y0)); return {k, tx: w/2 - k*(x0 + x1)/2, ty: h/2 - k*(y0 + y1)/2}; };
  G.VC = {k:1, tx:0, ty:0};
  // paso «alameda»: zoom de unos 560 m de lado al paseo de la Alameda alrededor de la plaza de Zaragoza
  const n0 = R.negros[0], zl = 280/(111320*Math.cos(n0.lat*Math.PI/180)), zp = 280/110574;
  G.VA = vista([G.proj([n0.lon - zl, n0.lat + zp]), G.proj([n0.lon + zl, n0.lat - zp])], .03);
  // Los siniestros que comparten punto forman un racimo (d3.packSiblings, 2 px de separación) alrededor de su punto real.
  // Cada racimo se trata como un círculo (d3.packEnclose) y una simulación de colisión (d3-force, determinista) los aparta
  // lo justo para que no se pisen; si un racimo se separa de su punto, un trazo fino los une.
  const sx = p => G.VA.k*p[0] + G.VA.tx, sy = p => G.VA.k*p[1] + G.VA.ty;
  G.alaR = W < 520 ? 5.5 : 7; G.alaA = []; G.grp = [];
  for (const [, xs] of grupos){ const cs = xs.map(() => ({r: G.alaR + 1})); d3.packSiblings(cs); const env = d3.packEnclose(cs);
    const p = G.proj([xs[0].d.lon, xs[0].d.lat]);
    G.grp.push({p, px: sx(p), py: sy(p), x: sx(p), y: sy(p), R: env.r + 9, cs: cs.map(c => [c.x - env.x, c.y - env.y]), is: xs.map(x => x.i)}); }
  const hF = H - ley, lim = g => { g.x = Math.max(g.R + 4, Math.min(W - g.R - 4, g.x)); g.y = Math.max(g.R + 56, Math.min(hF - g.R - 30, g.y)); };
  const sim = d3.forceSimulation(G.grp).stop().force("c", d3.forceCollide(g => g.R).iterations(4))
    .force("x", d3.forceX(g => g.px).strength(.08)).force("y", d3.forceY(g => g.py).strength(.08));
  for (let t = 0; t < 300; t++){ sim.tick(); G.grp.forEach(lim); }
  G.grp.forEach(g => { g.off = [g.x - g.px, g.y - g.py]; g.lejos = Math.hypot(...g.off) > 3;
    g.is.forEach((i, j) => { G.alaA[i] = [g.x + g.cs[j][0], g.y + g.cs[j][1]]; G.alaOff[i] = [G.alaA[i][0] - sx(G.ala[i]), G.alaA[i][1] - sy(G.ala[i])]; }); });
  // escalas
  G.x9 = d3.scaleBand(TODOS, [F.l, F.r]).padding(.3);
  G.x4 = d3.scaleBand(AÑOS, [F.l, F.r - Math.min(130, W*.28)]).padding(.32);
  G.YB = Math.ceil(d3.max(R.tot)/500)*500; G.yb = d3.scaleLinear([0, G.YB], [F.b, F.t]);
  G.YG = Math.ceil(d3.max(R.grav)/50)*50; G.yg = d3.scaleLinear([0, G.YG], [F.b, F.t]);
  G.usoA = d3.range(d3.min(R.uso_manual, m => m.año), d3.max(R.uso_idx.años) + 1);
  G.xu = d3.scaleBand(G.usoA, [F.l, F.r]).padding(.3); G.yu = d3.scaleLinear([0, Math.max(100, d3.max(R.uso_idx.idx)) * 1.12], [F.b - 30, F.t + 40]);
  G.XS = Math.ceil(d3.max(R.sc, d => d.mu)/5)*5; G.YS = Math.ceil(d3.max(R.sc, d => d.N)/10)*10;
  G.xs = d3.scaleLinear([0, G.XS], [F.l, F.r]); G.ys = d3.scaleLinear([0, G.YS], [F.b, F.t]);
  G.rN = d3.scaleSqrt([0, d3.max(R.negros, n => n.n)], [0, W < 520 ? 7.5 : Math.min(13, W/55)]);
  // tabla del Plan (en SVG): filas etiqueta/valor; la casilla de línea base es el rectángulo del año base (B)
  const tw = Math.min(W - 20, 520), tx0 = (W - tw)/2, lw = Math.min(130, tw*.36), vw = tw - lw, ty0 = F.t + 70;
  const filas = ["tipo", "ind", "form", "base", "meta"], hs = [34, W < 480 ? 52 : 34, 34, 46, 40];
  let y = ty0; G.tabla = filas.map((f, i) => { const r = {f, y, h: hs[i]}; y += hs[i]; return r; });
  G.tab = {x0: tx0, lw, vw, w: tw, y0: ty0, y1: y};
  const fb = G.tabla[3]; G.celda = {x: tx0 + lw + 8, y: fb.y + 6, w: Math.min(120, vw - 16), h: fb.h - 12};
  // gráfico de unidades por «con quién»: ocupa la figura; se busca la rejilla con la celda más grande que cabe
  G.cols = ["m", "s", "w", "d"]; const cnt = G.cols.map(c => D.ala.filter(d => d.k === c).length), maxN = d3.max(cnt);
  const cw = (W - 28)/4, topU = F.t + 44, numH = 46, labH = 44, availH = (H - ley - 12) - topU - numH - labH;
  let best = {s: 0, nc: 1}; for (let nc = 1; nc <= 12; nc++){ const s = Math.min((cw - 14)/nc, availH/Math.ceil(maxN/nc), 34); if (s > best.s) best = {s, nc}; }
  const paso = best.s, nc = best.nc, hMax = Math.ceil(maxN/nc)*paso, yBase = topU + (availH - hMax)/2 + numH + hMax;
  G.colX = G.cols.map((c, i) => 14 + i*cw + cw/2); G.uniPaso = paso; G.yBase = yBase;
  G.colTop = cnt.map(n => yBase - Math.max(1, Math.ceil(n/nc))*paso);
  const idx = {m:0, s:0, w:0, d:0};
  G.uni = D.ala.map(d => { const c = G.cols.indexOf(d.k), j = idx[d.k]++, nf = Math.min(nc, cnt[c]), x0 = G.colX[c] - nf*paso/2 + paso/2;
    return [x0 + (j % nc)*paso, yBase - paso/2 - Math.floor(j/nc)*paso]; });
  return G;
}

// ---------- montaje de los elementos persistentes (una vez por SVG y tamaño) ----------
function montar(svg, G){
  const s = d3.select(svg).attr("viewBox", `0 0 ${G.W} ${G.H}`).attr("height", G.H); s.selectAll("*").remove();
  const E = {s, G};
  const cid = "clip" + (++montar.n); s.append("clipPath").attr("id", cid).append("rect").attr("width", G.W).attr("height", G.H - (G.H - G.F.b - 30));
  E.cv = lienzosMapa(svg, G);
  // tabla
  E.tabla = s.append("g"); const t = G.tab;
  E.tabla.append("text").attr("class", "gran").attr("x", t.x0).attr("y", t.y0 - 14).text("−50 %");
  E.tabFilas = G.tabla.map(r => { const g = E.tabla.append("g");
    g.append("line").attr("x1", t.x0).attr("x2", t.x0 + t.w).attr("y1", r.y).attr("y2", r.y).attr("stroke-width", 1).attr("class", "tl");
    const h = g.append("text").attr("class", "tabh").attr("x", t.x0 + 4).attr("y", r.y + 21);
    const v = g.append("text").attr("class", "tab").attr("x", t.x0 + t.lw + 8).attr("y", r.y + 21);
    return {r, h, v}; });
  E.tabla.append("line").attr("class", "tl").attr("x1", t.x0).attr("x2", t.x0 + t.w).attr("y1", t.y1).attr("y2", t.y1);
  E.tabRef = E.tabla.append("text").attr("class", "eje").attr("x", t.x0).attr("y", t.y1 + 20);
  // ejes: tres sistemas fijos que se funden (barras, gravedad, dispersión)
  const ejeY = (sc, ticks) => { const g = s.append("g"); ticks.forEach(v => { g.append("line").attr("class", "grid").attr("x1", G.F.l).attr("x2", G.F.r).attr("y1", sc(v)).attr("y2", sc(v));
    g.append("text").attr("class", "eje").attr("x", G.F.l - 6).attr("y", sc(v) + 4).attr("text-anchor", "end").text(fmt(v)); }); return g; };
  E.yb = ejeY(G.yb, d3.range(0, G.YB + 1, 500)); E.yg = ejeY(G.yg, d3.range(0, G.YG + 1, 50)); E.ys = ejeY(G.ys, d3.range(0, G.YS + 1, 10));
  E.xs = s.append("g"); d3.range(0, G.XS + 1, 5).forEach(v => E.xs.append("text").attr("class", "eje").attr("x", G.xs(v)).attr("y", G.F.b + 18).attr("text-anchor", "middle").text(v));
  E.banda = s.append("path").attr("d", d3.area().x(d => G.xs(d[0])).y0(d => G.ys(d[1])).y1(d => G.ys(d[2])).curve(d3.curveStepAfter)(R.banda.filter(d => d[0] <= G.XS)));
  E.diag = s.append("line").attr("x1", G.xs(0)).attr("y1", G.ys(0)).attr("x2", G.xs(Math.min(G.XS, G.YS))).attr("y2", G.ys(Math.min(G.XS, G.YS))).attr("stroke-width", 1.5).attr("stroke-dasharray", "2 4");
  // años: hueco (contorno), tres segmentos llenos, objetivo hueco y etiqueta del año
  E.bandaS = s.append("path");   // margen del azar alrededor de la senda (Poisson al 95 %, scripts/meta.py)
  E.senda = s.append("path").attr("fill", "none").attr("stroke-width", 2).attr("stroke-dasharray", "2 5").attr("stroke-linecap", "round");
  E.anos = TODOS.map(a => ({seg: [0, 1, 2].map(() => s.append("rect").attr("shape-rendering", "crispEdges")), o: s.append("rect").attr("fill", "none").attr("stroke-width", 2),
    tg: s.append("circle").attr("fill", "none").attr("stroke-width", 2.2), yl: s.append("text").attr("class", "eje").attr("text-anchor", "middle").text(a)}));
  // líneas bici y patinete
  E.lin = ["b", "p"].map(k => ({path: s.append("path").attr("fill", "none").attr("stroke-linejoin", "round"), pts: AÑOS.map(() => s.append("circle"))}));
  // gravedad
  E.grRot = s.append("line").attr("stroke-width", 1.5).attr("stroke-dasharray", "5 4");
  E.grPath = s.append("path").attr("fill", "none").attr("stroke-width", 3);
  E.grPts = AÑOS.map(() => s.append("circle").attr("stroke-width", 2.5));
  // rayado de «solo el total» (no se sabe qué parte son patinetes)

    it(c(`<defs><pattern id="lray" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="${P.line}"/><line x1="0" y1="0" x2="0" y2="5" stroke="${P.ink2}" stroke-width="1.6"/></pattern></defs><rect x="5" y="1" width="12" height="12" fill="url(#lray)" stroke="${P.ink2}"/>`), l.total)];
  const alias = {alameda2: "alameda", y2025: "partida", falta4: "partida", trafico3: "trafico2"};
  return (g[k] || g[alias[k]] || []).join("");
}

// ---------- tabla de datos por paso ----------
function tablaDatos(k){ const t = T[L].tabla, r = T[L].r; let head, rows;
  if (["promesa", "partida", "y2025", "falta", "falta4"].includes(k)){ head = [t.any, t.sin, t.senda, t.marge]; rows = TODOS.map(a => [a, AÑOS.includes(a) ? fmt(R.tot[AÑOS.indexOf(a)]) : a === P26 ? r.pend.join(" ") : "", a >= B ? fmt(Math.round(D.senda[a])) : "", E0.banda[a] ? `${fmt(E0.banda[a][0])}-${fmt(E0.banda[a][1])}` : ""]); }
  else if (k.startsWith("quien")){ head = [t.any, r.sb, r.am, r.sp, r.bici, r.pat]; rows = R.serie.map((s, i) => [AÑOS[i], fmt(s.b), fmt(s.a), fmt(s.p), fmt(R.bici[i]), fmt(R.vmp[i])]); }
  else if (["donde", "cruce"].includes(k)){ head = [t.lugar, t.n, t.plan]; rows = R.negros.slice(0, 10).map(n => [nomLugar(L === "es" && n.nom_es || n.nom), n.n, t.pl[n.pl]]); }
  else if (k.startsWith("alameda")){ head = [t.con, t.n, t.prio]; rows = ["m", "s", "w", "d"].map(c => [r.k[c], D.ala.filter(d => d.k === c).length, D.ala.filter(d => d.k === c && d.prio).length]); }
  else if (k.startsWith("trafico")){ head = [t.cont, t.obs, t.esp]; rows = [...R.sc].sort((a, b) => b.N - a.N).slice(0, 12).map(d => [d.n, d.N, fmt(d.mu, 1)]); }
  else if (k === "falta3"){ head = [t.any, t.upat, t.uidx];
    rows = [...R.uso_manual.map(m => [m.año, `${fmt(m.pat*100)} %`, ""]), ...R.uso_idx.años.map((a, i) => [a, "?", fmt(R.uso_idx.idx[i])])]; }
  else if (k.startsWith("falta")){ head = [t.any, t.grav]; rows = R.grav.map((v, i) => [AÑOS[i], fmt(v)]); }
  else return "";
  return `<details class="datos"><summary>${t.ver}</summary><table><thead><tr>${head.map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></details>`;
}

// ---------- buscador (pendiente 37): los lugares con más siniestros y los puntos de conteo, con su nombre en el idioma ----------
// Misma regla que el buscador del observatorio: sin acentos, todas las palabras; nom (oficial) y nom_es (castellano).
// Lo que no esté aquí se busca en el observatorio (#cerca=texto, con todas las direcciones de los siniestros).
const sinT = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const slug = s => sinT(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");   // como hashDe() del observatorio (#lloc=…)
const BUSCA = R.negros.map((n, i) => ({t: "lloc", i, k: sinT(n.nom + " " + (n.nom_es || ""))}))
  .concat(R.sc.map((d, i) => ({t: "punt", i, k: sinT(d.n + " " + (d.id || ""))})));
// (los nombres de los contadores vienen cortados a 45 caracteres: se quita un paréntesis sin cerrar, «(sentido»)
const etqB = b => b.t === "lloc" ? nomLugar(L === "es" && R.negros[b.i].nom_es || R.negros[b.i].nom) : R.sc[b.i].n.replace(/\s*\([^)]*$/, "");
// fichas estáticas (datos/fichas_indice.<hash>.js, de scripts/fichas.py, cargado con SRI): [[clase, slug, nombre va, nombre es, n], …]
const FICHAS_B = (window.FICHAS || []).map(f => [f, sinT(f[2] + " " + f[3])]);
const qi = document.getElementById("qi"), resi = document.getElementById("resi"), busF = document.getElementById("bus-fitxa");
let busSel = null;
function buscarInf(){ const t = T[L], txt = qi.value.trim(), v = sinT(txt); resi.innerHTML = "";
  if (v.length < 3){ resi.hidden = true; return; }
  const ws = v.split(/\s+/);
  BUSCA.filter(b => ws.every(w => b.k.includes(w))).slice(0, 8).forEach(b => { const li = document.createElement("li"), bt = document.createElement("button");
    bt.type = "button"; bt.textContent = etqB(b) + " "; const s = document.createElement("span"); s.className = "ref"; s.textContent = "· " + t.bus_tipus[b.t]; bt.append(s);
    bt.onclick = () => { busSel = b; fitxaB(); resi.hidden = true; qi.value = etqB(b); qi.focus(); }; li.append(bt); resi.append(li); });
  // fichas estáticas por lugar y por calle (window.FICHAS, como en el observatorio): enlace a <clase>/<slug>/
  FICHAS_B.filter(([f, s]) => ws.every(w => s.includes(w))).map(x => x[0]).sort((a, b) => b[4] - a[4]).slice(0, 6).forEach(f => {
    const li = document.createElement("li"), a = document.createElement("a"), s = document.createElement("span");
    a.className = "fit"; a.href = f[0] + "/" + f[1] + "/"; a.textContent = (L === "es" ? f[3] : f[2]) + " "; s.className = "ref"; s.textContent = "· " + t.bus_fitxa_e[f[0]];
    a.append(s); li.append(a); resi.append(li); });
  const li = document.createElement("li"), a = document.createElement("a"); a.href = "observatori.html#cerca=" + encodeURIComponent(txt); a.textContent = t.bus_tots(txt); li.append(a); resi.append(li);
  resi.hidden = false; }
function fitxaB(){ const t = T[L], b = busSel; if (!b){ busF.innerHTML = ""; return; }
  const h = document.createElement("h3"); h.textContent = etqB(b); busF.innerHTML = ""; busF.append(h);
  if (b.t === "lloc"){ const n = R.negros[b.i];
    busF.insertAdjacentHTML("beforeend", `<p>${t.bus_lloc(n.n, b.i + 1, R.negros.length)} ${t.bus_pl[n.pl]}</p><p><a href="observatori.html#lloc=${slug(n.nom)}">${t.bus_fitxa}</a></p>`); }
  else { const d = R.sc[b.i];
    busF.insertAdjacentHTML("beforeend", `<p>${t.bus_punt(d.N, fmt(d.mu, 1))} ${t.bus_nv[d.lv]}${d.sv ? " " + t.bus_sv : ""}</p>${d.id ? `<p><a href="observatori.html#punt=${d.id}">${t.bus_fitxa}</a></p>` : ""}`); } }
qi.addEventListener("input", buscarInf);
// teclado en la lista: flecha abajo desde el campo, flechas para moverse, Esc para cerrar
qi.addEventListener("keydown", e => { if (e.key === "ArrowDown" && !resi.hidden){ e.preventDefault(); resi.querySelector("button,a")?.focus(); } else if (e.key === "Escape"){ resi.hidden = true; } });
resi.addEventListener("keydown", e => { const xs = [...resi.querySelectorAll("button,a")], j = xs.indexOf(document.activeElement);
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); const k = j + (e.key === "ArrowDown" ? 1 : -1); if (k < 0) qi.focus(); else xs[Math.min(k, xs.length - 1)].focus(); }
  else if (e.key === "Escape"){ resi.hidden = true; qi.focus(); } });
document.addEventListener("click", e => { if (!e.target.closest(".busca-inf .buscar")) resi.hidden = true; });

// ---------- teclado (y ratón) en los mapas y la dispersión (pendiente 37) ----------
// En los pasos con lugares o puntos de conteo, la figura se puede recorrer: flechas (siguiente / anterior), Inicio y Fin,
// Intro abre la ficha en el observatorio y Esc oculta la etiqueta. Las posiciones se leen de las marcas ya dibujadas.
const EXPLORA = {donde: "neg", cruce: "neg", trafico: "sc", trafico2: "sc", trafico3: "sc"};
function itemsExp(k){
  if (EXPLORA[k] === "neg") return R.negros.map((n, i) => i);                                   // de más a menos siniestros
  const xs = R.sc.map((d, i) => i);                                                               // mapa: de oeste a este; dispersión: por la media (eje x)
  return k === "trafico" ? xs.sort((a, b) => R.sc[a].lon - R.sc[b].lon) : xs.sort((a, b) => (R.sc[a].mu - R.sc[b].mu) || (R.sc[a].N - R.sc[b].N));
}
function posExp(E, k, i){
  if (EXPLORA[k] === "neg"){ const m = /translate\(([-\d.e]+),\s*([-\d.e]+)\)/.exec(E.neg[i].q.attr("transform") || ""); return m ? [+m[1], +m[2], (+E.neg[i].a2.attr("r") || 8)] : null; }
  return [+E.cont[i].attr("cx"), +E.cont[i].attr("cy"), +E.cont[i].attr("r") || 4];
}
function textoExp(k, i, corto){ const t = T[L];
  if (EXPLORA[k] === "neg"){ const n = R.negros[i], nom = nomLugar(L === "es" && n.nom_es || n.nom);
    return corto ? `${nom} · ${fmt(n.n)}` : t.exp_neg(i + 1, nom, n.n, t.bus_pl[n.pl]); }
  const d = R.sc[i], nom = etqB({t: "punt", i}); return corto ? `${nom} · ${d.N} / ${fmt(d.mu, 1)}` : t.exp_sc(nom, d.N, fmt(d.mu, 1), t.bus_nv[d.lv]); }
const anunciarExp = txt => { const a = document.getElementById("exp-vivo"); a.textContent = ""; setTimeout(() => { a.textContent = txt; }, 50); };
function pintarExp(E, i, anuncia){
  const k = E.expK, g = E.exp, p = i == null ? null : posExp(E, k, i);
  if (!p || !isFinite(p[0])){ g.attr("display", "none"); return; }
  const [x, y, r] = p, W = E.G.W, txt = textoExp(k, i, true), izq = x > W*.6;
  g.attr("display", null);
  g.select("circle").attr("cx", x).attr("cy", y).attr("r", r + 5).attr("stroke", P.sel);
  g.select("text").attr("x", x + (izq ? -(r + 9) : r + 9)).attr("y", Math.max(16, Math.min(E.G.H - 8, y + 5))).attr("text-anchor", izq ? "end" : "start").style("fill", P.ink).text(txt);
  if (anuncia) anunciarExp(textoExp(k, i));
}
function expPreparar(svg, E, k){
  E.exp = E.s.append("g").attr("class", "exp").attr("display", "none").attr("pointer-events", "none");
  E.exp.append("circle").attr("fill", "none").attr("stroke-width", 3); E.exp.append("text").attr("class", "rotf halo");
  E.expK = k; E.expJ = -1; svg.__E = E;
  if (EXPLORA[k]){ svg.setAttribute("tabindex", "0"); svg.setAttribute("role", "application"); svg.setAttribute("aria-describedby", "exp-ajuda"); }
  else { svg.removeAttribute("tabindex"); svg.setAttribute("role", "img"); svg.removeAttribute("aria-describedby"); }
  if (svg.__exp) return; svg.__exp = true;                                                       // escuchadores, una vez por <svg>
  svg.addEventListener("focus", () => { const E = svg.__E; if (!EXPLORA[E.expK]) return; if (E.expJ < 0) E.expJ = 0; pintarExp(E, itemsExp(E.expK)[E.expJ], true); });
  svg.addEventListener("blur", () => svg.__E.exp.attr("display", "none"));
  svg.addEventListener("keydown", e => { const E = svg.__E, k = E.expK; if (!EXPLORA[k] || e.altKey || e.ctrlKey || e.metaKey) return;
    const its = itemsExp(k), n = its.length; let j = E.expJ;
    if (["ArrowRight", "ArrowDown"].includes(e.key)) j = (j + 1) % n;
    else if (["ArrowLeft", "ArrowUp"].includes(e.key)) j = (j - 1 + n) % n;
    else if (e.key === "Home") j = 0; else if (e.key === "End") j = n - 1;
    else if (e.key === "Escape"){ E.exp.attr("display", "none"); return; }
    else if (e.key === "Enter" && j >= 0){ const i = its[j];
      location.href = EXPLORA[k] === "neg" ? "observatori.html#lloc=" + slug(R.negros[i].nom) : "observatori.html#punt=" + R.sc[i].id; return; }
    else return;
    e.preventDefault(); E.expJ = j; pintarExp(E, its[j], true); });
  // ratón: la etiqueta del elemento más cercano (a 16 px o menos)
  svg.addEventListener("pointermove", e => { const E = svg.__E, k = E.expK; if (!EXPLORA[k]) return;
    const b = svg.getBoundingClientRect(), sx = E.G.W/b.width, x = (e.clientX - b.left)*sx, y = (e.clientY - b.top)*sx;
    let best = null, bd = 16*16; itemsExp(k).forEach(i => { const p = posExp(E, k, i); if (!p) return; const d = (p[0] - x)**2 + (p[1] - y)**2; if (d < bd){ bd = d; best = i; } });
    if (best != null) pintarExp(E, best, false); else if (document.activeElement !== svg) E.exp.attr("display", "none"); });
  svg.addEventListener("pointerleave", () => { if (document.activeElement !== svg) svg.__E.exp.attr("display", "none"); });
}

// ---------- modo animado / estático ----------
let anim = true, sinAnim = false, estado = "promesa", ESC = null, CUR = null, timer = null, obs = null, altoMed = 0, anchoMed = 0;
const reduceMQ = matchMedia("(prefers-reduced-motion: reduce)");
try { sinAnim = localStorage.getItem("obs-sinanim") === "1"; } catch(e){}
const movil = () => innerWidth <= 860;
const LEY = 28, leyAlto = () => movil() ? 64 : LEY;   // en móvil la leyenda ocupa dos o tres líneas

// Al terminar o al interrumpirse, siempre se pinta el estado final exacto (sin interpolar). Si llegan dos cambios de paso
// en menos de 350 ms, se salta al final sin animar. Duración: 700 ms (750 con ola) + 150 ms de rótulos.
let DESTINO = null, ultimoIr = -1e9, guardia = null;
function terminar(fundido){
  if (timer){ timer.stop(); timer = null; } clearTimeout(guardia);
  if (!ESC || !DESTINO) return;
  CUR = DESTINO.L; render(ESC, CUR); rotulosDentro(ESC, DESTINO.ann, fundido);
  const ley = document.getElementById("ley"), lh = leyenda(DESTINO.fk);
  if (ley.dataset.html !== lh){ ley.innerHTML = lh; ley.dataset.html = lh; } ley.style.opacity = 1;
}
function ir(k, dur){
  estado = k; if (!ESC) return;
  terminar(0);                                   // la transición anterior acaba en su estado final
  const fk = FIG_DE[k] || k, {L: Lb, ann} = layout(fk, ESC.G);
  const fig = document.getElementById("fig"); fig.classList.toggle("atenua", SOLO_TEXTO.has(k));
  if (SOLO_TEXTO.has(k)) fig.setAttribute("inert", ""); else fig.removeAttribute("inert");
  ESC.s.attr("aria-label", T[L].aria[k](D));
  ESC.exp.remove(); expPreparar(ESC.s.node(), ESC, fk);     // figura explorable con el teclado en los mapas y la dispersión
  const ahora = performance.now(); if (ahora - ultimoIr < 350) dur = 0; ultimoIr = ahora;
  DESTINO = {L: Lb, ann, fk};
  if (!CUR || !dur) return terminar(0);
  rotulosFuera(ESC, 1, ann);   // solo salen los rótulos que cambian; la leyenda, solo si cambia
  const ley = document.getElementById("ley"); if (ley.dataset.html !== leyenda(fk)) ley.style.opacity = 0;
  const ola = CUR.cont.some((c, i) => c.m !== Lb.cont[i].m) || CUR.ala.some((a, i) => a.m !== Lb.ala[i].m);
  const T_ = ola ? 750 : 700, f = interpolador(CUR, Lb, ola);
  timer = d3.timer(el => { const t = Math.min(1, el/T_); CUR = f(t); render(ESC, CUR); if (t >= 1) terminar(1); });
  guardia = setTimeout(() => terminar(1), T_ + 200);   // por si el navegador no da fotogramas (pestaña oculta, ahorro de energía)
}
document.addEventListener("visibilitychange", () => { if (timer) terminar(0); });
// con scroll rápido, solo se anima el último paso al que se llega (tras una pausa breve)
let pend = null;
function pedir(k){ clearTimeout(pend); pend = setTimeout(() => { if (k !== estado) ir(k, 1); }, 90); }
function medir(){ altoMed = innerHeight; anchoMed = innerWidth;
  const af = movil() ? Math.round(altoMed*.55) : Math.round(altoMed - 80);
  document.documentElement.style.setProperty("--alto-fig", af + "px");
  document.documentElement.style.setProperty("--alto-paso", Math.round(altoMed*(movil() ? .9 : .8)) + "px"); }
function alinearPrimera(){
  const p=document.querySelector(".paso"), c=p&&p.querySelector(".caja"), f=document.querySelector(".fig");
  if (!c || !f || !document.documentElement.classList.contains("anim") || movil()) { if (p) p.style.paddingTop=""; return; }
  const hojas=[...f.querySelectorAll("*")].filter(e=>e.children.length===0);
  const big=hojas.find(e=>e.textContent.trim()==="−50 %"), src=hojas.find(e=>/3\.2\.2/.test(e.textContent));
  if (!big || !src) return;
  const fr=f.getBoundingClientRect(), centro=(big.getBoundingClientRect().top+src.getBoundingClientRect().bottom)/2-fr.top;
  const pr=p.getBoundingClientRect(), desfase=pr.top-fr.top;
  p.style.paddingTop=Math.max(0,Math.round(centro-desfase-c.getBoundingClientRect().height/2))+"px";
}
function montarTodo(){
  leerTokens(); medir();
  const html = document.documentElement; html.classList.toggle("anim", anim);
  const t = T[L];
  const caja = k => `<div class="caja"><h2 class="caja-t">${t.tit[k]}</h2>${t.pasos[k](D).replace(/\*([^*]+)\*/g, '<b class="k">$1</b>')}${tablaDatos(k)}</div>`;
  document.getElementById("pasos").innerHTML = ESTADOS.map(k => `<section class="paso" data-paso="${k}">${(!anim && !SOLO_TEXTO.has(k)) ? `<div class="fig-paso"><svg role="img" aria-label="${t.aria[k](D).replace(/"/g, "&quot;")}"></svg><div class="ley" aria-hidden="true">${leyenda(k)}</div></div>` : ""}${caja(k)}</section>`).join("");
  if (obs) obs.disconnect(); if (timer){ timer.stop(); timer = null; } clearTimeout(guardia); DESTINO = null;
  if (anim){
    const svg = document.getElementById("esc"), box = svg.parentNode.getBoundingClientRect();
    ESC = montar(svg, geom(Math.round(box.width), Math.round(box.height), leyAlto())); ESC.cv.todos(); CUR = null; ir(estado, 0);
    const top = movil() ? .72 : .5;
    obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ const k = e.target.dataset.paso; pedir(k);
      document.querySelectorAll(".paso").forEach(p => p.classList.toggle("activo", p.dataset.paso === k)); } }),
      {rootMargin: `-${Math.round(altoMed*top)}px 0px -${Math.round(altoMed*(1 - top) - 2)}px 0px`});
    document.querySelectorAll(".paso").forEach(p => obs.observe(p));
    document.querySelectorAll(".paso").forEach(p => p.classList.toggle("activo", p.dataset.paso === estado));
  } else {
    ESC = null;
    document.querySelectorAll(".fig-paso > svg").forEach(svg => { const k = svg.closest(".paso").dataset.paso, w = Math.round(svg.parentNode.getBoundingClientRect().width);
      const h = Math.round(Math.max(320, Math.min(500, w*.78)));
      const E = montar(svg, geom(w, h, 0)), {L: Lb, ann} = layout(FIG_DE[k] || k, E.G); render(E, Lb); rotulosDentro(E, ann, 0);
      E.exp.remove(); expPreparar(svg, E, FIG_DE[k] || k); });
  }
}
function textos(){ const t = T[L]; document.documentElement.lang = L === "va" ? "ca" : "es"; document.title = t.titol;
  document.querySelectorAll("[data-t]").forEach(e => { const v = t[e.dataset.t]; if (typeof v === "string") e.innerHTML = v; else if (typeof v === "function") e.innerHTML = v(D); });
  document.getElementById("l-va").setAttribute("aria-pressed", L === "va"); document.getElementById("l-es").setAttribute("aria-pressed", L === "es");
  document.getElementById("b-mov").setAttribute("aria-pressed", sinAnim);
  qi.placeholder = t.bus_ph; if (qi.value.trim().length >= 3 && !resi.hidden) buscarInf(); fitxaB(); }
// salida de la cabecera ligada al scroll: se desvanece y sube un poco (solo opacidad y transform)
const intro=document.querySelector(".intro"); let introPend=false;
function salidaIntro(){
  introPend=false;
  if (!document.documentElement.classList.contains("anim")){ intro.style.opacity=""; intro.style.transform=""; return; }
  const h=intro.offsetHeight||300, p=Math.min(1,Math.max(0,scrollY/(h*.9))), e=p*p*(3-2*p);
  intro.style.opacity=String(1-e); intro.style.transform=`translateY(${-36*e}px) scale(${1-.035*e})`;
}
addEventListener("scroll",()=>{ if(!introPend){ introPend=true; requestAnimationFrame(salidaIntro); } },{passive:true});
// el relato se lee desde el principio: al recargar, siempre arriba (sin restaurar la posición anterior)
try{ history.scrollRestoration="manual"; }catch(e){}
if (location.hash) history.replaceState(null,"",location.pathname+location.search);
scrollTo(0,0); addEventListener("load",()=>scrollTo(0,0));
function modo(){ anim = !reduceMQ.matches && !sinAnim; textos(); montarTodo(); requestAnimationFrame(()=>requestAnimationFrame(alinearPrimera)); salidaIntro(); }
try { const s = localStorage.getItem("obs-lang"); if (s === "va" || s === "es") L = s; } catch(e){}
["va", "es"].forEach(l => document.getElementById("l-" + l).onclick = () => { L = l; try { localStorage.setItem("obs-lang", l); } catch(e){} modo(); });
document.getElementById("b-mov").onclick = () => { sinAnim = !sinAnim; try { localStorage.setItem("obs-sinanim", sinAnim ? "1" : "0"); } catch(e){} modo(); };
reduceMQ.addEventListener?.("change", modo);
// tema.js avisa con «tema-cambiado» al pulsar el botón y, en Automático, al cambiar el sistema: d3 y los canvas leen colores concretos
document.addEventListener("tema-cambiado", () => { leerTokens(); modo(); });
addEventListener("resize", () => { if (innerWidth !== anchoMed) modo(); });   // solo si cambia el ancho (la barra del móvil cambia el alto)
modo();
</script>
