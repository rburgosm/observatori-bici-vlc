  [["Cuadrícula de 100 m, desplazada 25-75 m (15 variantes)", `${ES.rejilla.ret[0]}-${ES.rejilla.ret[1]}`, `${fmt(ES.rejilla.jac[0], 2)}-${fmt(ES.rejilla.jac[1], 2)}`],
   ...ES.variantes.map(v => [`Cruces y tramos: ${v.R !== LG.R ? `${v.R} m alrededor (en lugar de ${LG.R})` : `fundir a ${v.F} m (en lugar de ${LG.F})`}`, v.ret, fmt(v.jac, 2)])])}
<p>Un matiz: para situar los cruces grandes usamos también los puntos donde nuestro programa de localización (el geocodificador) sitúa los siniestros de cruce de toda la ciudad (de todos los vehículos, no solo de bici o patinete). Son posiciones, no recuentos: en los cruces grandes, como Abril Martorell con Malilla, el punto del geocodificador queda a 30-100 m del cruce del callejero. Como son de todos los siniestros, no eligen los lugares por el resultado.</p>
<h3>Corrección por la cobertura</h3>
<p>Cada año se sitúan más siniestros, y no igual los de cruce que los de portal. Para no favorecer los años recientes, cada siniestro pesa 1 / (parte situada de los siniestros con bici o patinete de su año y tipo de dirección):</p>
${tabla("", ["Año", "Cruce: parte situada", "Peso", "Portal: parte situada", "Peso"], M.anys.map(a => [a, pc(M.cobd[a].cruce, 1), fmt(M.pesos[a].cruce, 2), pc(M.cobd[a].portal, 1), fmt(M.pesos[a].portal, 2)]))}
<p>Con peso o sin él, la lista casi no cambia: coinciden <b>${M.igual_sinpeso} de ${M.n_neg}</b>. Si los eligiéramos solo con ${EPA}, cambiarían ${M.cambia_A}: por eso usamos todo el periodo.</p>
<p class="aviso">Desde julio de 2024 la policía anota más siniestros por el número de portal y menos «en el cruce». Un siniestro junto a un cruce puede pasar del cruce al tramo de al lado sin que cambie nada. El peso corrige poco este cambio; por eso las barras por año de cada ficha llevan un aviso.</p>
<h3>¿Se repiten?</h3>
<p>Un lugar puede entrar en la lista por un mal año. Para saberlo sin hacer trampa, elegimos los ${PS.ab.k} lugares <b>solo con ${EPA}</b> y miramos qué pasa <b>en ${EPB}</b>. Lo comparamos con dos referencias: <b>si cada lugar mantuviera su ritmo</b> (el azar hace que, aun así, los elegidos en su peor momento bajen algo) y <b>lugares cualesquiera</b> (de toda la ciudad o del mismo barrio).</p>
${tabla("Elegidos con unos años, mirados en otros (siniestros corregidos por la cobertura)", ["Elegidos con → mirados en", "Lugares", "Antes", "Después", "Si mantuvieran su ritmo (90 %)", "Lugares cualesquiera", "Cualesquiera del mismo barrio"],
  PS.todas.map(p => [p.corte === "AB" ? `${EPA} → ${EPB}` : `${mes(M.anys[0] + "-01")}-${mes(mesAnt(C7))} → ${mes(C7)}-${mes(A1 + "-12")}`, p.k, fmt(p.A), fmt(p.obs), `${fmt(p.perf)} (${fmt(p.perf_lo)}-${fmt(p.perf_hi)})`, fmt(p.glob), fmt(p.loc)]), i => PS.todas[i].k === PS.ab.k)}
<p>Los ${PS.ab.k} primeros de ${EPA} suman ${fmt(PS.ab.A)} siniestros; en ${EPB}, <b>${fmt(PS.ab.obs)}</b>. Es lo que se espera si cada lugar mantuviera su ritmo (entre ${fmt(PS.ab.perf_lo)} y ${fmt(PS.ab.perf_hi)}): la bajada es, sobre todo, vuelta a la media. Lugares cualesquiera sumarían unos ${fmt(PS.ab.glob)}, y lugares cualesquiera del mismo barrio, ${fmt(PS.ab.loc)}. Cortando en julio de 2024, cuando cambia el formato de la dirección, el resultado es el mismo. ${PS.top_ab} de los ${PS.ab.k} primeros de ${EPA} siguen entre los ${PS.ab.k} primeros de ${EPB}.</p>
<p class="aviso">Superar a «lugares cualesquiera» es fácil: la mayoría de cruces y tramos no tienen ningún siniestro. La comparación exigente es con «si mantuvieran su ritmo». ${PSbajo().length ? `Hay excepciones: ${PSbajo().map(p => `los ${p.k} primeros (${p.corte === "AB" ? `${EPA} → ${EPB}` : "corte de julio de 2024"})`).join(" y ")} quedan algo por debajo de su intervalo, coherente con el cambio de formato de 2024, que hace que los cruces pierdan casos hacia los tramos.` : ""}</p>
<h3>El Jardín del Turia, como zona</h3>
<p>El Plan pone el Jardín del Turia como «calle» n.º ${M.tur.pr} en siniestros con bici. Pero sus <b>${fmt(M.tur.n)}</b> siniestros no traen un punto exacto («JARDÍN DEL TURIA», «S/N»): ${M.tur.geo === 0 ? "ninguno se puede situar" : `solo ${fmt(M.tur.geo)} se pueden situar`}. Por eso lo mostramos como <b>zona</b>: la red ciclista del jardín con un margen de ${M.tur.buffer} m, con todos sus siniestros. Solo contamos el jardín: no la Gran Vía Marqués del Turia ni la calle Camp de Túria.</p>
<h3>Límites</h3>
<ul><li><b>No es riesgo por uso.</b> Un lugar puede tener muchos siniestros porque pasa mucha gente.</li>
<li><b>La posición tiende a concentrarse en el centro del cruce.</b> Todos los siniestros de un cruce van al mismo punto. En los ${M.n_neg} lugares, el ${pc(M.cruce_30)} de los siniestros están situados como cruce; en toda la ciudad, el ${pc(M.cruce_ciudad)}.</li>
<li><b>Desde julio de 2024 la policía anota menos siniestros «en el cruce»</b> y más por número de portal. Un cruce puede perder casos sin que cambie nada. Es el caso de la Alameda con Zaragoza: su cruce baja, pero en todo el paseo los siniestros con bici o patinete apenas cambian (${M.ala_paseo.map((v, i) => `${M.anys[i]}: ${fmt(v)}`).join("; ")}). Además, el lugar se eligió por ser el peor, y un lugar así suele mejorar algo por sí solo. Sin un grupo de comparación no atribuimos ningún cambio a una obra.</li>
<li><b>El nombre de cada lugar viene del callejero</b> (nombre oficial y tipo de vía abreviado), no de la dirección más repetida, que a veces era un portal. Cruce: las dos calles que pasan por él y que más nombran las direcciones de todos los siniestros del lugar (de cualquier vehículo); en una rotonda o plaza pequeña, el nombre de la plaza, si la nombra al menos el ${pc(LG.plaza_votos)} de sus siniestros. Tramo: la calle y las que lo cierran. Cuando dos lugares se llamarían igual (las dos calzadas de una avenida), se añade dónde está cada uno (N, S, E, O). Con solo ${EPA} o solo ${EPB}, ${LG.nombres.top} de los ${LG.nombres.k} primeros se llamarían igual; en los demás cambia alguna calle del mismo cruce, o solo la letra de posición.</li>
<li><b>Los nombres publicados no cambian en silencio.</b> Un nombre publicado es una referencia (fichas, enlaces, prensa). Se guardan en <code>data/processed/nombres_lugares.csv</code> con la posición de cada lugar y, cuando llegan datos nuevos, un lugar del mismo tipo (y, si es un tramo, de la misma vía) a ${LG.congela_tol} m o menos conserva el nombre guardado; los lugares nuevos reciben el nombre calculado y se añaden. Si en uno de los ${M.n_neg} primeros el nombre calculado ya no coincide con el publicado, lo decide una persona y, si se cambia, queda en el <a href="cambios.html">registro de cambios</a>.</li></ul>`,
tec:()=>`<p>Cálculo en EPSG:25830 con geopandas, shapely y scipy; el código es común para el análisis y la web (<code>scripts/lugares.py</code>; el análisis, en <code>scripts/lugares_nudos.py</code>). Semillas de cruce: los ${fmt(LG.n_nodos)} nodos de grado 3 o más del grafo de calles (<code>ejes.geojson</code>, ya troceado en los cruces) y los puntos de cruce del geocodificador de todos los siniestros de la ciudad: ${fmt(LG.n_semillas)} semillas. Fusión: <i>buffer</i> de F/2 y disolución (F = ${LG.F} m, enlace simple). Rotondas: plazas (PLAÇA) de diámetro ≤ ${LG.plaza_max} m con las semillas a ≤ F/2, sin encadenar. Zona del cruce: envolvente convexa de sus semillas + R (R = ${LG.R} m). Tramos: el resto de cada vía, en piezas iguales de ≤ ${LG.pieza} m; las piezas de la misma vía con el punto medio a ≤ ${LG.paralela} m se agrupan por enlace completo (no encadena). Orden: suma de pesos y, en empate, número de siniestros. El mapa dibuja la zona del cruce o la línea del tramo.</p>
<p>Persistencia: se ordena con el periodo A (pesos) y se mide la suma ponderada en B de los K primeros, entre todos los ${fmt(LG.n_unid)} lugares del callejero (también los que no tienen ningún siniestro). Lugares cualesquiera: ${fmt(PS.nsim)} permutaciones de los valores de B, en toda la ciudad y dentro de cuadrados de ${PS.bloque} m («mismo barrio»); en todos los casos, p &lt; 0,001. «Si mantuvieran su ritmo»: cada lugar conserva su total y lo reparte entre A y B con una binomial (proporción de su tipo); en cada simulación se vuelven a elegir los K primeros con A y se mide B (intervalo del 90 %).</p>
<p>Pista («a revisar»): prueba binomial unilateral de cada categoría «con quién» frente al resto de lugares del mismo tipo, sin el propio lugar (cruces: vehículo ${pc(PI.ref.nudo.m)}, peatón ${pc(PI.ref.nudo.w)}, entre bicis o patinetes ${pc(PI.ref.nudo.d)}, solo ${pc(PI.ref.nudo.s)}; tramos: ${pc(PI.ref.tramo.m)}, ${pc(PI.ref.tramo.w)}, ${pc(PI.ref.tramo.d)} y ${pc(PI.ref.tramo.s)}); el Turia, frente al resto de la ciudad. Holm sobre las ${PI.familia} pruebas del mapa (4 por lugar; los lugares con menos de ${PI.min} siniestros cuentan como p = 1): ${PI.probadas} pruebas en ${PI.lugares_prob} lugares, y pasan ${PI.holm}. Es un indicio para una visita, no un diagnóstico.</p>
<p>Zona del Turia: tramos de tipo «Jardín del Turia» (estado 4) de la capa 189, con un margen de ${M.tur.buffer} m, y texto de la dirección con la frase completa («JARDÍN DEL TURIA», «CAUCE DEL TURIA»…). ${M.dup_turia ? `${M.dup_turia} siniestros del Turia cuentan también en uno de los ${M.n_neg} lugares.` : `Ningún siniestro del Turia cuenta también en uno de los ${M.n_neg} lugares.`}</p>`},

normal:{h:"Por encima de la media de los puntos con un tráfico parecido",
cos:()=>`<p>En <b>${EB.sitios} puntos de conteo</b> sabemos cuántas bicis pasan (${EB.cont} contadores). Los contadores que miran el mismo sitio forman un solo punto: los que están a menos de ${EB.agrupa} m y los del mismo trozo de calle sin ningún cruce entre ellos, como los dos sentidos del puente de l'Assut de l'Or, que antes eran dos puntos. Eso nos permite comparar cada punto con otros de tráfico parecido.</p>
<ol><li>Cada siniestro va al punto de conteo más cercano, si está a ${EB.radio} m o menos.</li>
<li>Un modelo estadístico calcula cuántos siniestros tiene, de media, un punto con ese tráfico de bicis y de coches y con tantos <b>cruces de calles</b> a ${EB.radio} m: es <b>«la media de los puntos con un tráfico parecido»</b>.</li>
<li>Ajustamos el recuento (Bayes empírico): si un punto tiene pocos siniestros, nos fiamos más de la media; si tiene muchos, más de su propio recuento.</li>
<li>Calculamos la <b>probabilidad de estar por encima de esa media</b> contando los siniestros a ${R3("es")} m, cada distancia con su modelo.</li>
<li>Lo repetimos para la <b>bici</b> y para el <b>patinete</b> por separado.</li></ol>
${tabla("Tres niveles", ["Nivel", "Probabilidad de estar por encima de la media", "Puntos"], [
  ["Claramente por encima de la media de los puntos con un tráfico parecido", `más de 0,95 a ${R3("es")} m`, fmt(EB.alta)], ["Quizá por encima", `más de 0,80 a ${EB.radio} m`, fmt(EB.quiza)], ["Como la media", "el resto", fmt(resto)]])}
<p>Claramente por encima (siniestros / media de los puntos con un tráfico parecido): ${CLARO("es")}.</p>
<p><b>Por qué este criterio:</b></p>
<ul><li><b>Los cruces.</b> Muchos siniestros se sitúan en el centro del cruce. Un contador a mitad de manzana tiene pocos cruces dentro del círculo de ${EB.radio} m; uno junto a una plaza, muchos. Sin tenerlo en cuenta, parte del «exceso» era solo eso. Con los cruces el modelo mejora claramente (${pval(CRN.p)}), y los puntos con una probabilidad de más de 0,95 a ${EB.radio} m pasan de ${CR0.p95} a ${CRN.p95}.</li>
<li><b>Que no dependa de la distancia.</b> Con solo ${EB.radio} m, ${RG.p1_100} puntos superan 0,95, pero la lista cambia mucho si se cuentan los siniestros a 75 o a 150 m (las listas se parecen poco: índice de Jaccard de ${fmt(EB.jaccard["75"], 2)} y ${fmt(EB.jaccard["150"], 2)}, donde 1 quiere decir idénticas). Por eso pedimos que se mantenga con las tres distancias: quedan ${EB.alta}.</li>
<li><b>Por encima de la media no quiere decir anomalía.</b> El modelo ya prevé que los puntos varían entre sí: de entrada, el ${pc(SIM.a_priori_1)} está por encima de la media. Si simulamos ${fmt(EB.crit.n_sim)} veces la ciudad solo con esa variación, sin ningún punto «especial», salen de media ${fmt(SIM.p1, 1)} puntos con probabilidad de más de 0,95 a ${EB.radio} m (observamos ${SIM.obs_p1}), y casi ninguno de los marcados está en realidad por debajo de la media (${fmt(SIM.fd1, 1)}). «Claramente» quiere decir, pues, que el punto está por encima de la media, no que sea una anomalía. Si pedimos al menos un ${pc(EB.crit.umbral - 1)} más que la media, quedan ${RG.pu_100} a ${EB.radio} m y ${RG.pu_3r} con las tres distancias: los datos no permiten hablar de puntos anómalos.</li>
<li><b>Bici y patinete por separado.</b> Con el modelo de solo bici, ${EB.bici_p95} puntos superan 0,95 a ${EB.radio} m y ${EB.bici_claro} lo hacen con las tres distancias; con el de solo patinete, ${EB.vmp_p95} y ${EB.vmp_claro}. De los ${EB.alta} puntos claramente por encima, en ${DG.claro_solo_vmp} el exceso es solo de patinete (con la bici están como la media). Como no sabemos si los contadores cuentan patinetes, ese exceso puede ser solo que pasan más patinetes de los que el contador ve. Cada ficha lo dice.</li>
<li>Solo cubre los siniestros cercanos a un contador: ${fmt(EB.asig)} de ${fmt(EB.geo)} situados (${pc(EB.asig / EB.geo)}).</li>
<li><b>No predice mejor que el simple recuento.</b> Si ordenamos con dos años y miramos los otros dos, el método gana al recuento en ${V.top10.eb_gana} de ${V.particiones} combinaciones.</li>
<li>Suponemos que los contadores cuentan <b>bicis y, probablemente, también patinetes</b>, sin separarlos. Movilidad no lo ha confirmado.</li>
<li>No es un riesgo por persona. Entre puntos de conteo, los que tienen el doble de tráfico no tienen el doble de siniestros (elasticidad de ${fmt(EB.elast, 2)}; con 1, los siniestros crecerían en la misma proporción que el tráfico). Con solo bici la diferencia casi desaparece (${fmt(EB.elast_bici, 2)}, compatible con 1), así que puede venir de la mezcla de bicis y patinetes que cuentan los contadores. Es una asociación entre puntos: no dice qué pasará si crece el tráfico de un punto.</li>
<li>La franja del gráfico del informe es la <b>variación habitual entre puntos con un tráfico parecido</b>, según el mismo modelo (95 %): ${EB.banda.encima} puntos quedan por encima y ${EB.banda.debajo} por debajo. El color de los puntos sigue la regla de la tabla, no la franja.</li></ul>`,
tec:()=>`<p><b>Modelo</b> (statsmodels): binomial negativa (NB2) por punto y año, log μ = b<sub>0</sub> + b<sub>1</sub> log IMD bici + b<sub>2</sub> log IMD vehículos + b<sub>3</sub> log(1 + cruces) + indicador «sin tramo aforado» + efecto de año. IMD de vehículos: máximo de los tramos a ${EB.radio} m o menos, solo ${M.imd_veh}. Elasticidad de la IMD bici: ${fmt(EB.elast, 2)} (con solo bici, ${fmt(EB.elast_bici, 2)}, compatible con 1; es una elasticidad entre puntos, no dentro de cada punto); b<sub>3</sub> = ${fmt(EB.cruces_coef, 2)}; α = ${fmt(EB.alpha, 3)} (bici, ${fmt(EB.alpha_bici, 3)}; patinete, ${fmt(EB.alpha_vmp, 3)}). Los efectos de año no se publican: recogen también la cobertura creciente del mapa.</p>
<p><b>Cruces</b>: nodos de grado 3 o más del grafo de calles (<code>ejes.geojson</code>; ${fmt(EB.crit.nodos)} en toda la ciudad) a ${EB.radio} m o menos del punto (en cada radio, los de su radio); mediana de ${fmt(CR.mediana)} por punto (de ${CR.rango[0]} a ${CR.rango[1]}). No usan ningún siniestro. Comparación con el modelo sin cruces (razón de verosimilitud, 1 gl): nodos, LR = ${fmt(CRN.lr, 1)} (${pval(CRN.p)}; AIC ${fmt(CRN.aic, 1)} frente a ${fmt(CR0.aic, 1)}); nudos de <code>scripts/lugares.py</code> hechos solo con el callejero (los nodos fundidos a 30 m; ${fmt(EB.crit.nudos)}), LR = ${fmt(CRF.lr, 1)} (AIC ${fmt(CRF.aic, 1)}); nudos de la web, que añaden los puntos de cruce del geocodificador (es decir, posiciones de siniestros), LR = ${fmt(CRW.lr, 1)} (AIC ${fmt(CRW.aic, 1)}). Elegimos los nodos: no dependen de los siniestros y ajustan mucho mejor que los nudos fundidos, porque al fundir se pierde el tamaño del cruce (un cruce de avenida con dos calzadas y carril bici tiene varios nodos, y más puntos de conflicto). El semáforo a ${EB.radio} m no mejora el modelo.</p>
<p><b>Bayes empírico</b> (Hauer; Highway Safety Manual, cap. 9): w = 1 / (1 + α Σμ); EB = w Σμ + (1 − w) ΣN. Probabilidad de exceso: P(θ > 1) con la posterior gamma(1/α + N, 1/α + Σμ) (scipy); también P(θ > ${fmt(EB.crit.umbral, 1)}). La posterior trata μ y α como conocidos.</p>
<p><b>Calibración por simulación</b> (${fmt(EB.crit.n_sim)} veces, con μ y α fijos): θ<sub>i</sub> ~ gamma(1/α, α) y N<sub>iy</sub> ~ Poisson(θ<sub>i</sub> μ<sub>iy</sub>). Regla P(θ > 1) > 0,95 a ${EB.radio} m: se esperan ${fmt(SIM.p1, 1)} puntos, de los que ${fmt(SIM.fd1, 1)} con θ < 1; se observan ${SIM.obs_p1}. Regla P(θ > ${fmt(EB.crit.umbral, 1)}) > 0,95: se esperan ${fmt(SIM.pu, 1)} y se observan ${SIM.obs_pu}.</p>
<p><b>Franja</b> del gráfico: cuantiles 2,5 % y 97,5 % de la predictiva del modelo, NB(1/α, Σμ) (el total de los años de un punto con θ fijo).</p>
<p>Un punto-año solo cuenta si todos sus contadores tienen dato: ${EB.na4} de ${EB.sitios} puntos tienen todos los años con intensidades (${M.anys_eb[0]}-${M.anys_eb[M.anys_eb.length - 1]}).</p>
<p><b>Puntos de conteo</b>: se juntan los contadores a menos de ${EB.agrupa} m y los del mismo enlace de una vía: la misma calle (eje más cercano a ≤ ${EB.enlace.via_tol} m), a ≤ ${EB.enlace.misma_via} m y sin ningún nodo de grado 3 o más en un pasillo de ${EB.enlace.pasillo} m a cada lado del segmento que los une (con 10 m pasaban parejas de bloques distintos de Blasco Ibáñez, porque el segmento va por el bulevar). Así se juntan ${EB.enlace.enlace.map(g => g.join(" + ")).join("; ")}. IMD del punto: la suma de sus contadores, salvo que uno del mismo enlace diga «ambos sentidos», que ya lo cuenta todo (${EB.enlace.ambos.join(", ")}: sumarlos duplicaría la IMD). Zona del punto: la unión de los círculos de sus contadores; cada siniestro va al contador más cercano y cuenta para su punto, así que ningún siniestro cuenta en dos puntos. Con el centro, el círculo del Assut quedaría en mitad del puente, a 164 m de cada contador, y dejaría fuera los dos extremos.</p>
<p><b>Validación fuera de muestra</b> sin fuga: las ${V.particiones} particiones de los cuatro años en 2 + 2; se ordena con un modelo ajustado solo con los dos primeros y se mide el exceso en los otros dos. Top 10: el método supera al recuento en ${V.top10.eb_gana} de ${V.particiones}; diferencia por bootstrap pareado de puntos (IC 95 %) de ${fmt(V.top10.ic95[0], 1)} a ${fmt(V.top10.ic95[1], 1)} siniestros, que incluye el cero. Spearman medio entre el exceso estimado y el que se ve después: ${fmt(V.spearman_AB, 2)}. Código: <code>scripts/cribado_eb.py</code>.</p>`},

plan:{h:"Qué dice el Plan",
cos:()=>`<p>Hemos transcrito el Plan Director de Seguridad Vial 2026-2030: <b>${M.plan.ind} indicadores</b> y <b>${M.plan.lugares} lugares</b> que cita (${M.plan.diag} como diagnóstico y ${M.plan.act} con una actuación). De los indicadores, con datos abiertos podemos calcular ${M.plan.calc["sí"]}, ${M.plan.calc.parcial} en parte y ${M.plan.calc.no} no.</p>
<h3>Cuándo decimos que el Plan «cita este lugar»</h3>
<p>El anillo del mapa tiene tres niveles (hasta el 04/11/2026, el tercero era un anillo discontinuo, que costaba distinguir del de puntos):</p>
<ul><li><b>Continuo, «el Plan cita este lugar»</b>: nombra ese cruce o plaza (o la zona, como el Turia), con actuación o sin ella.</li>
<li><b>De puntos, «el Plan solo cita su calle»</b>: el Plan nombra su calle: en los rankings de calles con más siniestros (con patinete, con bici o con peatones) o por alguna actuación, como un radar. La ficha de cada lugar explica el motivo.</li>
<li><b>Sin anillo, «el Plan no lo menciona»</b>: el Plan no nombra ni el lugar ni su calle.</li></ul>
<p><b>Qué no prueba el anillo.</b> El Plan solo publica los ${M.plan.pl3.top} primeros de cada ranking (cruces y calles con más siniestros con patinete, con bici y con peatones). Que no mencione un lugar no quiere decir que no lo conozca: puede ser el cuarto de su lista. Por eso pedimos la lista completa.</p>
<p><b>Qué no cuenta como cita.</b> El Plan tiene que nombrar el lugar o su calle en un ranking o con una actuación. No cuentan una foto de ejemplo (la avenida de Peris y Valero solo aparece en una foto de un paso de peatones accesible; por eso el lugar de Peris y Valero con la plaza de Manuel Sanchis Guarner figura como «no lo menciona») ni el Anillo Ciclista, que el Plan cita como la vía ciclista con más uso: es una infraestructura, no un ranking de siniestros ni una actuación en ese lugar.</p>
<h3>Diagnóstico no es actuación</h3>
<ul><li><b>Diagnóstico</b>: el Plan dice que el lugar tiene muchos siniestros.</li>
<li><b>Actuación</b>: el Plan dice que se ha hecho o se hará algo (auditoría, reordenación, radar o estudio).</li></ul>
${tabla(`Los ${M.plan.pl3.n} lugares con más siniestros, según el Plan`, ["El Plan…", "Lugares"], [
  ["cita este lugar", fmt(M.plan.pl3.lugar)], ["solo cita su calle", fmt(M.plan.pl3.calle)], ["no lo menciona", fmt(M.plan.pl3.no)]])}
<p>De los ${fmt(M.plan.pl3.lugar)} lugares citados, ${fmt(M.plan.pl3.lugar_act)} tiene además una actuación (la Alameda con la plaza de Zaragoza). ${M.plan.alguna} de los ${M.n_neg} aparecen en el Plan de alguna forma, también en las listas de peatones o con un radar en la calle.</p>`,
tec:()=>`<p>Transcripción: <code>scripts/transcribir_pdsv.py</code> → <code>data/processed/pdsv_indicadores.csv</code> y <code>pdsv_lugares.csv</code>. Si una cita es diagnóstico o actuación lo dice la columna <code>kind</code>, escrita a mano al leer el Plan; no se deduce del texto.</p>
<p>Correspondencia: cada lugar del Plan tiene unas palabras clave (sin tildes, en mayúsculas); todas deben aparecer en alguna dirección de los siniestros del lugar. La regla del anillo está en <code>scripts/exportar_web.py</code> y es la misma para el observatorio y para el informe.</p>
<p>Los ${M.plan.lugares} lugares del Plan están todos decididos: o tienen palabras clave (<code>CLAVES</code>) o un motivo para no emparejarlos (<code>SIN_CLAVE</code>); si aparece uno sin decidir, el script se para y <code>make comprobar</code> da error. Sin palabras clave (${M.plan.sin_clave.length}):</p>
<ul>${M.plan.sin_clave.map(([n, m]) => `<li>${n}: ${m.es}.</li>`).join("")}</ul>
<p>Hasta el 04/11/2026, 12 lugares no tenían palabras clave y se saltaban sin aviso; por eso el reparto era 4 · 11 · 15 y, por ejemplo, Tres Cruces con Campos Crespo (n.º 3 de los cruces con peatones del Plan) salía como «no lo menciona».</p>`},

gravedad:{h:"Gravedad",
cos:()=>`<p>El portal clasifica cada siniestro por su lesión más grave: sin heridos, leves, de baja gravedad, graves y fallecidos.</p>
<p>Durante 2023 se aplicó poco a poco el criterio estatal (Orden INT/2223/2014): <b>herido grave es quien está hospitalizado más de 24 horas</b>. Antes, «grave» era solo para lesiones muy severas. El propio Plan lo explica.</p>
${tabla("Siniestros con heridos graves", ["Año", "Toda la ciudad", "Con bici o patinete"], M.anys.map(a => [a, fmt(M.grav_todos[a]), fmt(M.grav_bv[a])]))}
<p>El salto de ${fmt(M.grav_todos[A0])} a ${fmt(M.grav_todos[A1])} es, sobre todo, el cambio de criterio. <b>Los heridos graves solo son comparables desde 2024.</b> Y no toda la gravedad se ha estabilizado: los siniestros «de baja gravedad» con bici o patinete aún suben un ${pc(M.baja_bv[A1] / M.baja_bv[A1 - 1] - 1)} entre ${A1 - 1} y ${A1}, mucho más que el total de siniestros. El propio Plan da tres cifras para 2024 (${M.plan_graves_2024.map(x => fmt(x)).join(", ")}), según la fuente y según cuente personas o siniestros.</p>
<p class="aviso">La gravedad es la del siniestro (incluye peatones y ocupantes de otros vehículos), no la de quien iba en bici o patinete.</p>`,
tec:()=>`<p>Categorías del portal: SIN HERIDOS, CON HERIDOS LEVES, CON HERIDOS BAJA GRAVEDAD, CON HERIDOS GRAVES y CON FALLECIDOS. «Baja gravedad» también crece año a año (con bici o patinete: ${M.anys.map(a => fmt(M.baja_bv[a])).join(", ")}), lo que apunta a una reclasificación. Por eso las comparaciones de gravedad entre bici y patinete se hacen dentro de cada año.</p>`},

limites:{h:"Lo que no se puede saber con estos datos",
cos:()=>`<ul><li><b>Si el patinete es más peligroso que la bici por viaje.</b> No hay contadores que los separen.</li>
<li><b>Personas.</b> El portal da siniestros, no personas heridas, ni edad ni sexo.</li>
<li><b>Quién conducía qué o de quién es la culpa.</b> Los factores son del siniestro, no de cada vehículo.</li>
<li><b>El tipo de siniestro antes de ${TD}.</b> Viene completo ${TD === A1 ? "solo en" : "desde"} ${TD}: en ${A0}, el ${pc(M.tipo_lleno[A0])}.</li>
<li><b>Los siniestros sin punto.</b> El ${pc(1 - M.cob_bv_tot)} no se pueden situar, y el Turia solo como zona.</li>
<li><b>La gravedad antes de 2024</b>, por cambio de criterio.</li>
<li><b>El uso fuera del carril bici</b>: calzada, ciclocalles y Turia.</li>
<li><b>Causas.</b> Si una obra o una norma ha hecho bajar los siniestros, sin un grupo de comparación.</li>
<li><b>Lugares malos solo para el patinete.</b> Con pocos siniestros por lugar, no se detecta ninguna diferencia. «No detectable» no quiere decir «no existe».</li>
<li><b>Los siniestros que no registra la Policía Local</b>, como muchas caídas sin intervención.</li>
<li><b>Si cambia cuánto se vigila o se denuncia.</b> Solo entran los siniestros con atestado, y eso no afecta igual a la bici y al patinete: caídas sin atestado, controles al patinete, casco obligatorio en patinete desde el 1 de octubre de 2026 (<a href="https://www.boe.es/buscar/act.php?id=BOE-A-2026-13889">Real Decreto 518/2026</a>). Si cambia, puede cambiar el número registrado sin que cambie el riesgo, y también la parte de siniestros con patinete.</li></ul>`,
tec:()=>`<p>Comparaciones bici frente a patinete que sí se pueden hacer, condicionadas al siniestro (proporciones entre siniestros, sin exposición): lluvia, noche, tipo (${A1}) y gravedad dentro del año. Código: <code>scripts/vmp_vs_bici_condicionado.py</code>. A escala de cruce o tramo, sin diferencia detectable (<code>scripts/vmp_vs_bici.py</code>).</p>`},

errores:{h:"Errores detectados en los datos",
cos:()=>`<p>Al trabajar con los datos del Ayuntamiento hemos encontrado <b>${INC.n}</b> incidencias: filas repetidas, campos vacíos, cambios de criterio entre años, datos que faltan o ficheros difíciles de reutilizar. No es una crítica: las tenemos en cuenta en el análisis y se las comunicamos al Ayuntamiento para que se puedan corregir. Sin el portal de datos abiertos, este observatorio no sería posible.</p>
${tablaInc("Incidencias en los datos del Ayuntamiento", ["Conjunto", "Qué pasa", "Cómo lo tratamos", "Estado"])}
<p class="aviso">Estado: «Detectada» quiere decir que aún no la hemos comunicado; después puede ser «Comunicada», «Con respuesta», «Corregida» o «No se corregirá».</p>
<p><b>¿Has visto otro error en los datos o en esta web?</b> Escríbenos a <a href="mailto:${CORREU}">${CORREU}</a>.</p>`,
tec:()=>`<p>Registro: <code>data/processed/incidencias_datos.csv</code>, con el ejemplo, el alcance, el impacto, cómo lo tratamos, la sugerencia y la prueba reproducible de cada incidencia. <code>scripts/incidencias.py</code> (<code>make incidencias</code>) vuelve a comprobar ${INC.auto} automáticamente con cada descarga de datos, para saber si siguen o se han corregido, y escribe el informe para el Ayuntamiento; las otras ${INC.n - INC.auto} se comprueban a mano. Ningún ejemplo contiene datos personales: son identificadores de fila o valores de los campos.</p>`},

revisiones:{h:"Revisiones y reproducibilidad",
cos:()=>`<p>Hemos hecho revisiones automáticas propias: agentes de inteligencia artificial lanzados por el propio proyecto, que no veían nuestras notas, han recalculado las cifras desde los datos. No son una revisión externa.</p>
<h3>Qué cambió por la revisión independiente</h3>
<ul><li>Retiramos el aumento del patinete «con el mismo uso»: estaba inflado por la cobertura creciente del mapa.</li>
<li>Retiramos la tarjeta que decía que en ningún cruce el patinete sale peor: era falta de datos, no una prueba.</li>
<li>Los lugares con más siniestros se eligen con todo el periodo y con peso por cobertura.</li>
<li>La marca «a revisar» de las fichas solo sale con una prueba estadística y con casos suficientes.</li>
<li>El tráfico medio diario (IMD) de cada punto se divide por los años con dato, no siempre por ${M.anys_eb.length}.</li>
<li>La línea base: primero 2024, el año de los heridos graves; releído el texto del Plan, pasa a ${B}, el último año antes del Plan, y 2024 queda como alternativa.</li></ul>
<h3>Qué cambió por la revisión de coherencia</h3>
<ul><li>Turia: solo el jardín. Antes entraban la Gran Vía Marqués del Turia y la calle Camp de Túria.</li>
<li>Un color, un significado, y el orden fijo bici, patinete y choque bici–patinete.</li>
<li>Términos únicos en las dos páginas: «lugares con más siniestros», «lo normal para el tráfico», «senda propuesta».</li>
<li>El anillo del Plan, en tres niveles: cita el lugar, solo cita su calle o no lo menciona.</li>
<li>Los tres niveles de «más de lo normal», iguales en el observatorio y en el informe.</li></ul>
<h3>Qué cambió por la revisión metodológica</h3>
<ul><li>El anillo del Plan pasa de 4 · 11 · 15 a 5 · 12 · 13 (cita el lugar · solo la calle · no lo menciona), y con los lugares por cruce y tramo, a ${M.plan.pl3.lugar} · ${M.plan.pl3.calle} · ${M.plan.pl3.no}: algunos lugares del Plan se saltaban sin aviso. Y como el Plan solo publica los primeros de cada lista, que no mencione un lugar no quiere decir que lo deje fuera.</li>
<li>La subida de 2022-2025 se compara con la de toda la ciudad, que es la misma.</li>
<li><b>Los lugares</b>: ya no son cuadrados de 100 m, sino cruces y tramos de calle, porque la lista dependía de cómo se dibujaba la cuadrícula (se mantenían entre ${ES.rejilla.ret[0]} y ${ES.rejilla.ret[1]} de 30; ahora, entre ${ESmin()} y ${ESmax()}). Desaparece la marca «entre los primeros en las tres etapas», que se medía con los mismos datos que eligen los lugares; en su lugar, comprobamos si se repiten en años distintos de los que sirven para elegirlos. La marca «a revisar» se compara con lugares del mismo tipo y con una corrección por hacer muchas pruebas a la vez (Holm) en todo el mapa (pasa de 8 lugares, con el Turia, a ${M.pista.con.length ? new Set(M.pista.con.map(c => c[0])).size : 0}). El anillo del Plan se ha recalculado con los lugares nuevos. Las barras por año de las fichas están corregidas por la cobertura.</li>
<li>La Alameda con Zaragoza: la bajada de su cruce no se atribuye a la obra (cambio en cómo se anota la dirección y vuelta a la media).</li>
<li>Las fichas ya no marcan «no se mantiene entre los primeros»: es compatible con un lugar que sí se repite.</li>
<li>«Más de lo normal» pasa a «por encima de la media de los puntos con un tráfico parecido»; la elasticidad es una asociación entre puntos.</li>
<li><b>Por encima de la media de los puntos con un tráfico parecido</b> (antes, «más de lo normal para el tráfico»): el modelo tiene en cuenta los cruces a ${EB.radio} m; «claramente» tiene que mantenerse contando los siniestros a ${R3("es")} m (pasan de 21 puntos a ${EB.alta}); cada ficha da la bici y el patinete por separado y avisa cuando el exceso es solo de patinete (${DG.claro_solo_vmp} de los ${EB.alta}); la franja del gráfico es la variación entre puntos parecidos del mismo modelo, y no la del simple azar (Poisson), que dejaba fuera 46 de 145; y ya no se calculan los índices de año del modelo, que recogían la cobertura creciente del mapa.</li>
<li>Los ejemplos del informe se eligen por regla: el punto con más siniestros de los que están como la media, el «claramente» solo de patinete con más siniestros y el «claramente» que no es solo de patinete con menos siniestros. Antes eran Xàtiva con Ruzafa, que ahora es «quizá», y Balaciart con Primado Reig, que ya no se mantiene con las tres distancias.</li>
<li>El mapa dice «Dónde se acumulan», no «Dónde actuar».</li>
<li><b>La meta</b>: se habla de «el indicador de la acción 3.2.2», no de un compromiso de la ciudad; se avisa de que ${B} es el peor año de la serie y se comprueba con la media ${EM.etq} (meta ${fmt(EM.meta)}); se explica el recuento por vehículo del Plan (meta ${fmt(MT.vehiculo.meta)}); cada año se juzga con un margen del azar (por debajo, compatible o por encima de la senda) y no con la cifra exacta; y se añaden dos series de control (con heridos y parte de la ciudad). ${E1["año"]} queda como alternativa, no como comparación principal.</li>
<li>Limitaciones nuevas: la infradeclaración y la vigilancia, distintas para bici y patinete, y la «baja gravedad» en ${A1}.</li></ul>
<h3>Reproducibilidad</h3>
<ul><li>El código (scripts en Python que leen los datos descargados) se publicará con la versión definitiva; aún no es público.</li>
<li><code>make</code> lo rehace todo desde los datos; <code>make web</code> solo la web.</li>
<li><code>make comprobar</code> revisa los datos nuevos (años, cobertura, categorías nuevas, totales frente al Plan) y que la web tenga las mismas claves en valenciano y castellano.</li>
<li><b>Ninguna cifra calculada está escrita a mano</b>: las calcula <code>scripts/exportar_web.py</code>. Las excepciones son cifras transcritas y citadas de documentos: las del Plan Director (como los heridos graves de 2024), la de prensa sobre 2026 y los conteos manuales de patinetes.</li></ul>`,
tec:()=>`${tabla("Versiones", ["Programa", "Versión"], [["Python", M.python], ...Object.entries(M.libs)])}
<p>Informes: <code>docs/revision_independiente.md</code>, <code>docs/revision_coherencia.md</code> y <code>docs/revision_metodologica/</code>.</p>`},

futuro:{h:"Líneas futuras",

tec:()=>`<p>Los años se deducen de los datos (años con los 12 meses). La meta (−50 % en 2030) es del Plan; el año base (${B}) es una propuesta nuestra y se cambia en <code>AÑO_BASE</code> de <code>scripts/exportar_web.py</code>.</p>`}
}}
};
const SECS = Object.keys(T.va.sec);
if (typeof window !== "undefined") window.METODE_T = T;

// ---------- pintar ----------
function pintar(){
  const t = T[L];
  document.documentElement.lang = L === "va" ? "ca" : "es";
  document.title = `${t.ey} · ${t.marca}`;
  document.querySelectorAll("[data-t]").forEach(el => { const v = t[el.dataset.t]; el.innerHTML = typeof v === "function" ? v() : v; });
  document.getElementById("toc").innerHTML = SECS.map(id => `<li><a href="#${id}">${t.sec[id].h}</a></li>`).join("");
  const abiertos = new Set([...document.querySelectorAll("details.tec[open]")].map(d => d.dataset.s));
  document.getElementById("contingut").innerHTML = SECS.map((id, i) => { const s = t.sec[id];
    return `<section id="${id}" aria-labelledby="h-${id}"><h2 id="h-${id}"><span class="n">${i + 1}</span>${s.h}</h2>${s.cos()}<details class="tec" data-s="${id}"${abiertos.has(id) ? " open" : ""}><summary>${t.tec}</summary>${s.tec()}</details></section>`; }).join("");
  ["va", "es"].forEach(l => document.getElementById("l-" + l).setAttribute("aria-pressed", L === l));
  marcar();
}
// índice: marca la sección visible
let obs = null;
function marcar(){
  if (obs) obs.disconnect();
  if (!("IntersectionObserver" in window)) return;
  const enlaces = Object.fromEntries([...document.querySelectorAll("#toc a")].map(a => [a.getAttribute("href").slice(1), a]));
  obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){
    Object.values(enlaces).forEach(a => a.removeAttribute("aria-current")); enlaces[e.target.id]?.setAttribute("aria-current", "true"); } }),
    {rootMargin: "-20% 0px -70% 0px"});
  document.querySelectorAll("main section").forEach(s => obs.observe(s));
}
if (typeof document !== "undefined"){
  try { const s = localStorage.getItem("obs-lang"); if (s === "va" || s === "es") L = s; } catch(e){}
  ["va", "es"].forEach(l => document.getElementById("l-" + l).onclick = () => { L = l; try { localStorage.setItem("obs-lang", l); } catch(e){} pintar(); });
  pintar();
  if (location.hash){ const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
}
</script>
