<script>
"use strict";
const M = window.MET;
const A0 = M.anys[0], A1 = M.anys[M.anys.length - 1];
let L = "va";
const fmt = (n, d=0) => Number(n).toLocaleString(L === "va" ? "ca-ES" : "es-ES", {minimumFractionDigits:d, maximumFractionDigits:d, useGrouping:"always"});
const pc = (x, d=0) => fmt(x * 100, d) + " %";
const MES = {va:["gener","febrer","març","abril","maig","juny","juliol","agost","setembre","octubre","novembre","desembre"],
             es:["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"]};
const mes = ym => { const [y, m] = ym.split("-"); return `${MES[L][+m - 1]} de ${y}`; };
const PER = ["P1", "P2", "P3"];
const perTxt = p => `${mes(M.per[p][0])} – ${mes(M.per[p][1])}`;
const tabla = (cap, head, rows, dest) => `<div class="tw" tabindex="0" role="region" aria-label="${cap ? String(cap).replace(/<[^>]+>/g, "").replace(/"/g, "") : "Taula"}"><table>${cap ? `<caption>${cap}</caption>` : ""}<thead><tr>${head.map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${
  rows.map((r, i) => `<tr${dest && dest(i) ? ' class="dest"' : ""}>${r.map((c, j) => j === 0 ? `<th scope="row" style="font-family:var(--body);font-weight:500;font-size:14.5px;color:var(--ink)">${c}</th>` : `<td${/^(<b>)?[\d−+-]/.test(String(c)) ? "" : ' class="t"'}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
// errores detectados en los datos del Ajuntament (M.inc, de data/processed/incidencias_datos.csv vía exportar_web.py)
const INC = M.inc, CORREU = "hola@observatoribicivlc.org";
const EST_INC = {va:{detectada:"Detectada", comunicada:"Comunicada", respondida:"Amb resposta", corregida:"Corregida", no_se_corrige:"No es corregirà"},
                 es:{detectada:"Detectada", comunicada:"Comunicada", respondida:"Con respuesta", corregida:"Corregida", no_se_corrige:"No se corregirá"}};
const tablaInc = (cap, head) => { const k = L === "va" ? 0 : 1; return `<div class="tw" tabindex="0" role="region" aria-label="${String(cap).replace(/<[^>]+>/g, "").replace(/"/g, "")}"><table class="inc"><caption>${cap}</caption><thead><tr>${head.map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${
  INC.filas.map(f => `<tr><th scope="row" style="font-family:var(--body);font-weight:500;font-size:14.5px;color:var(--ink)">${f[1 + k]}</th><td data-l="${head[1]}">${f[3 + k]}</td><td data-l="${head[2]}">${f[5 + k]}</td><td data-l="${head[3]}" class="est">${EST_INC[L][f[7]]}</td></tr>`).join("")}</tbody></table></div>`; };
const sw = c => `<i class="sw" style="background:var(--${c})" aria-hidden="true"></i>`;
const SER = Object.fromEntries(M.serie.map(r => [r["año"], r]));
const MT = M.meta, E0 = M.esc[0], E1 = M.esc[1], B = MT["año_base"];   // E0: base principal (AÑO_BASE de exportar_web.py); E1: alternativa
// EM: comprobación con la media de los años antes del Plan; CT: series de control (META de exportar_web.py y scripts/meta.py)
const EM = MT.media, CT = MT.control;
const VAR = x => x[x.length - 1] / x[0] - 1, SINH = CT.bv_sin.map((v, i) => v + CT.resto_sin[i]);   // variación primer → último año; sin heridos, toda la ciudad
const ESC = () => [[E0, L === "va" ? "la nostra" : "la nuestra"], [EM, L === "va" ? "comprovació" : "comprobación"], [E1, "alternativa"]];
const JZ = (e, l) => ({va:{pendiente:"pendent", debajo:"per davall de la senda", compatible:"no es pot descartar que vaja al ritme", encima:"per damunt de la senda"},
                       es:{pendiente:"pendiente", debajo:"por debajo de la senda", compatible:"no se puede descartar que vaya al ritmo", encima:"por encima de la senda"}})[l][e.concl];
const EB = M.eb, V = M.eb.val;
// lugares (nudos y tramos), estabilidad, persistencia fuera de muestra y pista (exportar_web.py ← lugares_nudos.py)
const LG = M.lug, ES = M.lug.estab, PS = M.pers, PI = M.pista;
const ESmin = () => Math.min(...ES.variantes.map(v => v.ret)), ESmax = () => Math.max(...ES.variantes.map(v => v.ret));
// periodos de la persistencia (lugares_nudos.py): A ordena, B mide; C7: mes del segundo corte (cambio de registro)
const etqPer = xs => xs.length === 1 ? String(xs[0]) : `${xs[0]}-${xs[xs.length - 1]}`;
const EPA = etqPer(PS.per.A), EPB = etqPer(PS.per.B), C7 = PS.per.corte7;
const mesAnt = ym => { const [y, m] = ym.split("-").map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, "0")}`; };
// panel de uso (scripts/meta.py, uso): hasta el último año con IMD (UA1), que puede ser anterior al último de siniestros (A1)
// TD: primer año con el tipo de siniestro completo (>= 95 % de filas con tipo)
const TD = M.anys.find(a => M.tipo_lleno[a] >= 0.95) ?? A1;
const UA0 = M.uso_a0, UA1 = M.uso_a1, fmtU = (x, d) => x == null ? "—" : fmt(x, d);
const varU = (x, l) => (x >= 0 ? (l === "va" ? "puja" : "sube") : (l === "va" ? "baixa" : "baja")) + " un " + pc(Math.abs(x), 1);
// segundo verbo (siniestros, en plural) solo si va en otra dirección que el tráfico: «sube un 8,9 % y los siniestros un 10,5 %»
const varS = l => (M.sin_ult >= 0) === (M.uso_ult >= 0) ? "un " + pc(Math.abs(M.sin_ult), 1)
  : (M.sin_ult >= 0 ? (l === "va" ? "pugen" : "suben") : (l === "va" ? "baixen" : "bajan")) + " un " + pc(Math.abs(M.sin_ult), 1);
const parU = l => Math.abs(M.uso_ult - M.sin_ult) < 0.03 ? (l === "va" ? ": quasi a la par" : ": casi a la par")
  : M.sin_ult > M.uso_ult ? (l === "va" ? ": els sinistres, més" : ": los siniestros, más") : (l === "va" ? ": el trànsit, més" : ": el tráfico, más");
const PSbajo = () => PS.todas.filter(p => p.obs < p.perf_lo);   // cortes y K por debajo de su intervalo de persistencia perfecta
const sumUlt = M.vmp[A1] + M.bici[A1];
const resto = EB.sitios - EB.alta - EB.quiza;
// cruces en el círculo (A2), criterio de «claramente» (A3-A4), desglose bici / VMP (A1) y franja NB (B1): cribado_eb.py → exportar_web.py
const CR = EB.cruces, CR0 = CR.sin, CRN = CR["nodos (principal)"], CRF = CR["nudos fundidos"], CRW = CR["nudos de la web"], RG = EB.reglas, SIM = EB.sim, DG = EB.desglose;
const pval = x => x < .001 ? "p < 0,001" : `p = ${fmt(x, 3)}`;
const R3 = l => EB.crit.radios.slice(0, -1).join(", ") + (l === "va" ? " i " : " y ") + EB.crit.radios.at(-1);
const CLARO = l => EB.claro.map(([n, cod, N, mu, sv]) => `${n} (${cod}: ${N} / ${fmt(mu, 1)}${sv ? (l === "va" ? "; només patinet" : "; solo patinete") : ""})`).join("; ");

// ---------- textos: mismas claves en va y es; las cifras, de M ----------
const T = {
va:{
marca:"Observatori de la bici i el patinet de València", nav_obs:"Observatori", nav_inf:"Informe", nav_pla:"El Pla, al dia", salta:"Salta al contingut", toc:"Índex", tec:"Detall tècnic",
ey:"Mètode", h1:"Com ho hem fet",
sub:"Cada decisió del projecte, explicada en llenguatge planer. El detall tècnic, en les caixes plegables. Totes les xifres d'esta pàgina es calculen amb les mateixes dades i el mateix codi que la resta de la web.",
sec:{
datos:{h:"Les dades",
cos:()=>`<p>Partim del conjunt <b>«Sinistres de trànsit»</b> del portal de dades obertes de l'Ajuntament. Té <b>${fmt(M.filas)}</b> files: una per sinistre que registra la Policia Local.</p>
<p>Només fem servir anys complets: <b>${A0}-${A1}</b>. Les ${fmt(M.fuera)} files de ${M.fuera_anys.join(", ")} queden fora fins que l'any estiga complet. Hi ha <b>${fmt(M.dup)}</b> files repetides, iguals en tot menys l'identificador: les comptem una sola vegada.</p>
<p>De cada sinistre, el portal dona la data i l'hora, la gravetat, el tipus, els vehicles i els factors. El lloc ve escrit, com una adreça («AV DEL PUERTO 12» o «C/ X cruce AV Y»). <b>No porta coordenades.</b> Les posem nosaltres amb el carrerer municipal.</p>
${tabla("Fonts", ["Conjunt", "Per a què", "Mida"], [
  ["Sinistres de trànsit (portal)", "comptar i situar cada sinistre", `${fmt(M.filas)} files`],
  ["Carrerer: vies, eixos i portals (portal)", "posar coordenades a l'adreça", `${fmt(M.n_ejes)} trams d'eix`],
  ["Carril bici, capa 189 (portal)", "xarxa ciclista i Jardí del Túria", `${fmt(M.km_ciclo, 1)} km de trams`],
  ["Comptadors de bici (espires), capa 225 (portal), i el seu trànsit mitjà diari (IMD), de Mobilitat (valencia.es)", "trànsit en el carril bici", `${fmt(M.n_cont)} comptadors amb dades`],
  [`Trànsit mitjà diari de vehicles (IMD) de ${M.imd_veh}, de Mobilitat, i trams, capa 188 (portal)`, "trànsit de cotxes al voltant", "—"],
  ["Cruïlles amb semàfor (reguladors), capa 182 (portal)", "context de cada lloc", `${fmt(M.n_reg)} reguladors`],
  ["OpenStreetMap (complement extern)", "semàfors que falten en la capa 182", `${fmt(M.n_osm)} semàfors`]])}
<h3>Quants sinistres podem posar en el mapa</h3>
<p>Situem en el mapa el <b>${pc(M.cob_bv_tot)}</b> dels sinistres amb bici o patinet (${fmt(M.n_geo)} de ${fmt(M.n_bv)}). Però el percentatge canvia amb els anys, perquè depén de com s'anotava el lloc en el portal. Hi ha tres etapes.</p>
${tabla("Sinistres situats en el mapa, per etapa del portal", ["Etapa", "Amb bici o patinet", "Tots els sinistres", "Només el nom del carrer", "Cruïlla que no existeix"],
  PER.map(p => [perTxt(p), pc(M.cob_bv[p]), pc(M.cob_todos[p]), pc(M.solo_calle[p]), pc(M.cruce_fallo[p])]))}
<ul><li>Fins a ${mes(M.per.P1[1])}, moltes files porten només el nom del carrer, sense número ni cruïlla. No es poden situar.</li>
<li>Fins a ${mes(M.per.P2[1])}, algunes «cruïlles» són de dos carrers que no es toquen, de vegades a més d'un quilòmetre. Sembla que volen dir «a l'altura de».</li>
<li>Des de ${mes(M.per.P3[0])}, gairebé totes porten número o una cruïlla real.</li></ul>
<p>Conseqüència: <b>qualsevol tendència feta només amb els sinistres del mapa creix de manera artificial.</b> Per això el seguiment de l'indicador del Pla el fem amb tots els sinistres, situats o no. I en el mapa, cada sinistre pesa segons com de bé se situaven els del seu any i tipus d'adreça (secció 5).</p>`,
tec:()=>`<p><b>Geocodificació</b>, és a dir, com posem coordenades a cada adreça (<code>scripts/geocodificar.py</code>, shapely i pyproj en EPSG:25830):</p>
<ul><li><b>Cruïlla</b>: punt mitjà dels dos vèrtexs més pròxims dels eixos de les dues vies, si estan a 40 m o menys. Si no, la distància entre segments, amb el mateix llindar. Ho fem en eixe ordre perquè cap cruïlla ja situada es moga.</li>
<li><b>Portal</b>: coordenades del número en la capa de portals. <b>Portal pròxim</b>: el número més pròxim del mateix carrer.</li>
<li>Nom normalitzat (sense accents, «PROFESSOR» = «PROFESOR», «L·L» = «L.L», parèntesis truncats) i una taula de 4 equivalències de carrers reanomenats (<code>data/processed/equivalencias_calles.csv</code>).</li></ul>
<p>Dels sinistres amb bici o patinet situats: ${pc(M.metodo.cruce)} per cruïlla, ${pc(M.metodo.portal)} per portal i ${pc(M.metodo.portal_cercano || 0, 1)} per portal pròxim.</p>
<p>Etapes del portal: talls en ${M.cortes.join(" i ")} (inici de la segona i la tercera). Duplicats: files iguals en totes les columnes llevat de <code>_id</code>. Dada crua trencada: ${fmt(M.unidades_rotas)} files amb els vehicles buits («[»).</p>
<p>Validació: mostra de 50 punts contrastada amb OpenStreetMap (Nominatim). Comprova el nom del carrer, no l'error en metres.</p>`},

contar:{h:"Com comptem",
cos:()=>`<p>Un sinistre pot implicar diversos vehicles. Cada sinistre amb bici o patinet va a una sola de tres categories:</p>
<div class="cats"><span>${sw("bici")}Només bici</span><span>${sw("pat")}Només patinet</span><span>${sw("amb")}Xoc bici–patinet</span></div>
<ul><li><b>Només bici</b>: hi ha almenys una bici i cap patinet. Pot haver-hi cotxes o vianants.</li>
<li><b>Només patinet</b>: hi ha almenys un patinet elèctric (VMP) i cap bici.</li>
<li><b>Xoc bici–patinet</b>: hi ha almenys una bici i un patinet. El <b>${pc(M.amb_solo)}</b> són xocs només entre ells, sense cap cotxe ni vianant.</li></ul>
${tabla("Sinistres per any i categoria", ["Any", "Només bici", "Només patinet", "Xoc bici–patinet", "Total (cada un una vegada)", "Amb bici", "Amb patinet"],
  M.anys.map(a => [a, fmt(SER[a].b), fmt(SER[a].p), fmt(SER[a].a), `<b>${fmt(M.bv[a])}</b>`, fmt(M.bici[a]), fmt(M.vmp[a])]))}
<p><b>Dues maneres de comptar, cada una en el seu lloc:</b></p>
<ul><li>En les <b>barres i els formatges</b>, cada sinistre compta <b>una vegada</b>. És el total amb què seguim la meta.</li>
<li>En les <b>línies «bici» i «patinet»</b>, el xoc bici–patinet compta <b>en les dues</b>, com fa el Pla. Per això, en ${A1}, bici més patinet suma ${fmt(sumUlt)}, i el total és ${fmt(M.bv[A1])}.</li></ul>
<p><b>Colors en ordre fix</b> en totes les pàgines: bici, patinet i xoc bici–patinet. S'han triat perquè es distingisquen també amb daltonisme. El taronja i el verd tenen poc contrast sobre fons clar: per això sempre van amb etiqueta o llegenda.</p>`,
tec:()=>`<p>Bici = «BICICLETA» en el camp de vehicles; patinet = «VMP» (vehicle de mobilitat personal). Les sèries «amb bici» i «amb patinet» coincideixen amb les del Pla, amb diferències d'1 o 2 sinistres per any (el Pla les trau del sistema de la Policia Local en una altra data). El Pla no dona mai la unió: sumar les seues dues sèries compta dues vegades els xocs bici–patinet.</p>
<p>Paleta validada amb un comprovador de contrast i daltonisme (deuteranopia, protanopia i tritanopia), en mode clar i fosc.</p>`},

meta:{h:"La meta i la línia base",
cos:()=>`<p>L'acció 3.2.2 del Pla Director de Seguretat Viària posa este indicador:</p>
<p class="cita">«Reducció de sinistres amb ciclistes/VMP: −50 %». Línia base: «—». Fórmula: «Comparació anual».</p>
<p><b>És l'indicador d'una acció, no la meta global del Pla</b>, que és de persones mortes i ferides greus (ho expliquem en el detall tècnic). Com la majoria dels indicadors del Pla (${fmt(M.plan.sin_base)} de ${fmt(M.plan.ind)}), té la línia base buida, i tampoc diu com es compta ni com es jutja cada any. Ho hem de decidir nosaltres, i ho expliquem ací.</p>
<h3>La línia base: ${B}</h3>
<p>Prenem <b>${B}</b>, l'últim any abans del Pla. Per què:</p>
<ul><li>el Pla es planteja «con el año ${MT["año_plan"]} como punto de partida» i val per a ${MT["año_plan"]}-2030;</li>
<li>el seu diagnòstic ja analitza ${B}: estudia l'evolució «entre los años 2019 hasta 2025» i en detall 2023, 2024 i 2025 (apartat 2.3.2);</li>
<li>el Pla tria ${E1["año"]} només per als ferits greus, per la <b>qualitat de la dada de gravetat</b>: des de ${E1["año"]} la Policia Local adapta cada sinistre als criteris estatals (nota 2 de la pàg. 23, que remet a l'apartat 2.3.2). Este motiu no afecta el recompte de sinistres, que és el que mesura l'acció 3.2.2.</li></ul>
${MT.max ? `<p class="aviso"><b>${B} és el pitjor any de la sèrie.</b> Partir del pitjor any afavoreix el Pla: després d'un any molt alt, el següent sol ser més baix encara que no canvie res (és la tornada a la mitjana). Per això ho comprovem també amb la <b>mitjana ${EM.etq}</b>: ${fmt(EM.base_x)} sinistres de mitjana, meta ${fmt(EM.meta)}. Si amb base ${B} es compleix i amb la mitjana no, ho direm.</p>` : ""}
${tabla("Línies base", ["Línia base", "Sinistres en la base", "Meta 2030 (−50 %)", "Senda: baixada cada any", `Baixada anual necessària des de ${MT.desde}`, `Marge per a ${MT.desde}`],
  ESC().map(([e, n]) => [`${e.etq} (${n})`, fmt(e.base), fmt(e.meta), pc(e.senda_anual, 1), pc(e.necesaria, 1), e.banda[MT.desde] ? `${fmt(e.banda[MT.desde][0])}-${fmt(e.banda[MT.desde][1])}` : "—"]), i => i === 0)}
<ul><li><b>La senda és una proposta nostra</b>: la mateixa baixada en percentatge cada any, fins a arribar a la meta en 2030. No és del Pla.</li>
<li><b>La línia base i la senda les hauria de fixar l'Ajuntament.</b> Si en fixa unes altres, l'observatori les canviarà.</li>
<li>${E1["año"]} queda com a alternativa a la vista, però ja no és la comparació principal.</li></ul>
<h3>Com comptem</h3>
<p>Cada sinistre amb almenys una bici o un patinet, situat o no en el mapa, compta <b>una vegada</b>: en ${B}, ${fmt(E0.base)}, i la meta, ${fmt(E0.meta)}. Les taules del Pla compten per vehicle (bici i VMP per separat), així que un xoc bici–patinet compta dues vegades (${fmt(MT.vehiculo.dobles)} en ${B}). Amb eixe criteri, la base seria ${fmt(MT.vehiculo.base)} i la meta, ${fmt(MT.vehiculo.meta)}.</p>
<h3>Com es jutja cada any</h3>
<p>Encara que el Pla anara exactament per la senda, el nombre de sinistres d'un any variaria per atzar. Per això no comparem amb la xifra exacta de la senda, sinó amb un <b>marge</b>: el 95 % dels valors que donaria l'atzar al voltant de la senda. Hi ha tres resultats, que es calculen amb les dades:</p>
<ul><li><b>«per davall de la senda»</b>: menys sinistres que el mínim del marge;</li>
<li><b>«no es pot descartar que vaja al ritme»</b>: dins del marge (no vol dir que hi vaja);</li>
<li><b>«per damunt de la senda»</b>: més que el màxim del marge.</li></ul>
<p>Per a ${MT.desde}, la senda marca ${fmt(E0.senda[MT.desde])}, i el marge va de ${fmt(E0.banda[MT.desde][0])} a ${fmt(E0.banda[MT.desde][1])}. A més, cada any es compara amb la base, amb el seu marge d'error (interval de confiança).</p>
<p>Ara mateix: <b>${E0.evaluados.length ? JZ(E0, "va") : `el primer any del Pla, ${MT["año_plan"]}, encara no està publicat`}</b>. ${E0.evaluados.length ? `En ${A1} hi ha hagut ${fmt(M.bv[A1])} sinistres; la senda en preveu ${fmt(E0.senda[A1])}. Respecte a ${B}: ${fmt(E0.juicio[A1].base.razon * 100 - 100, 1)} % (interval de confiança ${fmt(E0.juicio[A1].base.ic[0] * 100 - 100, 1)} a ${fmt(E0.juicio[A1].base.ic[1] * 100 - 100, 1)} %). Amb la mitjana ${EM.etq}: ${JZ(EM, "va")}.` : `${B} és el punt de partida: ${fmt(E0.base)} sinistres${MT.max ? ", el pitjor any de la sèrie" : ""}, un ${pc(MT.previa)} més que en ${A0}. Encara no es pot avaluar el Pla.`}</p>
<h3>Dues sèries de control</h3>
<p>El nombre de sinistres pot canviar per coses que no són la seguretat de la bici i el patinet. Per això, al costat de la meta, publiquem dues sèries:</p>
${tabla("Sèries de control", ["Any", "Amb bici o patinet", "Dels quals, amb ferits", "Tots els sinistres de la ciutat", "Part de bici o patinet"],
  CT.años.map((a, i) => [a, fmt(CT.bv[i]), fmt(CT.bv_her[i]), fmt(CT.ciudad[i]), pc(CT.cuota[i], 1)]))}
<ul><li><b>Sinistres amb ferits</b> (tots menys «sense ferits»): depenen menys de com es registren. El sistema de registre de la Policia Local (SIASV) es va crear al juliol de 2024, i el que més creix en tota la ciutat són els sinistres sense ferits. Si baixa el total però no els sinistres amb ferits, probablement és el registre.</li>
<li><b>Part de tots els sinistres de la ciutat</b>: si baixa, la bici i el patinet milloren més que la resta del trànsit; si el total baixa però la part no, baixa tot igual.</li></ul>`,
tec:()=>`<p>Senda de l'any <i>a</i>: base × 0,5<sup>(a − any base) / (2030 − any base)</sup>. Baixada anual necessària: 1 − (meta / sinistres de ${A1})<sup>1 / (2030 − ${A1})</sup>. Meta = base / 2, arredonida a l'enter més pròxim. L'any base es canvia en un sol paràmetre (<code>AÑO_BASE</code> de <code>scripts/exportar_web.py</code>) i el fan servir l'observatori, l'informe i esta pàgina.</p>
<p>Marge de cada any: les xifres x per a les quals l'interval de confiança del ${pc(MT.nivel)} de la raó x / base (<code>statsmodels confint_poisson_2indep</code>, mètode score) conté la raó que marca la senda. Així té en compte l'atzar de l'any i el de la base. No inclou la sobredispersió (variació entre anys més enllà de l'atzar), així que un any «compatible» no prova que el Pla funcione. Abans el marge només comptava l'atzar de l'any (<code>poisson.ppf</code>) i era més estret. Comparació amb la base: raó de taxes amb <code>statsmodels.stats.rates.test_poisson_2indep</code> (prova <i>score</i>) i el seu interval de confiança. Amb la mitjana ${EM.etq} com a base, la base són els ${EM.años.length} anys junts (exposició ${EM.años.length}). Codi: <code>scripts/meta.py</code>; <code>make comprobar</code> prova el juí amb un any simulat.</p>
<p>Amb la base alternativa (${E1["año"]}), ${A1} quedaria ${fmt(E1.sobre)} sinistres per damunt de la seua senda (${fmt(E1.senda_ult)}; marge ${fmt(E1.banda[A1][0])}-${fmt(E1.banda[A1][1])}): ${JZ(E1, "va")}. Caldria baixar un ${pc(E1.necesaria, 1)} cada any des de ${MT.desde}.</p>
<p>La meta global del Pla (apartat 4.4) és una altra: −50 % de persones mortes respecte a 2019 i de ferides greus respecte a 2024, per a tots els col·lectius. L'indicador de l'acció 3.2.2 és de sinistres, no de víctimes.</p>`},

uso:{h:"Ús i sinistres",
cos:()=>`<p>Més sinistres no vol dir per força més perill: pot ser que hi haja més gent en bici i en patinet. Ho mirem amb els comptadors del carril bici.</p>
<p><b>Tampoc és una pujada pròpia de la bici i el patinet.</b> Tots els sinistres de la ciutat passen de ${fmt(M.todos[A0])} en ${A0} a ${fmt(M.todos[A1])} en ${A1} (${pc(M.todos[A1] / M.todos[A0] - 1, 1)} més), i els que porten bici o patinet, de ${fmt(M.bv[A0])} a ${fmt(M.bv[A1])} (${pc(M.bv[A1] / M.bv[A0] - 1, 1)}): la seua part es queda en el ${pc(M.bv[A0] / M.todos[A0], 1)} en ${A0} i el ${pc(M.bv[A1] / M.todos[A1], 1)} en ${A1}. El que sí és propi és la composició: el patinet puja un ${pc(M.vmp[A1] / M.vmp[A0] - 1)} i la bici ${M.bici[A1] < M.bici[A0] ? "baixa" : "puja"} un ${pc(Math.abs(M.bici[A1] / M.bici[A0] - 1))}.</p>
<p>Una part de la pujada pot vindre de com es registren els sinistres: el que més creix en tota la ciutat són els sinistres sense ferits (+${pc(VAR(SINH), 0)}), i el Pla explica que el sistema de registre de la Policia Local (SIASV) es va crear al juliol de 2024, després d'integrar i normalitzar totes les fonts. Amb ferits, els sinistres amb bici o patinet sí que creixen més que la resta: un ${pc(VAR(CT.bv_her), 0)} més, davant d'un ${pc(VAR(CT.resto_her), 0)}. Són les sèries de control de la meta (apartat «La meta i la línia base»).</p>
<p>En els <b>${fmt(M.uso_n)} comptadors</b> que tenen dades de trànsit tots els anys (${UA0}-${UA1}), el trànsit passa de 100 en ${UA0} a <b>${fmt(M.uso_ix[UA1])}</b> en ${UA1}. Els sinistres amb bici o patinet, de 100 a <b>${fmt(M.sin_ix[UA1])}</b>.${UA1 < A1 ? ` Les dades de trànsit de Mobilitat arriben fins a ${UA1} i les de sinistres, fins a ${A1}: per això la comparació amb l'ús acaba en ${UA1}.` : ""}</p>
${tabla(`Índexs, ${UA0} = 100`, ["Any", "Trànsit en el carril bici", "Sinistres amb bici o patinet"], M.anys.filter(a => a >= UA0).map(a => [a, fmtU(M.uso_ix[a]), fmtU(M.sin_ix[a])]))}
<p>En ${UA1}, el trànsit ${varU(M.uso_ult, "va")} i els sinistres ${varS("va")}${parU("va")}.</p>
<p><b>La meta del Pla es mesura en nombre de sinistres, no en sinistres per viatge.</b> Si l'ús creix, el risc de cada viatge ha de baixar més de la meitat:</p>
<ul><li>si l'ús es queda com en ${UA1}, el risc per viatge hauria de baixar un <b>${pc(M.riesgo.igual)}</b> respecte a ${B};</li>
<li>si continua creixent com fins ara (${pc(M.uso_g, 1)} l'any), un <b>${pc(M.riesgo.sigue)}</b>.</li></ul>
<p class="aviso">Els comptadors estan en el carril bici: no veuen qui va per la calçada, pels ciclocarrers o pel Túria. I probablement compten bicis i patinets junts, sense separar-los. Són escenaris, no prediccions.</p>`,
tec:()=>`<p>IMD (intensitat mitjana diària) de dies laborables, per mes, dels fulls de càlcul de Mobilitat. Mitjana dels mesos amb dada (> 0), amb un mínim de 6 mesos per any. Cada comptador (codi P) se situa amb el camp <code>idpm</code> de la capa 225. Índex = suma de la IMD dels ${fmt(M.uso_n)} comptadors amb dada tots els anys amb intensitats (${UA0}-${UA1}) / suma de ${UA0}.</p>
<p>Escenaris: ús ${MT["año_meta"]} / ús ${B} = ${UA1 !== B ? `(índex ${UA1} / índex ${B}) × ` : ""}(1 + g)<sup>${MT["año_meta"]} − ${UA1}</sup>, on g és el creixement anual mitjà de ${UA0}-${UA1} (${pc(M.uso_g, 1)}) o g = 0 (l'ús es queda igual). Baixada necessària del risc per viatge = 1 − 0,5 / (ús ${MT["año_meta"]} / ús ${B}). En els dos escenaris, l'ús de ${MT["año_meta"]} és ${fmt(M.uso30.igual, 2)} i ${fmt(M.uso30.sigue, 2)} vegades el de ${B}.</p>`},

lugares:{h:"Llocs amb més sinistres",
cos:()=>`<p>Un «lloc» és una <b>cruïlla</b> o un <b>tram de carrer</b>, no un quadrat fix del mapa:</p>
<ul><li><b>Cruïlla</b>: cada encreuament del carrerer municipal. Els encreuaments a menys de ${LG.F} m (les dues calçades d'una avinguda, un carrer que entra desplaçat) fan una sola cruïlla. Les rotondes i places de fins a ${LG.plaza_max} m (${fmt(LG.n_plazas)} en tota la ciutat) són una sola cruïlla; les places grans, com la de l'Ajuntament o la d'Amèrica, no: cada entrada és una cruïlla amb el seu semàfor, i fondre-les crearia un lloc que guanya només per ser gran. La cruïlla inclou ${LG.R} m al voltant.</li>
<li><b>Tram</b>: la resta de cada carrer, en trossos iguals de ${LG.pieza} m com a màxim. Les dues calçades d'una avinguda fan un sol tram.</li>
<li>Cada sinistre va a la cruïlla si està a ${LG.R} m o menys; si no, al tram més pròxim.</li></ul>
<p>Així, la ciutat té ${fmt(LG.n_nudos)} cruïlles i ${fmt(LG.n_tramos)} trams. El ${pc(LG.en_nudo / LG.n_geo)} dels sinistres situats cau en una cruïlla. Els <b>${M.n_neg}</b> llocs amb més sinistres de ${A0} a ${A1} són els «llocs amb més sinistres» del mapa: ${M.tipos30.tramo ? `${M.tipos30.nudo} cruïlles i ${M.tipos30.tramo} trams` : "totes són cruïlles"}. El tram amb més sinistres en té ${LG.tramo_max.n} (és el lloc n.º ${LG.tramo_max.rank}).</p>
<h3>Per què ja no fem quadrats de 100 m</h3>
<p>Fins al novembre de 2026, els llocs eren els quadrats d'una quadrícula de 100 m. La llista depenia d'on queien les línies: si movíem la quadrícula entre 25 i 75 m, dels 30 llocs se'n mantenien entre ${ES.rejilla.ret[0]} i ${ES.rejilla.ret[1]}. Amb cruïlles i trams, si canviem els ${LG.R} m del voltant o la distància per a fondre encreuaments (20 o 40 m en lloc de 30), se'n mantenen entre ${ESmin()} i ${ESmax()}. A més, una cruïlla és on es pot actuar.</p>
${tabla("Estabilitat dels 30 llocs amb més sinistres", ["Variant", "Llocs que es mantenen (de 30)", "Sinistres en comú (índex de Jaccard: 1 = iguals)"],
  [["Quadrícula de 100 m, desplaçada 25-75 m (15 variants)", `${ES.rejilla.ret[0]}-${ES.rejilla.ret[1]}`, `${fmt(ES.rejilla.jac[0], 2)}-${fmt(ES.rejilla.jac[1], 2)}`],
   ...ES.variantes.map(v => [`Cruïlles i trams: ${v.R !== LG.R ? `${v.R} m al voltant (en lloc de ${LG.R})` : `fondre a ${v.F} m (en lloc de ${LG.F})`}`, v.ret, fmt(v.jac, 2)])])}
<p>Un matís: per a situar les cruïlles grans usem també els punts on el nostre programa de localització (el geocodificador) situa els sinistres de cruïlla de tota la ciutat (de tots els vehicles, no només de bici o patinet). Són posicions, no recomptes: en les cruïlles grans, com Abril Martorell amb Malilla, el punt del geocodificador queda a 30-100 m de l'encreuament del carrerer. Com que són de tots els sinistres, no trien els llocs pel resultat.</p>
<h3>Correcció per la cobertura</h3>
<p>Cada any se situen més sinistres, i no igual els de cruïlla que els de portal. Per a no afavorir els anys recents, cada sinistre pesa 1 / (part situada dels sinistres amb bici o patinet del seu any i tipus d'adreça):</p>
${tabla("", ["Any", "Cruïlla: part situada", "Pes", "Portal: part situada", "Pes"], M.anys.map(a => [a, pc(M.cobd[a].cruce, 1), fmt(M.pesos[a].cruce, 2), pc(M.cobd[a].portal, 1), fmt(M.pesos[a].portal, 2)]))}
<p>Amb pes o sense, la llista quasi no canvia: coincideixen <b>${M.igual_sinpeso} de ${M.n_neg}</b>. Si els triàrem només amb ${EPA}, en canviarien ${M.cambia_A}: per això usem tot el període.</p>
<p class="aviso">Des de juliol de 2024 la policia anota més sinistres pel número de portal i menys «en la cruïlla». Un sinistre al costat d'una cruïlla pot passar de la cruïlla al tram del costat sense que hi canvie res. El pes corregeix poc aquest canvi; per això les barres per any de cada fitxa porten un avís.</p>
<h3>Es repeteixen?</h3>
<p>Un lloc pot entrar en la llista per un mal any. Per a saber-ho sense fer trampa, triem els ${PS.ab.k} llocs <b>només amb ${EPA}</b> i mirem què hi passa <b>en ${EPB}</b>. Ho comparem amb dues referències: <b>si cada lloc mantinguera el seu ritme</b> (l'atzar fa que, encara així, els triats en el seu pitjor moment baixen una mica) i <b>llocs qualssevol</b> (de tota la ciutat o del mateix barri).</p>
${tabla("Triats amb uns anys, mirats en uns altres (sinistres corregits per la cobertura)", ["Triats amb → mirats en", "Llocs", "Abans", "Després", "Si mantingueren el seu ritme (90 %)", "Llocs qualssevol", "Qualssevol del mateix barri"],
  PS.todas.map(p => [p.corte === "AB" ? `${EPA} → ${EPB}` : `${mes(M.anys[0] + "-01")}-${mes(mesAnt(C7))} → ${mes(C7)}-${mes(A1 + "-12")}`, p.k, fmt(p.A), fmt(p.obs), `${fmt(p.perf)} (${fmt(p.perf_lo)}-${fmt(p.perf_hi)})`, fmt(p.glob), fmt(p.loc)]), i => PS.todas[i].k === PS.ab.k)}
<p>Els ${PS.ab.k} primers de ${EPA} sumen ${fmt(PS.ab.A)} sinistres; en ${EPB}, <b>${fmt(PS.ab.obs)}</b>. És el que s'espera si cada lloc mantinguera el seu ritme (entre ${fmt(PS.ab.perf_lo)} i ${fmt(PS.ab.perf_hi)}): la baixada és, sobretot, tornada a la mitjana. Llocs qualssevol en sumarien uns ${fmt(PS.ab.glob)}, i llocs qualssevol del mateix barri, ${fmt(PS.ab.loc)}. Tallant al juliol de 2024, quan canvia el format de l'adreça, el resultat és el mateix. ${PS.top_ab} dels ${PS.ab.k} primers de ${EPA} continuen entre els ${PS.ab.k} primers de ${EPB}.</p>
<p class="aviso">Superar «llocs qualssevol» és fàcil: la majoria de cruïlles i trams no tenen cap sinistre. La comparació exigent és amb «si mantingueren el seu ritme». ${PSbajo().length ? `Hi ha excepcions: ${PSbajo().map(p => `els ${p.k} primers (${p.corte === "AB" ? `${EPA} → ${EPB}` : "tall de juliol de 2024"})`).join(" i ")} queden una mica per davall del seu interval, coherent amb el canvi de format de 2024, que fa que les cruïlles perden casos cap als trams.` : ""}</p>
<h3>El Jardí del Túria, com a zona</h3>
<p>El Pla posa el Jardí del Túria com a «carrer» n.º ${M.tur.pr} en sinistres amb bici. Però els seus <b>${fmt(M.tur.n)}</b> sinistres no porten un punt exacte («JARDÍN DEL TURIA», «S/N»): ${M.tur.geo === 0 ? "cap no es pot situar" : `només ${fmt(M.tur.geo)} es poden situar`}. Per això el mostrem com a <b>zona</b>: la xarxa ciclista del jardí amb un marge de ${M.tur.buffer} m, amb tots els seus sinistres. Només comptem el jardí: no la Gran Via Marqués del Túria ni el carrer Camp de Túria.</p>
<h3>Límits</h3>
<ul><li><b>No és risc per ús.</b> Un lloc pot tindre molts sinistres perquè hi passa molta gent.</li>
<li><b>La posició tendeix a concentrar-se en el centre de la cruïlla.</b> Tots els sinistres d'una cruïlla van al mateix punt. En els ${M.n_neg} llocs, el ${pc(M.cruce_30)} dels sinistres estan situats com a cruïlla; en tota la ciutat, el ${pc(M.cruce_ciudad)}.</li>
<li><b>Des de juliol de 2024 la policia anota menys sinistres «en la cruïlla»</b> i més per número de portal. Una cruïlla pot perdre casos sense que canvie res. És el cas de l'Albereda amb Saragossa: la seua cruïlla baixa, però en tot el passeig els sinistres amb bici o patinet quasi no canvien (${M.ala_paseo.map((v, i) => `${M.anys[i]}: ${fmt(v)}`).join("; ")}). A més, el lloc es va triar per ser el pitjor, i un lloc així sol millorar una mica per si sol. Sense un grup de comparació no atribuïm cap canvi a una obra.</li>
<li><b>El nom de cada lloc ve del carrerer</b> (nom oficial i tipus de via abreujat), no de l'adreça més repetida, que de vegades era un portal. Cruïlla: els dos carrers que hi passen i que més anomenen les adreces de tots els sinistres del lloc (de qualsevol vehicle); en una rotonda o plaça xicoteta, el nom de la plaça, si l'anomenen almenys el ${pc(LG.plaza_votos)} dels seus sinistres. Tram: el carrer i els que el tanquen. Quan dos llocs es dirien igual (les dues calçades d'una avinguda), s'hi afig on és cadascun (N, S, E, O). Amb només ${EPA} o només ${EPB}, ${LG.nombres.top} dels ${LG.nombres.k} primers es dirien igual; en els altres canvia algun carrer de la mateixa cruïlla, o només la lletra de posició.</li>
<li><b>Els noms publicats no canvien en silenci.</b> Un nom publicat és una referència (fitxes, enllaços, premsa). Es guarden en <code>data/processed/nombres_lugares.csv</code> amb la posició de cada lloc i, quan arriben dades noves, un lloc del mateix tipus (i, si és un tram, de la mateixa via) a ${LG.congela_tol} m o menys conserva el nom guardat; els llocs nous reben el nom calculat i s'hi afigen. Si en un dels ${M.n_neg} primers el nom calculat ja no coincideix amb el publicat, ho decideix una persona i, si es canvia, queda en el <a href="cambios.html">registre de canvis</a>.</li></ul>`,
tec:()=>`<p>Càlcul en EPSG:25830 amb geopandas, shapely i scipy; el codi és comú per a l'anàlisi i la web (<code>scripts/lugares.py</code>; l'anàlisi, en <code>scripts/lugares_nudos.py</code>). Llavors de cruïlla: els ${fmt(LG.n_nodos)} nodes de grau 3 o més del graf de carrers (<code>ejes.geojson</code>, ja trossejat en els encreuaments) i els punts de cruïlla del geocodificador de tots els sinistres de la ciutat: ${fmt(LG.n_semillas)} llavors. Fusió: <i>buffer</i> de F/2 i dissolució (F = ${LG.F} m, enllaç simple). Rotondes: places (PLAÇA) de diàmetre ≤ ${LG.plaza_max} m amb les llavors a ≤ F/2, sense encadenar. Zona de la cruïlla: envolupant convexa de les seues llavors + R (R = ${LG.R} m). Trams: la resta de cada via, en peces iguals de ≤ ${LG.pieza} m; les peces de la mateixa via amb el punt mitjà a ≤ ${LG.paralela} m s'agrupen per enllaç complet (no encadena). Ordre: suma de pesos i, en empat, nombre de sinistres. El mapa dibuixa la zona de la cruïlla o la línia del tram.</p>
<p>Persistència: s'ordena amb el període A (pesos) i es mesura la suma ponderada en B dels K primers, entre tots els ${fmt(LG.n_unid)} llocs del carrerer (també els que no tenen cap sinistre). Llocs qualssevol: ${fmt(PS.nsim)} permutacions dels valors de B, en tota la ciutat i dins de quadrats de ${PS.bloque} m («mateix barri»); en tots els casos, p &lt; 0,001. «Si mantingueren el seu ritme»: cada lloc conserva el seu total i el reparteix entre A i B amb una binomial (proporció del seu tipus); en cada simulació es tornen a triar els K primers amb A i se'n mesura B (interval del 90 %).</p>
<p>Pista («a revisar»): prova binomial unilateral de cada categoria «amb qui» davant de la resta de llocs del mateix tipus, sense el lloc (cruïlles: vehicle ${pc(PI.ref.nudo.m)}, vianant ${pc(PI.ref.nudo.w)}, entre bicis o patinets ${pc(PI.ref.nudo.d)}, sol ${pc(PI.ref.nudo.s)}; trams: ${pc(PI.ref.tramo.m)}, ${pc(PI.ref.tramo.w)}, ${pc(PI.ref.tramo.d)} i ${pc(PI.ref.tramo.s)}); el Túria, davant de la resta de la ciutat. Holm sobre les ${PI.familia} proves del mapa (4 per lloc; els llocs amb menys de ${PI.min} sinistres compten com p = 1): ${PI.probadas} proves en ${PI.lugares_prob} llocs, i en passen ${PI.holm}. És un indici per a una visita, no un diagnòstic.</p>
<p>Zona del Túria: trams de tipus «Jardín del Turia» (estat 4) de la capa 189, amb un marge de ${M.tur.buffer} m, i text de l'adreça amb la frase completa («JARDÍN DEL TURIA», «CAUCE DEL TURIA»…). ${M.dup_turia ? `${M.dup_turia} sinistres del Túria compten també en un dels ${M.n_neg} llocs.` : `Cap sinistre del Túria compta també en un dels ${M.n_neg} llocs.`}</p>`},

normal:{h:"Per damunt de la mitjana dels punts amb un trànsit semblant",
cos:()=>`<p>En <b>${EB.sitios} punts de comptatge</b> sabem quantes bicis passen (${EB.cont} comptadors). Els comptadors que miren el mateix lloc fan un sol punt: els que estan a menys de ${EB.agrupa} m i els del mateix tros de carrer sense cap encreuament entre ells, com els dos sentits del pont de l'Assut de l'Or, que abans eren dos punts. Això ens permet comparar cada punt amb altres de trànsit semblant.</p>
<ol><li>Cada sinistre va al punt de comptatge més pròxim, si està a ${EB.radio} m o menys.</li>
<li>Un model estadístic calcula quants sinistres té, de mitjana, un punt amb eixe trànsit de bicis i de cotxes i amb tants <b>encreuaments de carrers</b> a ${EB.radio} m: és <b>«la mitjana dels punts amb un trànsit semblant»</b>.</li>
<li>Ajustem el recompte (Bayes empíric): si un punt té pocs sinistres, ens fiem més de la mitjana; si en té molts, més del seu propi recompte.</li>
<li>Calculem la <b>probabilitat d'estar per damunt d'eixa mitjana</b> comptant els sinistres a ${R3("va")} m, cada distància amb el seu model.</li>
<li>Ho repetim per a la <b>bici</b> i per al <b>patinet</b> per separat.</li></ol>
${tabla("Tres nivells", ["Nivell", "Probabilitat d'estar per damunt de la mitjana", "Punts"], [
  ["Clarament per damunt de la mitjana dels punts amb un trànsit semblant", `més de 0,95 a ${R3("va")} m`, fmt(EB.alta)], ["Potser per damunt", `més de 0,80 a ${EB.radio} m`, fmt(EB.quiza)], ["Com la mitjana", "la resta", fmt(resto)]])}
<p>Clarament per damunt (sinistres / mitjana dels punts amb un trànsit semblant): ${CLARO("va")}.</p>
<p><b>Per què aquest criteri:</b></p>
<ul><li><b>Els encreuaments.</b> Molts sinistres se situen al centre de l'encreuament. Un comptador a meitat d'illa té pocs encreuaments dins del cercle de ${EB.radio} m; un al costat d'una plaça, molts. Sense tenir-ho en compte, part de l'«excés» era només això. Amb els encreuaments el model millora clarament (${pval(CRN.p)}), i els punts amb una probabilitat de més de 0,95 a ${EB.radio} m passen de ${CR0.p95} a ${CRN.p95}.</li>
<li><b>Que no depenga de la distància.</b> Amb només ${EB.radio} m, ${RG.p1_100} punts superen 0,95, però la llista canvia molt si es compten els sinistres a 75 o a 150 m (les llistes s'assemblen poc: índex de Jaccard de ${fmt(EB.jaccard["75"], 2)} i ${fmt(EB.jaccard["150"], 2)}, on 1 vol dir idèntiques). Per això demanem que es mantinga amb les tres distàncies: en queden ${EB.alta}.</li>
<li><b>Per damunt de la mitjana no vol dir anomalia.</b> El model ja preveu que els punts varien entre ells: d'entrada, el ${pc(SIM.a_priori_1)} està per damunt de la mitjana. Si simulem ${fmt(EB.crit.n_sim)} vegades la ciutat només amb eixa variació, sense cap punt «especial», ixen de mitjana ${fmt(SIM.p1, 1)} punts amb probabilitat de més de 0,95 a ${EB.radio} m (n'observem ${SIM.obs_p1}), i quasi cap dels marcats no està en realitat per davall de la mitjana (${fmt(SIM.fd1, 1)}). «Clarament» vol dir, doncs, que el punt està per damunt de la mitjana, no que siga una anomalia. Si demanem almenys un ${pc(EB.crit.umbral - 1)} més que la mitjana, en queden ${RG.pu_100} a ${EB.radio} m i ${RG.pu_3r} amb les tres distàncies: les dades no permeten parlar de punts anòmals.</li>
<li><b>Bici i patinet per separat.</b> Amb el model de només bici, ${EB.bici_p95} punts superen 0,95 a ${EB.radio} m i ${EB.bici_claro} ho fan amb les tres distàncies; amb el de només patinet, ${EB.vmp_p95} i ${EB.vmp_claro}. Dels ${EB.alta} punts clarament per damunt, en ${DG.claro_solo_vmp} l'excés és només de patinet (amb la bici estan com la mitjana). Com que no sabem si els comptadors compten patinets, aquest excés pot ser només que hi passen més patinets dels que el comptador veu. Cada fitxa ho diu.</li>
<li>Només cobreix els sinistres pròxims a un comptador: ${fmt(EB.asig)} de ${fmt(EB.geo)} situats (${pc(EB.asig / EB.geo)}).</li>
<li><b>No prediu millor que el simple recompte.</b> Si ordenem amb dos anys i mirem els altres dos, el mètode guanya al recompte en ${V.top10.eb_gana} de ${V.particiones} combinacions.</li>
<li>Suposem que els comptadors compten <b>bicis i, probablement, també patinets</b>, sense separar-los. Mobilitat no ho ha confirmat.</li>
<li>No és un risc per persona. Entre punts de comptatge, els que tenen el doble de trànsit no tenen el doble de sinistres (elasticitat de ${fmt(EB.elast, 2)}; amb 1, els sinistres creixerien en la mateixa proporció que el trànsit). Amb només bici la diferència quasi desapareix (${fmt(EB.elast_bici, 2)}, compatible amb 1), així que pot vindre de la barreja de bicis i patinets que compten els comptadors. És una associació entre punts: no diu què passarà si creix el trànsit d'un punt.</li>
<li>La franja del gràfic de l'informe és la <b>variació habitual entre punts amb un trànsit semblant</b>, segons el mateix model (95 %): ${EB.banda.encima} punts en queden per damunt i ${EB.banda.debajo} per davall. El color dels punts segueix la regla de la taula, no la franja.</li></ul>`,
tec:()=>`<p><b>Model</b> (statsmodels): binomial negativa (NB2) per punt i any, log μ = b<sub>0</sub> + b<sub>1</sub> log IMD bici + b<sub>2</sub> log IMD vehicles + b<sub>3</sub> log(1 + encreuaments) + indicador «sense tram aforat» + efecte d'any. IMD de vehicles: màxim dels trams a ${EB.radio} m o menys, només ${M.imd_veh}. Elasticitat de la IMD bici: ${fmt(EB.elast, 2)} (amb només bici, ${fmt(EB.elast_bici, 2)}, compatible amb 1; és una elasticitat entre punts, no dins de cada punt); b<sub>3</sub> = ${fmt(EB.cruces_coef, 2)}; α = ${fmt(EB.alpha, 3)} (bici, ${fmt(EB.alpha_bici, 3)}; patinet, ${fmt(EB.alpha_vmp, 3)}). Els efectes d'any no es publiquen: recullen també la cobertura creixent del mapa.</p>
<p><b>Encreuaments</b>: nodes de grau 3 o més del graf de carrers (<code>ejes.geojson</code>; ${fmt(EB.crit.nodos)} a tota la ciutat) a ${EB.radio} m o menys del punt (en cada radi, els del seu radi); mediana de ${fmt(CR.mediana)} per punt (de ${CR.rango[0]} a ${CR.rango[1]}). No usen cap sinistre. Comparació amb el model sense encreuaments (raó de versemblança, 1 gl): nodes, LR = ${fmt(CRN.lr, 1)} (${pval(CRN.p)}; AIC ${fmt(CRN.aic, 1)} davant de ${fmt(CR0.aic, 1)}); nusos de <code>scripts/lugares.py</code> fets només amb el carrerer (els nodes fosos a 30 m; ${fmt(EB.crit.nudos)}), LR = ${fmt(CRF.lr, 1)} (AIC ${fmt(CRF.aic, 1)}); nusos de la web, que hi afigen els punts de cruïlla del geocodificador (és a dir, posicions de sinistres), LR = ${fmt(CRW.lr, 1)} (AIC ${fmt(CRW.aic, 1)}). Triem els nodes: no depenen dels sinistres i ajusten molt millor que els nusos fosos, perquè en fondre es perd la mida de l'encreuament (una cruïlla d'avinguda amb dues calçades i carril bici té diversos nodes, i més punts de conflicte). El semàfor a ${EB.radio} m no millora el model.</p>
<p><b>Bayes empíric</b> (Hauer; Highway Safety Manual, cap. 9): w = 1 / (1 + α Σμ); EB = w Σμ + (1 − w) ΣN. Probabilitat d'excés: P(θ > 1) amb la posterior gamma(1/α + N, 1/α + Σμ) (scipy); també P(θ > ${fmt(EB.crit.umbral, 1)}). La posterior tracta μ i α com a coneguts.</p>
<p><b>Calibratge per simulació</b> (${fmt(EB.crit.n_sim)} vegades, amb μ i α fixos): θ<sub>i</sub> ~ gamma(1/α, α) i N<sub>iy</sub> ~ Poisson(θ<sub>i</sub> μ<sub>iy</sub>). Regla P(θ > 1) > 0,95 a ${EB.radio} m: s'esperen ${fmt(SIM.p1, 1)} punts, dels quals ${fmt(SIM.fd1, 1)} amb θ < 1; s'observen ${SIM.obs_p1}. Regla P(θ > ${fmt(EB.crit.umbral, 1)}) > 0,95: s'esperen ${fmt(SIM.pu, 1)} i s'observen ${SIM.obs_pu}.</p>
<p><b>Franja</b> del gràfic: quantils 2,5 % i 97,5 % de la predictiva del model, NB(1/α, Σμ) (el total dels anys d'un punt amb θ fix).</p>
<p>Un punt-any només compta si tots els seus comptadors tenen dada: ${EB.na4} de ${EB.sitios} punts tenen tots els anys amb intensitats (${M.anys_eb[0]}-${M.anys_eb[M.anys_eb.length - 1]}).</p>
<p><b>Punts de comptatge</b>: s'ajunten els comptadors a menys de ${EB.agrupa} m i els del mateix enllaç d'una via: el mateix carrer (eix més pròxim a ≤ ${EB.enlace.via_tol} m), a ≤ ${EB.enlace.misma_via} m i sense cap node de grau 3 o més en un passadís de ${EB.enlace.pasillo} m a cada costat del segment que els uneix (amb 10 m hi passaven parelles de blocs diferents de Blasco Ibáñez, perquè el segment va pel bulevard). Així s'ajunten ${EB.enlace.enlace.map(g => g.join(" + ")).join("; ")}. IMD del punt: la suma dels seus comptadors, llevat que un del mateix enllaç diga «ambdós sentits», que ja ho compta tot (${EB.enlace.ambos.join(", ")}: sumar-los duplicaria la IMD). Zona del punt: la unió dels cercles dels seus comptadors; cada sinistre va al comptador més pròxim i compta per al seu punt, de manera que cap sinistre no compta en dos punts. Amb el centre, el cercle de l'Assut quedaria al mig del pont, a 164 m de cada comptador, i deixaria fora els dos extrems.</p>
<p><b>Validació fora de mostra</b> sense fuga: les ${V.particiones} particions dels quatre anys en 2 + 2; s'ordena amb un model ajustat només amb els dos primers i es mesura l'excés en els altres dos. Top 10: el mètode supera el recompte en ${V.top10.eb_gana} de ${V.particiones}; diferència per bootstrap pareat de punts (IC 95 %) de ${fmt(V.top10.ic95[0], 1)} a ${fmt(V.top10.ic95[1], 1)} sinistres, que inclou el zero. Spearman mitjà entre l'excés estimat i el que es veu després: ${fmt(V.spearman_AB, 2)}. Codi: <code>scripts/cribado_eb.py</code>.</p>`},

plan:{h:"Què diu el Pla",
cos:()=>`<p>Hem transcrit el Pla Director de Seguretat Viària 2026-2030: <b>${M.plan.ind} indicadors</b> i <b>${M.plan.lugares} llocs</b> que cita (${M.plan.diag} com a diagnòstic i ${M.plan.act} amb una actuació). Dels indicadors, amb dades obertes en podem calcular ${M.plan.calc["sí"]}, ${M.plan.calc.parcial} en part i ${M.plan.calc.no} no.</p>
<h3>Quan diem que el Pla «cita aquest lloc»</h3>
<p>L'anell del mapa té tres nivells (fins al 04/11/2026, el tercer era un anell discontinu, que costava distingir del de punts):</p>
<ul><li><b>Continu, «el Pla cita aquest lloc»</b>: nomena eixa cruïlla o plaça (o la zona, com el Túria), amb actuació o sense.</li>
<li><b>De punts, «el Pla només cita el seu carrer»</b>: el Pla nomena el seu carrer: en els rànquings de carrers amb més sinistres (amb patinet, amb bici o amb vianants) o per alguna actuació, com un radar. La fitxa de cada lloc explica el motiu.</li>
<li><b>Sense anell, «el Pla no l'esmenta»</b>: el Pla no nomena ni el lloc ni el seu carrer.</li></ul>
<p><b>Què no prova l'anell.</b> El Pla només publica els ${M.plan.pl3.top} primers de cada rànquing (encreuaments i carrers amb més sinistres amb patinet, amb bici i amb vianants). Que no esmente un lloc no vol dir que el desconega: potser és el quart de la seua llista. Per això demanem la llista completa.</p>
<p><b>Què no compta com a cita.</b> El Pla ha de nomenar el lloc o el seu carrer en un rànquing o amb una actuació. No compten una foto d'exemple (l'avinguda de Peris i Valero apareix només en una foto d'un pas de vianants accessible; per això el lloc de Peris i Valero amb la plaça de Manuel Sanchis Guarner figura com a «no l'esmenta») ni l'Anell Ciclista, que el Pla cita com la via ciclista amb més ús: és una infraestructura, no un rànquing de sinistres ni una actuació en eixe lloc.</p>
<h3>Diagnòstic no és actuació</h3>
<ul><li><b>Diagnòstic</b>: el Pla diu que el lloc té molts sinistres.</li>
<li><b>Actuació</b>: el Pla diu que s'hi ha fet o s'hi farà alguna cosa (auditoria, reordenació, radar o estudi).</li></ul>
${tabla(`Els ${M.plan.pl3.n} llocs amb més sinistres, segons el Pla`, ["El Pla…", "Llocs"], [
  ["cita aquest lloc", fmt(M.plan.pl3.lugar)], ["només cita el seu carrer", fmt(M.plan.pl3.calle)], ["no l'esmenta", fmt(M.plan.pl3.no)]])}
<p>Dels ${fmt(M.plan.pl3.lugar)} llocs citats, ${fmt(M.plan.pl3.lugar_act)} té a més una actuació (l'Albereda amb la plaça de Saragossa). ${M.plan.alguna} dels ${M.n_neg} apareixen en el Pla d'alguna manera, també en les llistes de vianants o amb un radar en el carrer.</p>`,
tec:()=>`<p>Transcripció: <code>scripts/transcribir_pdsv.py</code> → <code>data/processed/pdsv_indicadores.csv</code> i <code>pdsv_lugares.csv</code>. Si una cita és diagnòstic o actuació ho diu la columna <code>kind</code>, escrita a mà en llegir el Pla; no es dedueix del text.</p>
<p>Correspondència: cada lloc del Pla té unes paraules clau (sense accents, en majúscules); totes han d'aparéixer en alguna adreça dels sinistres del lloc. La regla de l'anell està en <code>scripts/exportar_web.py</code> i és la mateixa per a l'observatori i per a l'informe.</p>
<p>Tots els ${M.plan.lugares} llocs del Pla estan decidits: o tenen paraules clau (<code>CLAVES</code>) o un motiu per a no emparellar-los (<code>SIN_CLAVE</code>); si n'apareix un sense decidir, el script s'atura i <code>make comprobar</code> dona error. Sense paraules clau (${M.plan.sin_clave.length}):</p>
<ul>${M.plan.sin_clave.map(([n, m]) => `<li>${n}: ${m.va}.</li>`).join("")}</ul>
<p>Fins al 04/11/2026, 12 llocs no tenien paraules clau i se saltaven sense avís; per això el repartiment era 4 · 11 · 15 i, per exemple, Tres Creus amb Campos Crespo (n.º 3 dels encreuaments amb vianants del Pla) eixia com «no l'esmenta».</p>`},

gravedad:{h:"Gravetat",
cos:()=>`<p>El portal classifica cada sinistre per la seua lesió més greu: sense ferits, lleus, de baixa gravetat, greus i morts.</p>
<p>Durant 2023 es va aplicar a poc a poc el criteri estatal (Ordre INT/2223/2014): <b>ferit greu és qui està hospitalitzat més de 24 hores</b>. Abans, «greu» era només per a lesions molt severes. El mateix Pla ho explica.</p>
${tabla("Sinistres amb ferits greus", ["Any", "Tota la ciutat", "Amb bici o patinet"], M.anys.map(a => [a, fmt(M.grav_todos[a]), fmt(M.grav_bv[a])]))}
<p>El salt de ${fmt(M.grav_todos[A0])} a ${fmt(M.grav_todos[A1])} és, sobretot, el canvi de criteri. <b>Els ferits greus només són comparables des de 2024.</b> I no tota la gravetat s'ha estabilitzat: els sinistres «de baixa gravetat» amb bici o patinet encara pugen un ${pc(M.baja_bv[A1] / M.baja_bv[A1 - 1] - 1)} entre ${A1 - 1} i ${A1}, molt més que el total de sinistres. El mateix Pla en dona tres xifres per a 2024 (${M.plan_graves_2024.map(x => fmt(x)).join(", ")}), segons la font i segons si compta persones o sinistres.</p>
<p class="aviso">La gravetat és la del sinistre (inclou vianants i ocupants d'altres vehicles), no la de qui anava en bici o patinet.</p>`,
tec:()=>`<p>Categories del portal: SIN HERIDOS, CON HERIDOS LEVES, CON HERIDOS BAJA GRAVEDAD, CON HERIDOS GRAVES i CON FALLECIDOS. «Baixa gravetat» també creix any rere any (amb bici o patinet: ${M.anys.map(a => fmt(M.baja_bv[a])).join(", ")}), cosa que apunta a una reclassificació. Per això les comparacions de gravetat entre bici i patinet es fan dins de cada any.</p>`},

limites:{h:"El que no es pot saber amb estes dades",
cos:()=>`<ul><li><b>Si el patinet és més perillós que la bici per viatge.</b> No hi ha comptadors que els separen.</li>
<li><b>Persones.</b> El portal dona sinistres, no persones ferides, ni edat ni sexe.</li>
<li><b>Qui conduïa què o de qui és la culpa.</b> Els factors són del sinistre, no de cada vehicle.</li>
<li><b>El tipus de sinistre abans de ${TD}.</b> Ve complet ${TD === A1 ? "només en" : "des de"} ${TD}: en ${A0}, el ${pc(M.tipo_lleno[A0])}.</li>
<li><b>Els sinistres sense punt.</b> El ${pc(1 - M.cob_bv_tot)} no es poden situar, i el Túria només com a zona.</li>
<li><b>La gravetat abans de 2024</b>, per canvi de criteri.</li>
<li><b>L'ús fora del carril bici</b>: calçada, ciclocarrers i Túria.</li>
<li><b>Causes.</b> Si una obra o una norma ha fet baixar els sinistres, sense un grup de comparació.</li>
<li><b>Llocs dolents només per al patinet.</b> Amb pocs sinistres per lloc, no es detecta cap diferència. «No detectable» no vol dir «no existeix».</li>
<li><b>Els sinistres que no registra la Policia Local</b>, com moltes caigudes sense intervenció.</li>
<li><b>Si canvia quant es vigila o es denuncia.</b> Només entren els sinistres amb atestat, i això no afecta igual la bici i el patinet: caigudes sense atestat, controls al patinet, casc obligatori en patinet des de l'1 d'octubre de 2026 (<a href="https://www.boe.es/buscar/act.php?id=BOE-A-2026-13889">Real Decreto 518/2026</a>). Si canvia, pot canviar el nombre registrat sense que canvie el risc, i també la part de sinistres amb patinet.</li></ul>`,
tec:()=>`<p>Comparacions entre bici i patinet que sí es poden fer, condicionades al sinistre (proporcions entre sinistres, sense exposició): pluja, nit, tipus (${A1}) i gravetat dins de l'any. Codi: <code>scripts/vmp_vs_bici_condicionado.py</code>. A escala de cruïlla o tram, sense diferència detectable (<code>scripts/vmp_vs_bici.py</code>).</p>`},

errores:{h:"Errors detectats en les dades",
cos:()=>`<p>En treballar amb les dades de l'Ajuntament hem trobat <b>${INC.n}</b> incidències: files repetides, camps buits, canvis de criteri entre anys, dades que falten o fitxers difícils de reutilitzar. No és una crítica: les tenim en compte en l'anàlisi i les comuniquem a l'Ajuntament perquè es puguen corregir. Sense el portal de dades obertes, este observatori no seria possible.</p>
${tablaInc("Incidències en les dades de l'Ajuntament", ["Conjunt", "Què passa", "Com ho tractem", "Estat"])}
<p class="aviso">Estat: «Detectada» vol dir que encara no l'hem comunicada; després pot ser «Comunicada», «Amb resposta», «Corregida» o «No es corregirà».</p>
<p><b>Has vist un altre error en les dades o en esta web?</b> Escriu-nos a <a href="mailto:${CORREU}">${CORREU}</a>.</p>`,
tec:()=>`<p>Registre: <code>data/processed/incidencias_datos.csv</code>, amb l'exemple, l'abast, l'impacte, com ho tractem, el suggeriment i la prova reproduïble de cada incidència. <code>scripts/incidencias.py</code> (<code>make incidencias</code>) en torna a comprovar ${INC.auto} automàticament amb cada descàrrega de dades, per a saber si continuen o s'han corregit, i escriu l'informe per a l'Ajuntament; les altres ${INC.n - INC.auto} es comproven a mà. Cap exemple conté dades personals: són identificadors de fila o valors dels camps.</p>`},

revisiones:{h:"Revisions i reproducibilitat",
cos:()=>`<p>Hem fet revisions automàtiques pròpies: agents d'intel·ligència artificial llançats pel mateix projecte, que no veien les nostres notes, han recalculat les xifres des de les dades. No són una revisió externa.</p>
<h3>Què va canviar per la revisió independent</h3>
<ul><li>Retirem l'augment del patinet «amb el mateix ús»: estava inflat per la cobertura creixent del mapa.</li>
<li>Retirem la targeta que deia que en cap cruïlla el patinet ix pitjor: era falta de dades, no una prova.</li>
<li>Els llocs amb més sinistres es trien amb tot el període i amb pes per cobertura.</li>
<li>La marca «a revisar» de les fitxes només ix amb una prova estadística i amb prou casos.</li>
<li>El trànsit mitjà diari (IMD) de cada punt es divideix pels anys amb dada, no sempre per ${M.anys_eb.length}.</li>
<li>La línia base: primer 2024, l'any dels ferits greus; rellegit el text del Pla, passa a ${B}, l'últim any abans del Pla, i 2024 queda com a alternativa.</li></ul>
<h3>Què va canviar per la revisió de coherència</h3>
<ul><li>Túria: només el jardí. Abans hi entraven la Gran Via Marqués del Túria i el carrer Camp de Túria.</li>
<li>Un color, un significat, i l'ordre fix bici, patinet i xoc bici–patinet.</li>
<li>Termes únics en les dues pàgines: «llocs amb més sinistres», «el normal per al trànsit», «senda proposada».</li>
<li>L'anell del Pla, en tres nivells: cita el lloc, només cita el seu carrer o no l'esmenta.</li>
<li>Els tres nivells de «més del normal», iguals en l'observatori i en l'informe.</li></ul>
<h3>Què va canviar per la revisió metodològica</h3>
<ul><li>L'anell del Pla passa de 4 · 11 · 15 a 5 · 12 · 13 (cita el lloc · només el carrer · no l'esmenta), i amb els llocs per cruïlla i tram, a ${M.plan.pl3.lugar} · ${M.plan.pl3.calle} · ${M.plan.pl3.no}: alguns llocs del Pla se saltaven sense avís. I com que el Pla només publica els primers de cada llista, que no esmente un lloc no vol dir que el deixe fora.</li>
<li>La pujada de 2022-2025 es compara amb la de tota la ciutat, que és la mateixa.</li>
<li><b>Els llocs</b>: ja no són quadrats de 100 m, sinó cruïlles i trams de carrer, perquè la llista depenia de com es dibuixava la quadrícula (es mantenien entre ${ES.rejilla.ret[0]} i ${ES.rejilla.ret[1]} de 30; ara, entre ${ESmin()} i ${ESmax()}). Desapareix la marca «entre els primers en les tres etapes», que es mesurava amb les mateixes dades que trien els llocs; en el seu lloc, comprovem si es repeteixen en anys diferents dels que servixen per a triar-los. La marca «a revisar» es compara amb llocs del mateix tipus i amb una correcció per fer moltes proves alhora (Holm) en tot el mapa (passa de 8 llocs, amb el Túria, a ${M.pista.con.length ? new Set(M.pista.con.map(c => c[0])).size : 0}). L'anell del Pla s'ha recalculat amb els llocs nous. Les barres per any de les fitxes estan corregides per la cobertura.</li>
<li>L'Albereda amb Saragossa: la baixada de la seua cruïlla no s'atribueix a l'obra (canvi en com s'anota l'adreça i tornada a la mitjana).</li>
<li>Les fitxes ja no marquen «no es manté entre els primers»: és compatible amb un lloc que sí es repeteix.</li>
<li>«Més del normal» passa a «per damunt de la mitjana dels punts amb un trànsit semblant»; l'elasticitat és una associació entre punts.</li>
<li><b>Per damunt de la mitjana dels punts amb un trànsit semblant</b> (abans, «més del normal per al trànsit»): el model té en compte els encreuaments a ${EB.radio} m; «clarament» s'ha de mantindre comptant els sinistres a ${R3("va")} m (passen de 21 punts a ${EB.alta}); cada fitxa dona la bici i el patinet per separat i avisa quan l'excés és només de patinet (${DG.claro_solo_vmp} dels ${EB.alta}); la franja del gràfic és la variació entre punts semblants del mateix model, i no la del simple atzar (Poisson), que en deixava fora 46 de 145; i ja no es calculen els índexs d'any del model, que recollien la cobertura creixent del mapa.</li>
<li>Els exemples de l'informe es trien per regla: el punt amb més sinistres dels que estan com la mitjana, el «clarament» només de patinet amb més sinistres i el «clarament» que no és només de patinet amb menys sinistres. Abans eren Xàtiva amb Russafa, que ara és «potser», i Balaciart amb Primado Reig, que ja no es manté amb les tres distàncies.</li>
<li>El mapa diu «On s'acumulen», no «On actuar».</li>
<li><b>La meta</b>: es parla de «l'indicador de l'acció 3.2.2», no d'un compromís de la ciutat; s'avisa que ${B} és el pitjor any de la sèrie i es comprova amb la mitjana ${EM.etq} (meta ${fmt(EM.meta)}); s'explica el recompte per vehicle del Pla (meta ${fmt(MT.vehiculo.meta)}); cada any es jutja amb un marge de l'atzar (per davall, compatible o per damunt de la senda) i no amb la xifra exacta; i s'hi afigen dues sèries de control (amb ferits i part de la ciutat). ${E1["año"]} queda com a alternativa, no com a comparació principal.</li>
<li>Limitacions noves: la infradeclaració i la vigilància, diferents per a bici i patinet, i la «baixa gravetat» en ${A1}.</li></ul>
<h3>Reproducibilitat</h3>
<ul><li>El codi (scripts en Python que llegeixen les dades descarregades) es publicarà amb la versió definitiva; encara no és públic.</li>
<li><code>make</code> ho refà tot des de les dades; <code>make web</code> només la web.</li>
<li><code>make comprobar</code> revisa les dades noves (anys, cobertura, categories noves, totals comparats amb el Pla) i que la web tinga les mateixes claus en valencià i castellà.</li>
<li><b>Cap xifra calculada està escrita a mà</b>: les calcula <code>scripts/exportar_web.py</code>. Les excepcions són xifres transcrites i citades de documents: les del Pla Director (com els ferits greus de 2024), la de premsa sobre 2026 i els conteos manuals de patinets.</li></ul>`,
tec:()=>`${tabla("Versions", ["Programa", "Versió"], [["Python", M.python], ...Object.entries(M.libs)])}
<p>Informes: <code>docs/revision_independiente.md</code>, <code>docs/revision_coherencia.md</code> i <code>docs/revision_metodologica/</code>.</p>`},

futuro:{h:"Línies futures",
cos:()=>`<ul><li><b>Registre de vehicles personals lleugers de la DGT</b> (Reial Decret 52/2026). Si publica dades per municipi, servirà per a mesurar l'exposició del patinet: sinistres per patinet registrat.</li>
<li><b>Dades de ${A1 + 1}.</b> Quan el portal publique l'any complet, <code>make</code> l'afig sense tocar el codi i <code>make comprobar</code> avisa si canvia el format.${A1 + 1 === MT["año_plan"] ? " Serà el primer any del Pla, amb casc obligatori en patinet des d'octubre." : ""}</li>
<li><b>Coordenades en origen.</b> Si el portal publicara la posició de cada sinistre, el mapa no dependria de l'adreça escrita.</li>
<li><b>Comptadors que separen bici i patinet</b>, per a calcular el risc per viatge de cada un.</li></ul>`,
tec:()=>`<p>Els anys es dedueixen de les dades (anys amb els 12 mesos). La meta (−50 % en 2030) és del Pla; l'any base (${B}) és una proposta nostra i es canvia en <code>AÑO_BASE</code> de <code>scripts/exportar_web.py</code>.</p>`}
}},

es:{
marca:"Observatorio de la bici y el patinete de València", nav_obs:"Observatorio", nav_inf:"Informe", nav_pla:"El Plan, al día", salta:"Salta al contenido", toc:"Índice", tec:"Detalle técnico",
ey:"Método", h1:"Cómo lo hemos hecho",
sub:"Cada decisión del proyecto, explicada en lenguaje llano. El detalle técnico, en las cajas plegables. Todas las cifras de esta página se calculan con los mismos datos y el mismo código que el resto de la web.",
sec:{
datos:{h:"Los datos",
cos:()=>`<p>Partimos del conjunto <b>«Siniestros de tráfico»</b> del portal de datos abiertos del Ayuntamiento. Tiene <b>${fmt(M.filas)}</b> filas: una por siniestro que registra la Policía Local.</p>
<p>Solo usamos años completos: <b>${A0}-${A1}</b>. Las ${fmt(M.fuera)} filas de ${M.fuera_anys.join(", ")} quedan fuera hasta que el año esté completo. Hay <b>${fmt(M.dup)}</b> filas repetidas, iguales en todo salvo el identificador: las contamos una sola vez.</p>
<p>De cada siniestro, el portal da la fecha y la hora, la gravedad, el tipo, los vehículos y los factores. El lugar viene escrito, como una dirección («AV DEL PUERTO 12» o «C/ X cruce AV Y»). <b>No trae coordenadas.</b> Las ponemos nosotros con el callejero municipal.</p>
${tabla("Fuentes", ["Conjunto", "Para qué", "Tamaño"], [
  ["Siniestros de tráfico (portal)", "contar y situar cada siniestro", `${fmt(M.filas)} filas`],
  ["Callejero: vías, ejes y portales (portal)", "poner coordenadas a la dirección", `${fmt(M.n_ejes)} tramos de eje`],
  ["Carril bici, capa 189 (portal)", "red ciclista y Jardín del Turia", `${fmt(M.km_ciclo, 1)} km de tramos`],
  ["Contadores de bici (espiras), capa 225 (portal), y su tráfico medio diario (IMD), de Movilidad (valencia.es)", "tráfico en el carril bici", `${fmt(M.n_cont)} contadores con datos`],
  [`Tráfico medio diario de vehículos (IMD) de ${M.imd_veh}, de Movilidad, y tramos, capa 188 (portal)`, "tráfico de coches alrededor", "—"],
  ["Cruces con semáforo (reguladores), capa 182 (portal)", "contexto de cada lugar", `${fmt(M.n_reg)} reguladores`],
  ["OpenStreetMap (complemento externo)", "semáforos que faltan en la capa 182", `${fmt(M.n_osm)} semáforos`]])}
<h3>Cuántos siniestros podemos poner en el mapa</h3>
<p>Situamos en el mapa el <b>${pc(M.cob_bv_tot)}</b> de los siniestros con bici o patinete (${fmt(M.n_geo)} de ${fmt(M.n_bv)}). Pero el porcentaje cambia con los años, porque depende de cómo se anotaba el lugar en el portal. Hay tres etapas.</p>
${tabla("Siniestros situados en el mapa, por etapa del portal", ["Etapa", "Con bici o patinete", "Todos los siniestros", "Solo el nombre de la calle", "Cruce que no existe"],
  PER.map(p => [perTxt(p), pc(M.cob_bv[p]), pc(M.cob_todos[p]), pc(M.solo_calle[p]), pc(M.cruce_fallo[p])]))}
<ul><li>Hasta ${mes(M.per.P1[1])}, muchas filas traen solo el nombre de la calle, sin número ni cruce. No se pueden situar.</li>
<li>Hasta ${mes(M.per.P2[1])}, algunos «cruces» son de dos calles que no se tocan, a veces a más de un kilómetro. Parece que quieren decir «a la altura de».</li>
<li>Desde ${mes(M.per.P3[0])}, casi todas traen número o un cruce real.</li></ul>
<p>Consecuencia: <b>cualquier tendencia hecha solo con los siniestros del mapa crece de forma artificial.</b> Por eso el seguimiento del indicador del Plan lo hacemos con todos los siniestros, situados o no. Y en el mapa, cada siniestro pesa según lo bien que se situaban los de su año y tipo de dirección (sección 5).</p>`,
tec:()=>`<p><b>Geocodificación</b>, es decir, cómo ponemos coordenadas a cada dirección (<code>scripts/geocodificar.py</code>, shapely y pyproj en EPSG:25830):</p>
<ul><li><b>Cruce</b>: punto medio de los dos vértices más cercanos de los ejes de las dos vías, si están a 40 m o menos. Si no, la distancia entre segmentos, con el mismo umbral. Se hace en ese orden para que ningún cruce ya situado se mueva.</li>
<li><b>Portal</b>: coordenadas del número en la capa de portales. <b>Portal cercano</b>: el número más cercano de la misma calle.</li>
<li>Nombre normalizado (sin tildes, «PROFESSOR» = «PROFESOR», «L·L» = «L.L», paréntesis truncados) y una tabla de 4 equivalencias de calles renombradas (<code>data/processed/equivalencias_calles.csv</code>).</li></ul>
<p>De los siniestros con bici o patinete situados: ${pc(M.metodo.cruce)} por cruce, ${pc(M.metodo.portal)} por portal y ${pc(M.metodo.portal_cercano || 0, 1)} por portal cercano.</p>
<p>Etapas del portal: cortes en ${M.cortes.join(" y ")} (inicio de la segunda y la tercera). Duplicados: filas iguales en todas las columnas salvo <code>_id</code>. Dato crudo roto: ${fmt(M.unidades_rotas)} filas con los vehículos vacíos («[»).</p>
<p>Validación: muestra de 50 puntos contrastada con OpenStreetMap (Nominatim). Comprueba el nombre de la calle, no el error en metros.</p>`},

contar:{h:"Cómo contamos",
cos:()=>`<p>Un siniestro puede implicar varios vehículos. Cada siniestro con bici o patinete va a una sola de tres categorías:</p>
<div class="cats"><span>${sw("bici")}Solo bici</span><span>${sw("pat")}Solo patinete</span><span>${sw("amb")}Choque bici–patinete</span></div>
<ul><li><b>Solo bici</b>: hay al menos una bici y ningún patinete. Puede haber coches o peatones.</li>
<li><b>Solo patinete</b>: hay al menos un patinete eléctrico (VMP) y ninguna bici.</li>
<li><b>Choque bici–patinete</b>: hay al menos una bici y un patinete. El <b>${pc(M.amb_solo)}</b> son choques solo entre ellos, sin ningún coche ni peatón.</li></ul>
${tabla("Siniestros por año y categoría", ["Año", "Solo bici", "Solo patinete", "Choque bici–patinete", "Total (cada uno una vez)", "Con bici", "Con patinete"],
  M.anys.map(a => [a, fmt(SER[a].b), fmt(SER[a].p), fmt(SER[a].a), `<b>${fmt(M.bv[a])}</b>`, fmt(M.bici[a]), fmt(M.vmp[a])]))}
<p><b>Dos formas de contar, cada una en su sitio:</b></p>
<ul><li>En las <b>barras y los quesitos</b>, cada siniestro cuenta <b>una vez</b>. Es el total con el que seguimos la meta.</li>
<li>En las <b>líneas «bici» y «patinete»</b>, el choque bici–patinete cuenta <b>en las dos</b>, como hace el Plan. Por eso, en ${A1}, bici más patinete suma ${fmt(sumUlt)}, y el total es ${fmt(M.bv[A1])}.</li></ul>
<p><b>Colores en orden fijo</b> en todas las páginas: bici, patinete y choque bici–patinete. Se han elegido para que se distingan también con daltonismo. El naranja y el verde tienen poco contraste sobre fondo claro: por eso siempre van con etiqueta o leyenda.</p>`,
tec:()=>`<p>Bici = «BICICLETA» en el campo de vehículos; patinete = «VMP» (vehículo de movilidad personal). Las series «con bici» y «con patinete» coinciden con las del Plan, con diferencias de 1 o 2 siniestros por año (el Plan las saca del sistema de la Policía Local en otra fecha). El Plan nunca da la unión: sumar sus dos series cuenta dos veces los choques bici–patinete.</p>
<p>Paleta validada con un comprobador de contraste y daltonismo (deuteranopía, protanopía y tritanopía), en modo claro y oscuro.</p>`},

meta:{h:"La meta y la línea base",
cos:()=>`<p>La acción 3.2.2 del Plan Director de Seguridad Vial pone este indicador:</p>
<p class="cita">«Reducción de siniestros con ciclistas/VMP: −50 %». Línea base: «—». Fórmula: «Comparación anual».</p>
<p><b>Es el indicador de una acción, no la meta global del Plan</b>, que es de personas fallecidas y heridas graves (lo explicamos en el detalle técnico). Como la mayoría de los indicadores del Plan (${fmt(M.plan.sin_base)} de ${fmt(M.plan.ind)}), tiene la línea base vacía, y tampoco dice cómo se cuenta ni cómo se juzga cada año. Lo tenemos que decidir nosotros, y lo explicamos aquí.</p>
<h3>La línea base: ${B}</h3>
<p>Tomamos <b>${B}</b>, el último año antes del Plan. Por qué:</p>
<ul><li>el Plan se plantea «con el año ${MT["año_plan"]} como punto de partida» y vale para ${MT["año_plan"]}-2030;</li>
<li>su diagnóstico ya analiza ${B}: estudia la evolución «entre los años 2019 hasta 2025» y en detalle 2023, 2024 y 2025 (apartado 2.3.2);</li>
<li>el Plan elige ${E1["año"]} solo para los heridos graves, por la <b>calidad del dato de gravedad</b>: desde ${E1["año"]} la Policía Local adapta cada siniestro a los criterios estatales (nota 2 de la pág. 23, que remite al apartado 2.3.2). Ese motivo no afecta al recuento de siniestros, que es lo que mide la acción 3.2.2.</li></ul>
${MT.max ? `<p class="aviso"><b>${B} es el peor año de la serie.</b> Partir del peor año favorece al Plan: después de un año muy alto, el siguiente suele ser más bajo aunque no cambie nada (es la vuelta a la media). Por eso lo comprobamos también con la <b>media ${EM.etq}</b>: ${fmt(EM.base_x)} siniestros de media, meta ${fmt(EM.meta)}. Si con base ${B} se cumple y con la media no, lo diremos.</p>` : ""}
${tabla("Líneas base", ["Línea base", "Siniestros en la base", "Meta 2030 (−50 %)", "Senda: bajada cada año", `Bajada anual necesaria desde ${MT.desde}`, `Margen para ${MT.desde}`],
  ESC().map(([e, n]) => [`${e.etq} (${n})`, fmt(e.base), fmt(e.meta), pc(e.senda_anual, 1), pc(e.necesaria, 1), e.banda[MT.desde] ? `${fmt(e.banda[MT.desde][0])}-${fmt(e.banda[MT.desde][1])}` : "—"]), i => i === 0)}
<ul><li><b>La senda es una propuesta nuestra</b>: la misma bajada en porcentaje cada año, hasta llegar a la meta en 2030. No es del Plan.</li>
<li><b>La línea base y la senda las debería fijar el Ayuntamiento.</b> Si fija otras, el observatorio las cambiará.</li>
<li>${E1["año"]} queda como alternativa a la vista, pero ya no es la comparación principal.</li></ul>
<h3>Cómo contamos</h3>
<p>Cada siniestro con al menos una bici o un patinete, situado o no en el mapa, cuenta <b>una vez</b>: en ${B}, ${fmt(E0.base)}, y la meta, ${fmt(E0.meta)}. Las tablas del Plan cuentan por vehículo (bici y VMP por separado), así que un choque bici–patinete cuenta dos veces (${fmt(MT.vehiculo.dobles)} en ${B}). Con ese criterio, la base sería ${fmt(MT.vehiculo.base)} y la meta, ${fmt(MT.vehiculo.meta)}.</p>
<h3>Cómo se juzga cada año</h3>
<p>Aunque el Plan fuera exactamente por la senda, el número de siniestros de un año variaría por azar. Por eso no comparamos con la cifra exacta de la senda, sino con un <b>margen</b>: el 95 % de los valores que daría el azar alrededor de la senda. Hay tres resultados, que se calculan con los datos:</p>
<ul><li><b>«por debajo de la senda»</b>: menos siniestros que el mínimo del margen;</li>
<li><b>«no se puede descartar que vaya al ritmo»</b>: dentro del margen (no quiere decir que vaya);</li>
<li><b>«por encima de la senda»</b>: más que el máximo del margen.</li></ul>
<p>Para ${MT.desde}, la senda marca ${fmt(E0.senda[MT.desde])}, y el margen va de ${fmt(E0.banda[MT.desde][0])} a ${fmt(E0.banda[MT.desde][1])}. Además, cada año se compara con la base, con su margen de error (intervalo de confianza).</p>
<p>Ahora mismo: <b>${E0.evaluados.length ? JZ(E0, "es") : `el primer año del Plan, ${MT["año_plan"]}, aún no está publicado`}</b>. ${E0.evaluados.length ? `En ${A1} ha habido ${fmt(M.bv[A1])} siniestros; la senda prevé ${fmt(E0.senda[A1])}. Respecto a ${B}: ${fmt(E0.juicio[A1].base.razon * 100 - 100, 1)} % (intervalo de confianza ${fmt(E0.juicio[A1].base.ic[0] * 100 - 100, 1)} a ${fmt(E0.juicio[A1].base.ic[1] * 100 - 100, 1)} %). Con la media ${EM.etq}: ${JZ(EM, "es")}.` : `${B} es el punto de partida: ${fmt(E0.base)} siniestros${MT.max ? ", el peor año de la serie" : ""}, un ${pc(MT.previa)} más que en ${A0}. Aún no se puede evaluar el Plan.`}</p>
<h3>Dos series de control</h3>
<p>El número de siniestros puede cambiar por cosas que no son la seguridad de la bici y el patinete. Por eso, junto a la meta, publicamos dos series:</p>
${tabla("Series de control", ["Año", "Con bici o patinete", "De ellos, con heridos", "Todos los siniestros de la ciudad", "Parte de bici o patinete"],
  CT.años.map((a, i) => [a, fmt(CT.bv[i]), fmt(CT.bv_her[i]), fmt(CT.ciudad[i]), pc(CT.cuota[i], 1)]))}
<ul><li><b>Siniestros con heridos</b> (todos menos «sin heridos»): dependen menos de cómo se registran. El sistema de registro de la Policía Local (SIASV) se creó en julio de 2024, y lo que más crece en toda la ciudad son los siniestros sin heridos. Si baja el total pero no los siniestros con heridos, probablemente es el registro.</li>
<li><b>Parte de todos los siniestros de la ciudad</b>: si baja, la bici y el patinete mejoran más que el resto del tráfico; si el total baja pero la parte no, baja todo igual.</li></ul>`,
tec:()=>`<p>Senda del año <i>a</i>: base × 0,5<sup>(a − año base) / (2030 − año base)</sup>. Bajada anual necesaria: 1 − (meta / siniestros de ${A1})<sup>1 / (2030 − ${A1})</sup>. Meta = base / 2, redondeada al entero más cercano. El año base se cambia en un solo parámetro (<code>AÑO_BASE</code> de <code>scripts/exportar_web.py</code>) y lo usan el observatorio, el informe y esta página.</p>
<p>Margen de cada año: las cifras x para las que el intervalo de confianza del ${pc(MT.nivel)} de la razón x / base (<code>statsmodels confint_poisson_2indep</code>, método score) contiene la razón que marca la senda. Así tiene en cuenta el azar del año y el de la base. No incluye la sobredispersión (variación entre años más allá del azar), así que un año «compatible» no prueba que el Plan funcione. Antes el margen solo contaba el azar del año (<code>poisson.ppf</code>) y era más estrecho. Comparación con la base: razón de tasas con <code>statsmodels.stats.rates.test_poisson_2indep</code> (prueba <i>score</i>) y su intervalo de confianza. Con la media ${EM.etq} como base, la base son los ${EM.años.length} años juntos (exposición ${EM.años.length}). Código: <code>scripts/meta.py</code>; <code>make comprobar</code> prueba el juicio con un año simulado.</p>
<p>Con la base alternativa (${E1["año"]}), ${A1} quedaría ${fmt(E1.sobre)} siniestros por encima de su senda (${fmt(E1.senda_ult)}; margen ${fmt(E1.banda[A1][0])}-${fmt(E1.banda[A1][1])}): ${JZ(E1, "es")}. Habría que bajar un ${pc(E1.necesaria, 1)} cada año desde ${MT.desde}.</p>
<p>La meta global del Plan (apartado 4.4) es otra: −50 % de personas fallecidas respecto a 2019 y de heridas graves respecto a 2024, para todos los colectivos. El indicador de la acción 3.2.2 es de siniestros, no de víctimas.</p>`},

uso:{h:"Uso frente a siniestros",
cos:()=>`<p>Más siniestros no quiere decir por fuerza más peligro: puede que haya más gente en bici y en patinete. Lo miramos con los contadores del carril bici.</p>
<p><b>Tampoco es una subida propia de la bici y el patinete.</b> Todos los siniestros de la ciudad pasan de ${fmt(M.todos[A0])} en ${A0} a ${fmt(M.todos[A1])} en ${A1} (${pc(M.todos[A1] / M.todos[A0] - 1, 1)} más), y los que llevan bici o patinete, de ${fmt(M.bv[A0])} a ${fmt(M.bv[A1])} (${pc(M.bv[A1] / M.bv[A0] - 1, 1)}): su parte se queda en el ${pc(M.bv[A0] / M.todos[A0], 1)} en ${A0} y el ${pc(M.bv[A1] / M.todos[A1], 1)} en ${A1}. Lo que sí es propio es la composición: el patinete sube un ${pc(M.vmp[A1] / M.vmp[A0] - 1)} y la bici ${M.bici[A1] < M.bici[A0] ? "baja" : "sube"} un ${pc(Math.abs(M.bici[A1] / M.bici[A0] - 1))}.</p>
<p>Una parte de la subida puede venir de cómo se registran los siniestros: lo que más crece en toda la ciudad son los siniestros sin heridos (+${pc(VAR(SINH), 0)}), y el Plan explica que el sistema de registro de la Policía Local (SIASV) se creó en julio de 2024, tras integrar y normalizar todas las fuentes. Con heridos, los siniestros con bici o patinete sí crecen más que el resto: un ${pc(VAR(CT.bv_her), 0)} más, frente a un ${pc(VAR(CT.resto_her), 0)}. Son las series de control de la meta (apartado «La meta y la línea base»).</p>
<p>En los <b>${fmt(M.uso_n)} contadores</b> que tienen datos de tráfico todos los años (${UA0}-${UA1}), el tráfico pasa de 100 en ${UA0} a <b>${fmt(M.uso_ix[UA1])}</b> en ${UA1}. Los siniestros con bici o patinete, de 100 a <b>${fmt(M.sin_ix[UA1])}</b>.${UA1 < A1 ? ` Los datos de tráfico de Movilidad llegan hasta ${UA1} y los de siniestros, hasta ${A1}: por eso la comparación con el uso acaba en ${UA1}.` : ""}</p>
${tabla(`Índices, ${UA0} = 100`, ["Año", "Tráfico en el carril bici", "Siniestros con bici o patinete"], M.anys.filter(a => a >= UA0).map(a => [a, fmtU(M.uso_ix[a]), fmtU(M.sin_ix[a])]))}
<p>En ${UA1}, el tráfico ${varU(M.uso_ult, "es")} y los siniestros ${varS("es")}${parU("es")}.</p>
<p><b>La meta del Plan se mide en número de siniestros, no en siniestros por viaje.</b> Si el uso crece, el riesgo de cada viaje tiene que bajar más de la mitad:</p>
<ul><li>si el uso se queda como en ${UA1}, el riesgo por viaje debería bajar un <b>${pc(M.riesgo.igual)}</b> respecto a ${B};</li>
<li>si sigue creciendo como hasta ahora (${pc(M.uso_g, 1)} al año), un <b>${pc(M.riesgo.sigue)}</b>.</li></ul>
<p class="aviso">Los contadores están en el carril bici: no ven a quien va por la calzada, por las ciclocalles o por el Turia. Y probablemente cuentan bicis y patinetes juntos, sin separarlos. Son escenarios, no predicciones.</p>`,
tec:()=>`<p>IMD (intensidad media diaria) de días laborables, por mes, de las hojas de cálculo de Movilidad. Media de los meses con dato (> 0), con un mínimo de 6 meses por año. Cada contador (código P) se sitúa con el campo <code>idpm</code> de la capa 225. Índice = suma de la IMD de los ${fmt(M.uso_n)} contadores con dato todos los años con intensidades (${UA0}-${UA1}) / suma de ${UA0}.</p>
<p>Escenarios: uso ${MT["año_meta"]} / uso ${B} = ${UA1 !== B ? `(índice ${UA1} / índice ${B}) × ` : ""}(1 + g)<sup>${MT["año_meta"]} − ${UA1}</sup>, donde g es el crecimiento anual medio de ${UA0}-${UA1} (${pc(M.uso_g, 1)}) o g = 0 (el uso se queda igual). Bajada necesaria del riesgo por viaje = 1 − 0,5 / (uso ${MT["año_meta"]} / uso ${B}). En los dos escenarios, el uso de ${MT["año_meta"]} es ${fmt(M.uso30.igual, 2)} y ${fmt(M.uso30.sigue, 2)} veces el de ${B}.</p>`},

lugares:{h:"Lugares con más siniestros",
cos:()=>`<p>Un «lugar» es un <b>cruce</b> o un <b>tramo de calle</b>, no un cuadrado fijo del mapa:</p>
<ul><li><b>Cruce</b>: cada cruce del callejero municipal. Los cruces a menos de ${LG.F} m (las dos calzadas de una avenida, una calle que entra desplazada) forman uno solo. Las rotondas y plazas de hasta ${LG.plaza_max} m (${fmt(LG.n_plazas)} en toda la ciudad) son un solo cruce; las plazas grandes, como la del Ayuntamiento o la de América, no: cada entrada es un cruce con su semáforo, y fundirlas crearía un lugar que gana solo por ser grande. El cruce incluye ${LG.R} m alrededor.</li>
<li><b>Tramo</b>: el resto de cada calle, en trozos iguales de ${LG.pieza} m como máximo. Las dos calzadas de una avenida forman un solo tramo.</li>
<li>Cada siniestro va al cruce si está a ${LG.R} m o menos; si no, al tramo más cercano.</li></ul>
<p>Así, la ciudad tiene ${fmt(LG.n_nudos)} cruces y ${fmt(LG.n_tramos)} tramos. El ${pc(LG.en_nudo / LG.n_geo)} de los siniestros situados cae en un cruce. Los <b>${M.n_neg}</b> lugares con más siniestros de ${A0} a ${A1} son los «lugares con más siniestros» del mapa: ${M.tipos30.tramo ? `${M.tipos30.nudo} cruces y ${M.tipos30.tramo} tramos` : "todos son cruces"}. El tramo con más siniestros tiene ${LG.tramo_max.n} (es el lugar n.º ${LG.tramo_max.rank}).</p>
<h3>Por qué ya no usamos cuadrados de 100 m</h3>
<p>Hasta noviembre de 2026, los lugares eran los cuadrados de una cuadrícula de 100 m. La lista dependía de dónde caían las líneas: si movíamos la cuadrícula entre 25 y 75 m, de los 30 lugares se mantenían entre ${ES.rejilla.ret[0]} y ${ES.rejilla.ret[1]}. Con cruces y tramos, si cambiamos los ${LG.R} m de alrededor o la distancia para fundir cruces (20 o 40 m en lugar de 30), se mantienen entre ${ESmin()} y ${ESmax()}. Además, un cruce es donde se puede actuar.</p>
${tabla("Estabilidad de los 30 lugares con más siniestros", ["Variante", "Lugares que se mantienen (de 30)", "Siniestros en común (índice de Jaccard: 1 = iguales)"],
