<script>
"use strict";
const P = window.PLA;   // scripts/exportar_web.py: {rev, estados, n, por_estado, ejes, acts, fuentes, plan_doc, tipos, radio, cerca, top_k, con_coord}
let L = "va", F = "tots";
const CORREU = "hola@observatoribicivlc.org";
const T = {
va:{marca:"Observatori de la bici i el patinet de València", nav_obs:"Observatori", nav_inf:"Informe", nav_met:"Mètode", salta:"Salta al contingut",
  ey:"Seguiment del Pla Director de Seguretat Viària", h1:"El Pla, al dia",
  sub:"Les actuacions del Pla Director de Seguretat Viària 2026-2030 que afecten la bici i el patinet: què s'ha fet, què està en marxa, què s'ha anunciat i de què no hi ha informació pública. Cada estat porta la seua data i la seua font.",
  toc:"En aquesta pàgina", h_resum:"Resum", h_sense:"El que el Pla preveu i no s'ha publicat", h_acts:"Actuacions per eix", h_met:"Mètode", h_ref:"Referències",
  est:{hecha:"Feta", en_marcha:"En marxa", anunciada:"Anunciada", sin_info:"Sense informació pública"},
  tots:"Totes", filtra:"Filtra per estat",
  n_l:"actuacions de bici i patinet del Pla que seguim", n_l1:"actuació de bici i patinet del Pla que seguim",
  rev:(u, p) => `Última revisió validada: <b>${u}</b> · Propera revisió (trimestral): <b>${p}</b>`,
  pend:(n, a, f) => `La comprovació del ${f} ha deixat ${n} propostes de canvi (estats, notes i actuacions noves) pendents de validar: no es mostren fins que una persona les revise.`,
  cerca:(n, k, r) => `${n} dels ${k} llocs amb més sinistres de l'<a href="observatori.html">observatori</a> tenen al costat (a ${r} m o menys) una actuació del Pla amb lloc.`,
  sense_intro:n => `El Pla preveu publicar dades, informes i eines de seguiment. D'aquestes ${n} no hem trobat cap informació pública. Això no vol dir que no s'estiguen fent: vol dir que no les podem consultar.`,
  sense_aviso:"Si l'Ajuntament ho ha publicat i no ho hem trobat, ens ho pots dir i ho corregim.",
  acts_intro:"Ordenades per eix i acció del Pla. Cada fitxa porta la cita del Pla (pàgina del PDF), la font que justifica l'estat, numerada com en les referències, i una nota.",
  cuantas:(n, t) => n === t ? `${n} actuacions` : `${n} de ${t} actuacions`,
  eix:"Eix", accio:"Acció", d_meta:"Meta del Pla", d_lloc:"Lloc", d_cita:"Cita del Pla", d_font:"Font", d_nota:"Nota", d_comp:"Comprovat",
  top:(n, nom, d) => `Al costat del lloc n.º ${n} de l'observatori (${nom}${d ? `, a ${d} m` : ""})`,
data_prova:"data de la prova", aprovat:"aprovat en Ple", sense_data:"sense data",
  tipus:{plan:"Pla", nota_prensa:"nota de premsa", prensa:"premsa", documento_municipal:"document municipal", contratacion:"contractació", bop:"BOP", junta_gobierno:"Junta de Govern", respuesta_movilidad:"resposta del Servei de Mobilitat"},
  met:(p, r, d) => `<h3>Què seguim</h3><p>Les actuacions del Pla Director de Seguretat Viària de València 2026-2030 (aprovat el ${d}) que afecten directament la bici i el patinet (carril bici, ciclocarrers, aparcabicis, comptadors, controls de patinets i l'acció 3.2.2 amb les seues línies), les que en depenen clarament (zones 30, auditories, senyalització d'obres) i les de dades i seguiment que el Pla preveu (mapa de sinistres, informes, quadre de comandament, memòria, convenis). També els llocs que el Pla cita per als sinistres amb bici o patinet.</p>
<h3>Com decidim l'estat</h3><ul>
<li><span class="est e-hecha">Feta</span>: acabada o en servei.</li>
<li><span class="est e-en_marcha">En marxa</span>: contracte adjudicat, obra començada o servei que ja funciona en part.</li>
<li><span class="est e-anunciada">Anunciada</span>: hi ha un compromís públic concret, però ni obra ni contracte adjudicat. <b>Una licitació aprovada i encara sense adjudicar compta com a anunciada.</b></li>
<li><span class="est e-sin_info">Sense informació pública</span>: no hem trobat cap font pública. No vol dir que no s'estiga fent.</li></ul>
<p>Sense font no hi ha estat. Si la prova és dubtosa, triem l'estat més baix i ho expliquem en la nota. El que és anterior a l'aprovació del Pla només compta si continua funcionant o si l'Ajuntament mateix l'emmarca en el Pla. La data de cada fitxa és la de la prova, no la de la comprovació.</p>
<h3>Com ho comprovem</h3><p>Les comprovacions segueixen un procediment estandarditzat: un agent verificador recorre les fonts (notes i documents de l'Ajuntament, com la Memòria d'actuacions de mobilitat, els anuncis de la Plataforma de Contractació del Sector Públic, premsa i, pròximament, el BOP) i proposa canvis; cada proposta queda registrada amb la seua font. Una persona revisa i valida les propostes <b>cada trimestre</b>, i només es publica el que s'ha validat. El procediment està documentat en el repositori del projecte (<code>docs/plan_seguimiento.md</code>).</p>
<p>Les actuacions amb lloc s'enllacen amb els llocs de l'observatori amb la mateixa regla que els sinistres: compten en una cruïlla si estan a ${r} m o menys del seu contorn. Les actuacions de carrer (un carril bici sencer) encara no tenen la seua línia i no s'enllacen.</p>
<p>Les actuacions, les notes i les cites es mostren en la llengua original de la font.</p>
<p>És un seguiment, no una auditoria: és el que hem trobat publicat, amb la font, i està obert al fet que l'Ajuntament el corregisca o el complete.</p>
<div class="pregunta"><p><b>Saps alguna cosa que falta?</b> Escriu-nos a <a href="mailto:${CORREU}">${CORREU}</a> amb l'enllaç a la font.</p></div>`,
  ref_plan:(t, n) => `<h3>Document de referència</h3><p>${t} <span class="ref">[${n}]</span>.</p>`,
  ref_tipus:"Fonts consultades per tipus", t_tipus:"Tipus", t_cons:"Consultada", t_n:"Fonts citades", t_comp:"Última comprovació",
  si:"Sí", pendent:"Encara no (pendent)", via_notes:"A través de les notes municipals",
  ref_llista:"Fonts citades", ref_llista_t:"Numerades per ordre d'aparició i sense repetir (una per adreça). Les fitxes hi remeten amb [n].",
  mes:["de gener","de febrer","de març","d'abril","de maig","de juny","de juliol","d'agost","de setembre","d'octubre","de novembre","de desembre"]},
es:{marca:"Observatorio de la bici y el patinete de València", nav_obs:"Observatorio", nav_inf:"Informe", nav_met:"Método", salta:"Salta al contenido",
  ey:"Seguimiento del Plan Director de Seguridad Vial", h1:"El Plan, al día",
  sub:"Las actuaciones del Plan Director de Seguridad Vial 2026-2030 que afectan a la bici y al patinete: qué se ha hecho, qué está en marcha, qué se ha anunciado y de qué no hay información pública. Cada estado lleva su fecha y su fuente.",
  toc:"En esta página", h_resum:"Resumen", h_sense:"Lo que el Plan prevé y no se ha publicado", h_acts:"Actuaciones por eje", h_met:"Método", h_ref:"Referencias",
  est:{hecha:"Hecha", en_marcha:"En marcha", anunciada:"Anunciada", sin_info:"Sin información pública"},
  tots:"Todas", filtra:"Filtra por estado",
  n_l:"actuaciones de bici y patinete del Plan que seguimos", n_l1:"actuación de bici y patinete del Plan que seguimos",
  rev:(u, p) => `Última revisión validada: <b>${u}</b> · Próxima revisión (trimestral): <b>${p}</b>`,
  pend:(n, a, f) => `La comprobación del ${f} ha dejado ${n} propuestas de cambio (estados, notas y actuaciones nuevas) pendientes de validar: no se muestran hasta que una persona las revise.`,
  cerca:(n, k, r) => `${n} de los ${k} lugares con más siniestros del <a href="observatori.html">observatorio</a> tienen al lado (a ${r} m o menos) una actuación del Plan con lugar.`,
  sense_intro:n => `El Plan prevé publicar datos, informes y herramientas de seguimiento. De estas ${n} no hemos encontrado información pública. Eso no quiere decir que no se estén haciendo: quiere decir que no las podemos consultar.`,
  sense_aviso:"Si el Ajuntament lo ha publicado y no lo hemos encontrado, puedes decírnoslo y lo corregimos.",
  acts_intro:"Ordenadas por eje y acción del Plan. Cada ficha lleva la cita del Plan (página del PDF), la fuente que justifica el estado, numerada como en las referencias, y una nota.",
  cuantas:(n, t) => n === t ? `${n} actuaciones` : `${n} de ${t} actuaciones`,
  eix:"Eje", accio:"Acción", d_meta:"Meta del Plan", d_lloc:"Lugar", d_cita:"Cita del Plan", d_font:"Fuente", d_nota:"Nota", d_comp:"Comprobado",
  top:(n, nom, d) => `Junto al lugar n.º ${n} del observatorio (${nom}${d ? `, a ${d} m` : ""})`,
data_prova:"fecha de la prueba", aprovat:"aprobado en Pleno", sense_data:"sin fecha",
  tipus:{plan:"Plan", nota_prensa:"nota de prensa", prensa:"prensa", documento_municipal:"documento municipal", contratacion:"contratación", bop:"BOP", junta_gobierno:"Junta de Gobierno", respuesta_movilidad:"respuesta del Servicio de Movilidad"},
  met:(p, r, d) => `<h3>Qué seguimos</h3><p>Las actuaciones del Plan Director de Seguridad Vial de València 2026-2030 (aprobado el ${d}) que afectan directamente a la bici y al patinete (carril bici, ciclocalles, aparcabicis, contadores, controles de patinetes y la acción 3.2.2 con sus líneas), las que dependen claramente de ellas (zonas 30, auditorías, señalización de obras) y las de datos y seguimiento que el Plan prevé (mapa de siniestros, informes, cuadro de mando, memoria, convenios). También los lugares que el Plan cita para los siniestros con bici o patinete.</p>
<h3>Cómo decidimos el estado</h3><ul>
<li><span class="est e-hecha">Hecha</span>: terminada o en servicio.</li>
<li><span class="est e-en_marcha">En marcha</span>: contrato adjudicado, obra empezada o servicio que ya funciona en parte.</li>
<li><span class="est e-anunciada">Anunciada</span>: hay un compromiso público concreto, pero ni obra ni contrato adjudicado. <b>Una licitación aprobada y aún sin adjudicar cuenta como anunciada.</b></li>
<li><span class="est e-sin_info">Sin información pública</span>: no hemos encontrado ninguna fuente pública. No quiere decir que no se esté haciendo.</li></ul>
<p>Sin fuente no hay estado. Si la prueba es dudosa, elegimos el estado más bajo y lo explicamos en la nota. Lo anterior a la aprobación del Plan solo cuenta si sigue funcionando o si el propio Ajuntament lo enmarca en el Plan. La fecha de cada ficha es la de la prueba, no la de la comprobación.</p>
<h3>Cómo lo comprobamos</h3><p>Las comprobaciones siguen un procedimiento estandarizado: un agente verificador recorre las fuentes (notas y documentos del Ajuntament, como la Memoria de actuaciones de movilidad, los anuncios de la Plataforma de Contratación del Sector Público, prensa y, próximamente, el BOP) y propone cambios; cada propuesta queda registrada con su fuente. Una persona revisa y valida las propuestas <b>cada trimestre</b>, y solo se publica lo validado. El procedimiento está documentado en el repositorio del proyecto (<code>docs/plan_seguimiento.md</code>).</p>
<p>Las actuaciones con lugar se enlazan con los lugares del observatorio con la misma regla que los siniestros: cuentan en un cruce si están a ${r} m o menos de su contorno. Las actuaciones de calle (un carril bici entero) aún no tienen su línea y no se enlazan.</p>
<p>Es un seguimiento, no una auditoría: es lo que hemos encontrado publicado, con su fuente, y está abierto a que el Ajuntament lo corrija o lo complete.</p>
<div class="pregunta"><p><b>¿Sabes algo que falta?</b> Escríbenos a <a href="mailto:${CORREU}">${CORREU}</a> con el enlace a la fuente.</p></div>`,
  ref_plan:(t, n) => `<h3>Documento de referencia</h3><p>${t} <span class="ref">[${n}]</span>.</p>`,
  ref_tipus:"Fuentes consultadas por tipo", t_tipus:"Tipo", t_cons:"Consultada", t_n:"Fuentes citadas", t_comp:"Última comprobación",
  si:"Sí", pendent:"Aún no (pendiente)", via_notes:"A través de las notas municipales",
  ref_llista:"Fuentes citadas", ref_llista_t:"Numeradas por orden de aparición y sin repetir (una por dirección). Las fichas remiten a ellas con [n].",
  mes:["de enero","de febrero","de marzo","de abril","de mayo","de junio","de julio","de agosto","de septiembre","de octubre","de noviembre","de diciembre"]}};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fecha = f => { if (!f) return ""; const [y, m, d] = f.split("-").map(Number); return `${d} ${T[L].mes[m - 1]} de ${y}`; };
const dma = f => f ? f.split("-").reverse().join("/") : "";
const FN = {}; P.fuentes.forEach(f => FN[f.n] = f);
const enl = (n, txt) => `<a href="#font-${n}" class="ref" aria-label="${T[L].d_font} ${n}">${txt ?? `[${n}]`}</a>`;
const ext = (url, txt) => `<a href="${esc(url)}" target="_blank" rel="noopener">${txt}</a>`;
const chip = e => `<span class="est e-${e}">${T[L].est[e]}</span>`;
// nota: las direcciones dentro del texto pasan a [n] (las mismas que extrae exportar_web.py, en el mismo orden)
function nota(a){
  let t = esc(a.nota);
  a.fnotas.forEach(n => { t = t.split(esc(FN[n].url)).join(enl(n)); });
  return t;
}
// actuaciones, notas y citas: en la lengua original de la fuente (castellano), sin traducir (decisión del usuario, 04/11/2026)
const tit = a => `<span lang="es">${esc(a.es)}</span>`;

function resum(){
  const t = T[L], tot = P.n;
  const seg = P.estados.map(e => P.por_estado[e] ? `<span class="c-${e}" style="width:${100 * P.por_estado[e] / tot}%"></span>` : "").join("");
  const ley = P.estados.map(e => `<li>${chip(e)} <b>${P.por_estado[e]}</b></li>`).join("");
  const nc = Object.keys(P.cerca).length;
  document.getElementById("resum-c").innerHTML =
    `<div class="kpis"><div class="kpi"><div class="v">${tot}</div><div class="l">${tot === 1 ? t.n_l1 : t.n_l}</div></div></div>`
    + `<div class="barra" aria-hidden="true">${seg}</div><ul class="ley">${ley}</ul>`
    + `<p class="rev">${t.rev(fecha(P.rev.ult), fecha(P.rev.prox))}${P.rev.pend && P.rev.pend.n ? `<br>${t.pend(P.rev.pend.n, P.rev.pend.act, fecha(P.rev.pend.f))}` : ""}</p>`
    + `<p>${t.cerca(nc, P.top_k, P.radio)}</p>`;
}
function falta(){
  const t = T[L], xs = P.acts.filter(a => a.transp);
  document.querySelector('[data-t="sense_intro"]').innerHTML = t.sense_intro(xs.length);
  document.getElementById("falta").innerHTML = xs.map(a =>
    `<li><b>${esc(a.transp[L === "va" ? 0 : 1])}</b><span>${t.accio} ${esc(a.acc)}${a.meta ? ` · ${t.d_meta}: <span lang="es">${esc(a.meta)}</span>` : ""} · ${chip(a.est)} · ${enl(a.fn)}</span></li>`).join("");
}
function filtros(){
  const t = T[L], b = [["tots", t.tots, P.n], ...P.estados.map(e => [e, t.est[e], P.por_estado[e]])];
  const g = document.getElementById("filtros");
  g.querySelectorAll("button").forEach(x => x.remove());
  g.insertAdjacentHTML("beforeend", b.map(([k, v, n]) => `<button type="button" data-f="${k}" aria-pressed="${F === k}">${v} (${n})</button>`).join(""));
  g.querySelectorAll("button").forEach(x => x.onclick = () => { F = x.dataset.f; filtros(); llista(); });
}
function ficha(a){
  const t = T[L];
  const f = FN[a.fn];
  const dl = [
    a.meta && [t.d_meta, `<span lang="es">${esc(a.meta)}</span>`],
    a.lugar && [t.d_lloc, `<span lang="es">${esc(a.lugar)}</span>${a.top ? `<br><span class="top30">${t.top(a.top[0], esc(a.top[L === "va" ? 1 : 2]), a.top[3])}</span>` : ""}`],
    a.cita && [t.d_cita, `<span lang="es">${esc(a.cita)}</span> ${enl(P.plan_doc.n)}`],
    f && [t.d_font, `${enl(f.n)} ${ext(f.url, `<span lang="es">${esc(f.tit)}</span>`)} (${t.tipus[f.tipo] || f.tipo}${a.f ? `, ${dma(a.f)}` : ""})`],
    a.nota && [t.d_nota, `<span lang="es">${nota(a)}</span>`],
    a.comp && [t.d_comp, dma(a.comp)],
  ].filter(Boolean).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  return `<li class="act" id="a-${esc(a.id)}"><div class="cab"><span class="acc">${esc(a.acc)}</span>${chip(a.est)}${a.f ? `<time datetime="${a.f}">${fecha(a.f)}</time>` : ""}</div>`
    + `<h4>${tit(a)}</h4><dl>${dl}</dl></li>`;
}
function llista(){
  const t = T[L], xs = P.acts.filter(a => F === "tots" || a.est === F);
  document.getElementById("cuantas").textContent = t.cuantas(xs.length, P.n);
  const ejes = [...new Set(xs.map(a => a.eje))].sort((a, b) => a - b);
  document.getElementById("llista").innerHTML = ejes.map(e => { const ys = xs.filter(a => a.eje === e), nom = P.ejes[e] ? P.ejes[e][L] : "";
    return `<div class="eje"><h3><span class="n">${t.eix} ${e}</span> · ${esc(nom)}</h3><ul class="acts">${ys.map(ficha).join("")}</ul></div>`; }).join("");
}
function refs(){
  const t = T[L], pd = P.plan_doc;
  const filas = P.tipos.map(x => `<tr><td>${x[L === "va" ? "va" : "es"]}</td><td class="t">${x.consultada ? t.si : x.k === "junta_gobierno" ? t.via_notes : t.pendent}</td><td>${x.n}</td><td>${x.consultada && x.n ? dma(P.rev.comprobado) : "—"}</td></tr>`).join("");
  document.getElementById("ref-c").innerHTML = t.ref_plan(`${ext(pd.url, `<span lang="es">${esc(pd.tit)}</span>`)}`, pd.n)
    + `<h3>${t.ref_tipus}</h3><div class="tw"><table><thead><tr><th scope="col">${t.t_tipus}</th><th scope="col" class="t">${t.t_cons}</th><th scope="col">${t.t_n}</th><th scope="col">${t.t_comp}</th></tr></thead><tbody>${filas}</tbody></table></div>`
    + `<h3>${t.ref_llista}</h3><p>${t.ref_llista_t}</p><ol class="fonts">${P.fuentes.map(f =>
        `<li id="font-${f.n}">${ext(f.url, `<span lang="es">${esc(f.tit)}</span>`)}. <span style="color:var(--ink2)">${t.tipus[f.tipo] || f.tipo}${f.tipo === "plan" && P.plan_doc.aprob ? ` · ${t.aprovat}: ${dma(P.plan_doc.aprob)}` : f.f ? ` · ${t.data_prova}: ${dma(f.f)}` : ""}</span></li>`).join("")}</ol>`;
}
function pintar(){
  const t = T[L];
  document.documentElement.lang = L === "va" ? "ca" : "es";
  document.title = `${t.h1} · ${t.marca}`;
  document.querySelectorAll("[data-t]").forEach(el => { const v = t[el.dataset.t]; if (typeof v === "string") el.innerHTML = v; });
  document.getElementById("toc").innerHTML = [["resum", t.h_resum], ["sense-info", t.h_sense], ["actuacions", t.h_acts], ["metode", t.h_met], ["referencies", t.h_ref]]
    .map(([id, x]) => `<li><a href="#${id}">${x}</a></li>`).join("");
  document.getElementById("metode-c").innerHTML = t.met(P, P.radio, fecha(P.plan_doc.aprob));
  resum(); falta(); filtros(); llista(); refs();
  ["va", "es"].forEach(l => document.getElementById("l-" + l).setAttribute("aria-pressed", L === l));
}
try { const s = localStorage.getItem("obs-lang"); if (s === "va" || s === "es") L = s; } catch(e){}
["va", "es"].forEach(l => document.getElementById("l-" + l).onclick = () => { L = l; try { localStorage.setItem("obs-lang", l); } catch(e){} pintar(); });
pintar();
</script>
